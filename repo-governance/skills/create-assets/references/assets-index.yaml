- id: HSSCRAP-ASSET-001
  name: hsscrap
  path: assets/hsscrap
  kind: asset
  status: source-present
  purpose: Portable capture metadata, ordered media-item identity, and explicit host owner contracts.
  capabilities:
  - typed media-item records
  - capture provenance
  - metadata observations
  - host owner ports
  - bounded model validation
  - versioned capture URL normalization
  - access-scoped immutable metadata transitions
  - complete selected gallery reconciliation and stable members
  - retained association and occurrence reference validation
  - origin-preserving tag assignment plans
  - project membership and folder placement plans
  - bounded operation intents and revision-fenced replay decisions
  - durable reference-host recovery and owner receipt reconciliation proof
  - authorized URL identity candidate lookup and immutable source identity assertions
  - authorized transfer projections with strict JCS hashes and durable export cursor plans
  - typed import mapping, replay conflicts and destination media quarantine plans
  - bounded metadata and tag interaction drafts with explicit owner save and recovery plans
  - separate egui metadata and tag inspector with accessible controls
  - bounded versioned Rust WASM bridge with native outcome comparison
