schema: assets.index.v1
catalog_version: 1.1.0
updated_at: '2026-10-22'
coverage: complete
coverage_note: All first-party package manifests in this checkout and all fetched origin branches are classified.
  Source-only unfinished folders are listed separately; presence does not establish product readiness.
repository:
  url: https://github.com/Nuntissura/assets
  branch: codex/handpick
  topology: single-repository-with-subfolders
  asset_root: assets
exclusions:
- path: source-downloads
  reason: Downloaded external source material, not first-party reusable assets.
- path: assets/Kumihimo/product/third-party
  reason: Vendored dependencies maintained within Kumihimo, not first-party catalog assets.
- path: assets/handshake-studio-assets/crates/hsk-studio-score-plugin/tests/fixtures
  reason: Plugin test fixture packages, not reusable production assets.
assets:
- id: CABINET-ASSET-001
  name: Cabinet
  path: assets/Cabinet
  kind: asset
  status: source-present
  purpose: Portable hierarchy navigation and host-owned tree operations.
  capabilities:
  - tree
  - hierarchy
  - folders
  - files
  - documents
  - bookmarks
  - navigation
  - recycle bin
  - hover preview
  - restore-parent planning
  - bounded complete-inventory purge planning
