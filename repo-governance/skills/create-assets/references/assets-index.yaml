- id: HANDSHAKE-DEXTERITY-ASSET-001
  name: handshake_dexterity
  path: assets/hskernel/handshake_dexterity
  kind: asset
  status: source-present
  purpose: Pure Dexterity engine-profile validation, immutable resolved identity and explicit GenieX launch planning.
  capabilities:
  - Bundled model, engine, preset and explicit CPU/NPU device profiles with canonical fingerprints.
  - Registered-model argument plans without implicit device fallback, process execution or host authorization.
  - Explicit versioned console or GenieX test-mode result contracts with separate canonical profile-and-output fingerprints.
  manual: assets/hskernel/handshake_dexterity/README.md
  creation_rationale: Existing ModelLane navigation owns projections, while Studio worker owns framed process supervision.
    This component owns pure engine-profile resolution and planning, reuses canonical JSON, and adds no second supervisor.
  packages:
  - name: handshake_dexterity
    manifest: assets/hskernel/handshake_dexterity/Cargo.toml
    version: 0.1.0
    api: assets/hskernel/handshake_dexterity/src/lib.rs
    role: logic
