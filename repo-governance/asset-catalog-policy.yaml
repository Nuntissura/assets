schema: assets.catalog-policy.v1
version: 1.1.0
repository: https://github.com/Nuntissura/assets
catalog: assets-index.yaml
skill: repo-governance/skills/create-assets/SKILL.md
checker: repo-governance/scripts/asset_catalog.py
rules:
- id: ASSETS-CATALOG-001
  requirement: Maintain one GitHub assets repository with every asset beneath the visible assets/ parent on its
    canonical branch; do not create nested Git repositories or use permanent asset branches as the published asset
    location.
- id: ASSETS-CATALOG-002
  requirement: Before implementing reusable functionality in any host, search the current catalog by behavior and
    inspect plausible matches, their public contracts, dependencies, and manuals.
- id: ASSETS-CATALOG-003
  requirement: Reuse an adequate asset; implement and validate missing reusable capability in its owning asset before
    integrating the updated asset into a host. Keep responsibilities assigned to the host in the host.
- id: ASSETS-CATALOG-004
  requirement: Create a new asset only after inspected existing candidates cannot appropriately own the capability;
    record the reason in the new catalog entry.
- id: ASSETS-CATALOG-005
  requirement: Treat assets-index.yaml as the sole authored inventory. Generate the skill inventory copy with refresh;
    never maintain an independent skill list.
- id: ASSETS-CATALOG-006
  requirement: Catalog every first-party reusable package and composition, preserve existing names and IDs, and
    give every excluded manifest an explicit classification reason. Record unfinished source without a manifest
    as a draft, not as an installable package.
- id: ASSETS-CATALOG-007
  requirement: Record repository-relative canonical assets/ folders, package versions, dependencies, API paths,
    available manuals, and each asset work scope and existing governance entrypoint. Historical branch paths are
    aliases only; new assets must become visible canonical folders.
- id: ASSETS-CATALOG-008
  requirement: Run check after catalog, manifest, capability, bundle, source-location, retirement, or skill changes.
    Validate the affected asset's public behavior separately before host adoption; catalog checks do not establish
    product quality or compatibility.
- id: ASSETS-SYNC-001
  requirement: Treat origin at the verified GitHub repository identity as the cross-device publication target; inspect
    and freshly fetch every origin branch before discovery and before publication. Never use cached tracking refs
    alone as fresh parity proof.
- id: ASSETS-SYNC-002
  requirement: Before every skill invocation, automatically run its installed scripts/asset_sync.py before-use helper,
    then reread the updated skill and inventory. Run parity against the selected installed and mirrored copies after
    publication and report exact origin revisions and remaining drift.
- id: ASSETS-SYNC-003
  requirement: Distinguish local-only files, unpublished changes, remote-only files, revision divergence, missing
    catalog entries, package-version drift, and skill-copy drift. Never label a partial or offline comparison IN_SYNC.
- id: ASSETS-SYNC-004
  requirement: Reconcile relevant remote changes before dependent implementation. Never force-push, reset, overwrite
    another device's work, or silently choose one divergent revision. Escalate an unresolved conflict with the exact
    paths and revisions.
- id: ASSETS-SYNC-005
  requirement: Automatically publish task-owned validated asset updates with the scoped sync helper after all applicable
    owning-asset gates pass. Its private index must preserve the real index, its isolated candidate must pass meaningful
    authority-derived checks, and its normal push must stop on remote advancement. A review-required asset must
    pass its review gate before canonical publication.
- id: ASSETS-SYNC-006
  requirement: Independently fetch and reread the published revision and catalog before claiming publication; verify
    that hosts resolve their intended exact asset revision and features before claiming adoption.
- id: ASSETS-SYNC-007
  requirement: Install the repository-owned skill and its generated inventory into explicitly selected model skill
    directories on each device. Global configuration mirrors carry copies only; they do not become another asset
    authority.
- id: ASSETS-VERSION-001
  requirement: Preserve the assets.index.v1 schema and existing fields; additive catalog metadata uses catalog_version.
    Bump schema for incompatible data-format changes and catalog_version for intentional catalog-contract releases.
- id: ASSETS-VERSION-002
  requirement: Derive package versions from actual manifests, including workspace inheritance. Review semantic compatibility
    when changing public contracts; never invent a version bump merely to claim synchronization.
- id: ASSETS-VERSION-003
  requirement: Use Git commit identity and content comparison for cross-device equality; package versions alone
    never prove equal source. Report source revision at check time instead of embedding a self-referential catalog
    commit hash.
- id: ASSETS-VERSION-004
  requirement: Use source_tree fingerprints only for historical source reconciliation; every current asset must
    resolve to its canonical assets/ folder. Never require switching branches to discover or consume a current asset.
- id: ASSETS-FORK-001
  requirement: Do not fork an existing asset or maintain divergent host copies by default; try configuration, an
    adapter, composition, or a compatible extension first.
- id: ASSETS-FORK-002
  requirement: Permit a fork only when its core purpose requires a demonstrated conflict in domain rules, invariants,
    or lifecycle behavior and the original asset must retain its promised contract.
- id: ASSETS-FORK-003
  requirement: Before a fork, document both purposes and conflicting acceptance cases, explain why each nonfork
    alternative fails, define ownership and maintenance, and obtain explicit operator approval of that concrete
    decision.
- id: ASSETS-FORK-004
  requirement: Host differences, GUI frameworks, branding, storage integrations, deadlines, missing features, or
    implementation convenience alone never justify a fork. Prefer dependencies on shared components over copied
    implementations.
- id: ASSETS-FORK-005
  requirement: Keep an approved fork in its own subfolder of this repository; record fork_of and the approved fork_decision
    path in its catalog entry, preserving independent IDs and compatibility obligations.
- id: ASSETS-SCOPE-001
  requirement: Treat every asset subfolder as an independent repository-like work scope; inherit only its applicable
    rules, ownership, and proof requirements. Preserve existing strict governance and do not impose governance on
    assets that have none.
- id: ASSETS-SCOPE-002
  requirement: When isolation is needed, use a separate Git worktree of the shared repository and work within its
    selected assets/ scope; do not initialize nested repositories or make an asset-specific branch its permanent
    source location.
- id: ASSETS-SYNC-008
  requirement: The before-use helper must verify origin, freshly fetch GitHub, permit only fast-forward checkout
    updates, and install the fetched skill and generated inventory. Preserve local files and installed-skill customizations;
    stop on unresolved Git operations, divergent commits, conflicting updates, or unavailable fresh sources.
- id: ASSETS-SYNC-009
  requirement: A publication plan must list selected asset IDs, explicit task-owned file paths within each asset, and argument-array proof commands derived from inspected
    asset authority or manuals. Do not publish unrelated catalog edits, sibling-asset changes, modified proof snapshots,
    or a candidate whose proof failed.
- id: ASSETS-SYNC-010
  requirement: Preserve the caller working tree and real index during scoped publication. Independently reread the
    pushed commit and tree from freshly fetched origin; retain a failed candidate for diagnosis and require reconciliation
    before further work.
commands:
  check: python repo-governance/scripts/asset_catalog.py check
  refresh: python repo-governance/scripts/asset_catalog.py refresh
  search: python repo-governance/scripts/asset_catalog.py search --query "intended behavior"
  parity: python repo-governance/scripts/asset_catalog.py parity --skill-dir PATH
  install: python repo-governance/scripts/asset_catalog.py install --skill-dir PATH
  tests: python -m unittest discover -s repo-governance/tests -p "test_*.py"
  before_use: python PATH_TO_INSTALLED_SKILL/scripts/asset_sync.py before-use --repo PATH
  publish: python PATH_TO_INSTALLED_SKILL/scripts/asset_sync.py publish --repo PATH --plan PLAN.json
research:
  checked_at: '2026-10-22'
  sources:
  - https://doc.rust-lang.org/cargo/reference/specifying-dependencies.html
  - https://git-scm.com/docs/git-ls-tree
  - https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow
  - https://backstage.io/docs/features/software-catalog/descriptor-format/
  - https://git-scm.com/docs/git-worktree
  - https://git-scm.com/docs/git-read-tree
  - https://git-scm.com/docs/git-update-ref
  - https://git-scm.com/docs/git-merge-tree
  inspected:
  - local manifests and manuals
  - all freshly fetched origin branch trees
  - installed create-assets skill
  - global authority twins
  selected: Visible canonical assets/ parent; byte-preserving relocation and Studio import; independent asset work
    scopes; before-use fast-forward and managed skill update; private-index candidate publication with isolated
    owner proof and normal conflict-rejecting push
  reused:
  - existing assets.index.v1 identities and package fields
  - Git object database
  - existing asset folders
  - shared authority twins
  rejected:
  - independently authored skill inventory
  - per-asset repositories
  - permanent asset branches
  - version-only equality
  - automatic conflict overwrites
  - branch-only current assets
  - nested Git repositories
  - unconditional pull/rebase
  - stashing local work automatically
  - publishing the real index
  - validating a candidate against unpublished local dependencies
  risks_and_controls:
  - risk: Remote-only branch assets disappear from local discovery
    control: Scan all fetched branch manifests and record explicit source branches
  - risk: Unfinished concurrent work is accidentally published
    control: Explicit task-owned staging paths and normal fast-forward pushes
  - risk: Catalog or installed skill becomes stale
    control: Deterministic projection, manifest checks, installed-copy comparison, and GitHub workflow
  validation: Temporary-repository behavioral tests; real local catalog check; installed-copy comparison; fresh
    origin reread after publication
asset_root: assets
sync_helper: repo-governance/skills/create-assets/scripts/asset_sync.py
