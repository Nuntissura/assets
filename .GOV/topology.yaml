boundaries:
  - id: FF-BOUNDARY-PRODUCT-GOV-001
    statement: Product runtime code under product/ MUST NOT depend on .GOV/ or build/ at runtime.
  - id: FF-BOUNDARY-PRODUCT-BUILD-001
    statement: Product-local tests remain with their product package; shared and cross-package build or test infrastructure belongs under build/, all disposable output belongs under `.fforager-artifacts/`, and neither is shipped.
  - id: FF-BOUNDARY-RUNTIME-DEPENDENCY-001
    statement: Production implementation is Rust with supervised FFmpeg and ffprobe; any other runtime or native dependency requires explicit Operator approval.
  - id: FF-BOUNDARY-WATCHER-001
    statement: The watcher is diagnostic-only and process-independent from Ferric Forager.
  - id: FF-BOUNDARY-PYTHON-001
    statement: Ferric Forager is an independent Rust-native yt-dlp replacement; Python, yt-dlp, and yt-dlp companion packages or executable assets are forbidden product, build, test, canonical-verification, package, release, and runtime dependencies, while explicitly invoked non-canonical tooling may only observe an Operator-supplied external reference.
entrypoints:
  no_context_model: START_HERE.yaml
  codex_bootstrap: AGENTS.md
  claude_bootstrap: CLAUDE.md
  project_codex: .GOV/codex.yaml
  build_rules: .GOV/rules/build-rules.yaml
  build_verification_contracts: .GOV/rules/build-rules.yaml#verification_gates
  secret_scan: cargo run --manifest-path build/Cargo.toml --locked -p fforager-xtask -- secret-scan --history
  git_hooks: build/git-hooks/
  runtime_truth_gate: cargo run --manifest-path build/Cargo.toml --locked -p fforager-xtask -- runtime-truth-check --evidence-from-taskboard
  task_state: .GOV/taskboard/taskboard.yaml
  work_packet_template: .GOV/templates/WORK_PACKET_CONTRACT_TEMPLATE.json
  work_packet_requirements: .GOV/templates/WORK_PACKET_REQUIREMENTS.yaml
  product_root: product/
  build_root: build/
  artifact_root: .fforager-artifacts/
  worktree_root: .worktrees/
  cargo_workspace: build/Cargo.toml
  rust_toolchain_selector: rust-toolchain.toml
  watcher_root: product/watcher/
