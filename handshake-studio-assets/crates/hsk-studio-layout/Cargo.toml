[package]
name = "hsk-studio-layout"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[features]
default = []

[dependencies]
hsk-studio-accord = { path = "../hsk-studio-accord", version = "=0.1.0", default-features = false }
hsk-studio-folio = { path = "../hsk-studio-folio", version = "=0.1.0", default-features = false }
hsk-studio-observe = { path = "../hsk-studio-observe", version = "=0.1.0", default-features = false }
hsk-studio-type = { path = "../hsk-studio-type", version = "=0.1.0", default-features = false }
unicode-linebreak = { version = "=0.1.5", default-features = false, features = [] }
# GREP styles (lane SMB-LAYOUT-UI, STU-LAY-038): linear-time regex engine, MIT/Apache-2.0, pure Rust; dep-requests 2026-10-15.
regex = { version = "=1.12.4", default-features = false, features = ["std", "unicode"] }

[lib]
path = "src/lib.rs"

[[example]]
name = "layout-consumer"
path = "examples/layout-consumer.rs"
