[package]
name = "hsk-studio-interop-vector"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[features]
default = []
# DXF import (hsk-studio-interop-vector-core feature `dxf`, lane SMB-DXF-EPS-IMPORT). Default off.
dxf = ["hsk-studio-interop-vector-core/dxf"]

[dependencies]
hsk-studio-accord = { path = "../hsk-studio-accord", version = "=0.1.0", default-features = false }
hsk-studio-observe = { path = "../hsk-studio-observe", version = "=0.1.0", default-features = false }
hsk-studio-interop-vector-core = { path = "../hsk-studio-interop-vector-core", version = "=0.1.0", default-features = false }
hsk-studio-interop-vector-svg = { path = "../hsk-studio-interop-vector-svg", version = "=0.1.0", default-features = false }

[dev-dependencies]
hsk-studio-folio = { path = "../hsk-studio-folio", version = "=0.1.0", default-features = false }
hsk-studio-nib = { path = "../hsk-studio-nib", version = "=0.1.0", default-features = false }

[lib]
path = "src/lib.rs"

[[example]]
name = "interop-vector-consumer"
path = "examples/interop-vector-consumer.rs"
