[package]
name = "hsk-studio-render-gpu"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[features]
default = []
test-faults = []
# Render into a caller-owned wgpu device/queue/texture (plan_sink::shared; names wgpu types publicly).
shared-device = []
# Asset-local test hosts only (lane SMB-GPU-CLIENT-PORT-1, MT-36248 AC-HOST-005): the public
# `BackendChoice` and the `DeviceOptions.backend` field of the transient in-process adapter. No
# product build enables it; the product path is the GPU client port (`client`).
asset-local-backends = []

[dependencies]
hsk-studio-accord = { path = "../hsk-studio-accord", version = "=0.1.0", default-features = false }
hsk-studio-observe = { path = "../hsk-studio-observe", version = "=0.1.0", default-features = false }
hsk-studio-prism = { path = "../hsk-studio-prism", version = "=0.1.0", default-features = false }
hsk-studio-pigment = { path = "../hsk-studio-pigment", version = "=0.1.0", default-features = false }
wgpu = { version = "=27.0.1", default-features = false, features = ["std", "wgsl", "vulkan", "dx12", "metal"] }

[dev-dependencies]
hsk-studio-composite = { path = "../hsk-studio-composite", version = "=0.1.0", default-features = false }
hsk-studio-type = { path = "../hsk-studio-type", version = "=0.1.0", default-features = false }

[lib]
path = "src/lib.rs"

[[example]]
name = "render-gpu-consumer"
path = "examples/render-gpu-consumer.rs"
