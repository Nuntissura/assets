[package]
name = "hsk-studio-harness"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[features]
default = []
import = ["dep:hsk-studio-package"]
import-psd = ["import", "dep:hsk-studio-interop-psd", "dep:hsk-studio-prism"]
import-raw = ["import", "dep:hsk-studio-interop-psd", "dep:hsk-studio-prism", "dep:hsk-studio-develop"]
import-tiff = ["import", "dep:hsk-studio-interop-psd", "dep:hsk-studio-prism", "dep:hsk-studio-interop-tiff"]
import-pdf = ["import", "dep:hsk-studio-press"]
import-raster = ["import", "dep:hsk-studio-interop-psd", "dep:hsk-studio-prism", "dep:hsk-studio-interop-raster"]
# Desktop viewer state + egui UI, window-free (headless-testable): import routes, composite, render engines.
viewer = ["import-psd", "import-raw", "import-tiff", "import-raster", "import-pdf", "dep:egui", "dep:hsk-studio-composite", "dep:hsk-studio-pigment", "dep:hsk-studio-render-cpu", "dep:hsk-studio-render-gpu", "dep:hsk-studio-type", "dep:hsk-studio-pulse", "dep:hsk-studio-nib", "dep:hsk-studio-components", "dep:hsk-studio-interop-fig"]
# Window host (Operator D11: eframe 0.33.3, wgpu backend, only in this crate): binary studio-harness.
desktop = ["viewer", "dep:eframe", "hsk-studio-render-gpu/shared-device"]

[dependencies]
hsk-studio-accord = { path = "../hsk-studio-accord", version = "=0.1.0", default-features = false }
hsk-studio-folio = { path = "../hsk-studio-folio", version = "=0.1.0", default-features = false }
hsk-studio-session = { path = "../hsk-studio-session", version = "=0.1.0", default-features = false }
hsk-studio-controls = { path = "../hsk-studio-controls", version = "=0.1.0", default-features = false }
hsk-studio-observe = { path = "../hsk-studio-observe", version = "=0.1.0", default-features = false }
hsk-studio-package = { path = "../hsk-studio-package", version = "=0.1.0", default-features = false, optional = true }
hsk-studio-interop-psd = { path = "../hsk-studio-interop-psd", version = "=0.1.0", default-features = false, optional = true }
hsk-studio-develop = { path = "../hsk-studio-develop", version = "=0.1.0", default-features = false, optional = true }
hsk-studio-interop-tiff = { path = "../hsk-studio-interop-tiff", version = "=0.1.0", default-features = false, optional = true }
hsk-studio-press = { path = "../hsk-studio-press", version = "=0.1.0", default-features = false, optional = true }
hsk-studio-interop-raster = { path = "../hsk-studio-interop-raster", version = "=0.1.0", default-features = false, optional = true }
hsk-studio-prism = { path = "../hsk-studio-prism", version = "=0.1.0", default-features = false, optional = true }
hsk-studio-composite = { path = "../hsk-studio-composite", version = "=0.1.0", default-features = false, optional = true }
hsk-studio-pigment = { path = "../hsk-studio-pigment", version = "=0.1.0", default-features = false, optional = true }
hsk-studio-render-cpu = { path = "../hsk-studio-render-cpu", version = "=0.1.0", default-features = false, optional = true }
hsk-studio-render-gpu = { path = "../hsk-studio-render-gpu", version = "=0.1.0", default-features = false, optional = true }
# Text tool shaping (lane SMB-HARNESS-UI-3; edge harness -> type approved by the coordinator 2026-10-14).
hsk-studio-type = { path = "../hsk-studio-type", version = "=0.1.0", default-features = false, optional = true }
# Vector tools: anchor path model, shapes, pathfinder (lane SMB-ILLUSTRATOR-PEN; NEW edge harness -> nib, dep-requests 2026-10-15T04:20:17Z, lead report).
hsk-studio-nib = { path = "../hsk-studio-nib", version = "=0.1.0", default-features = false, optional = true }
# Program monitor (lane SMB-PULSE-PLAYBACK; edge harness -> pulse lead-approved 2026-10-15).
hsk-studio-pulse = { path = "../hsk-studio-pulse", version = "=0.1.0", default-features = false, optional = true }
# Prototype play mode (lane SMB-HARNESS-PROTOTYPE-PLAY; edges harness -> components and harness -> interop-fig lead-approved 2026-10-15, optional under viewer).
hsk-studio-components = { path = "../hsk-studio-components", version = "=0.1.0", default-features = false, optional = true }
hsk-studio-interop-fig = { path = "../hsk-studio-interop-fig", version = "=0.1.0", default-features = false, optional = true }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
egui = { version = "=0.33.3", default-features = false, features = ["default_fonts"], optional = true }
eframe = { version = "=0.33.3", default-features = false, features = ["wgpu", "default_fonts", "accesskit"], optional = true }

[lib]
path = "src/lib.rs"

[[example]]
name = "studio-harness"
path = "examples/studio-harness.rs"

[[bin]]
name = "studio-harness"
path = "src/bin/studio-harness.rs"
required-features = ["desktop"]
