[package]
name = "hsk-studio-reel-native"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[features]
default = []
av1 = ["dep:hsk-studio-accord", "dep:hsk-studio-reel", "dep:hsk-studio-worker"]
av1-worker = ["av1", "hsk-studio-reel/av1"]
test-faults = []

[dependencies]
hsk-studio-accord = { path = "../hsk-studio-accord", version = "=0.1.0", default-features = false, optional = true }
hsk-studio-reel = { path = "../hsk-studio-reel", version = "=0.1.0", default-features = false, optional = true }
hsk-studio-worker = { path = "../hsk-studio-worker", version = "=0.1.0", default-features = false, optional = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "reel-native-av1-worker"
path = "src/bin/reel-native-av1-worker.rs"
required-features = ["av1-worker"]

[[test]]
name = "av1_worker"
path = "tests/av1_worker.rs"
required-features = ["av1-worker", "test-faults"]

[[test]]
name = "worker_fault_env"
path = "tests/worker_fault_env.rs"
required-features = ["av1-worker"]
