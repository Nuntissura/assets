[package]
name = "hsk-studio-ps-core"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }
license = "Apache-2.0 OR MIT"
# Vendored fork of stet-core 0.8.4 (https://github.com/AndyCappDev/stet, Apache-2.0 OR MIT, Scott Bowman),
# lane SMB-EPS-FREE-FONTS: see NOTICE and SOURCE_PROVENANCE.json. The dependency alias keeps the
# upstream crate path names (stet_core, ...) so the vendored sources compile unchanged.

[features]
default = []

[dependencies]
fax = { version = "=0.2.7", default-features = false, features = [] }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
hayro-jbig2 = { version = "=0.1.0", default-features = false, features = ["std"] }
hayro-jpeg2000 = { version = "=0.3.5", default-features = false, features = ["std"] }
jpeg-decoder = { version = "=0.3.2", default-features = false, features = [] }
moxcms = { version = "=0.8.1", default-features = false, features = [] }
rustc-hash = { version = "=2.1.3", default-features = false, features = ["std"] }
serde = { version = "=1.0.229", default-features = false, features = ["std", "derive"] }
serde_json = { version = "=1.0.151", default-features = false, features = ["std"] }
sha2 = { version = "=0.10.9", default-features = false, features = ["std"] }
stet-fonts = { path = "../hsk-studio-ps-fonts", package = "hsk-studio-ps-fonts", version = "=0.1.0", default-features = false, features = [] }
stet-graphics = { path = "../hsk-studio-ps-graphics", package = "hsk-studio-ps-graphics", version = "=0.1.0", default-features = false, features = [] }
thiserror = { version = "=2.0.21", default-features = false, features = ["std"] }
weezl = { version = "=0.1.12", default-features = false, features = ["std"] }

[lib]
path = "src/lib.rs"
