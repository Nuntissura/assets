[package]
name = "hsk-studio-reel"
version = { workspace = true }
edition = { workspace = true }
rust-version = { workspace = true }

[features]
default = []
av1 = ["dep:rav1d", "dep:libc"]
prores = []

[dependencies]
hsk-studio-accord = { path = "../hsk-studio-accord", version = "=0.1.0", default-features = false }
hsk-studio-observe = { path = "../hsk-studio-observe", version = "=0.1.0", default-features = false }
sha2 = { version = "=0.10.9", default-features = false, features = ["force-soft"] }
miniz_oxide = { version = "=0.9.1", default-features = false, features = ["with-alloc"] }
rav1d = { version = "=1.1.0", default-features = false, features = ["bitdepth_8", "bitdepth_16"], optional = true }
libc = { version = "=0.2.190", default-features = false, features = [], optional = true }

[lib]
path = "src/lib.rs"

[[example]]
name = "reel-consumer"
path = "examples/reel-consumer.rs"
