# Round configuration for tools/run-round.sh (workspace steward owned; builders request entries via the lead).
# [crates]: every selected crate runs default features in the union unit; each set below adds one (crate, features)
# unit with its own build, test run and doctests (results features/CRATE+F1+F2/ and doctest/CRATE+F1+F2.*).
# A set naming a feature (or crate) the candidate lacks is recorded feature_absent (crate_absent) and the round
# exits 74 (declared unit absent at the candidate).
# [ignored]: (crate, feature set) units that run ONLY the crate's #[ignore]d tests (`--run-ignored only`; results
# ignored/CRATE[+F1...]/): the oracle-corpus tests, NOT_PROVEN when the corpus is absent. [] = default features.
# Lead decision after R24 (corpus-backed claims must be exercised by rounds).
# [doctest]: per-test budget for doctests (the per-test runner does not run them; nextest.toml covers the rest).
schema = "hsk.studio.round-features@2"

[doctest]
per-test-timeout-s = 120

[crates]
hsk-studio-type = [["harfrust"]]
hsk-studio-motion-js = [["quickjs"], ["quickjs", "test-faults"]]
# D24-A (SMB-D24A-CODEC-DEFAULTS, lead-approved 2026-10-16): reel studio-aac, harness studio-aac, reel-native os-encode.
# A unit's features must be the crate's own feature names (run-round: other names are feature_absent, exit 74).
# For R36 (SMB-PR-SOURCE-MONITOR, lead 2026-10-16): reel-native passthrough studio-aac (= hsk-studio-reel/studio-aac)
# runs tests/mf_aac.rs against Studio's decoder; harness os-encode runs the OS H.264 preset (worker: [prebuild]).
hsk-studio-reel = [["av1"], ["prores"], ["av1-encode"], ["av1", "av1-encode"], ["studio-aac"]]
hsk-studio-reel-native = [["av1-worker"], ["av1-worker", "test-faults"], ["mf-worker"], ["mf-worker", "test-faults"], ["mf-worker", "test-faults", "os-encode"], ["mf-worker", "test-faults", "os-encode", "studio-aac"]]
hsk-studio-score-plugin = [["test-faults"], ["clap", "test-faults"]]
hsk-studio-render-gpu = [["test-faults"], ["shared-device"], ["shared-device", "test-faults"]]
hsk-studio-score-device = [["cpal-backend"]]
hsk-studio-kernel-bindings = [["test-faults"], ["ckc-test-double"]]
hsk-studio-worker = [["test-faults"]]
# SMB-EPS-FREE-FONTS (88edeb0, lead-approved 2026-10-24): interop-vector-core eps-worker builds the EPS worker bin
# (vendored hsk-studio-ps free-font fork) and runs tests/eps_worker.rs (both required-features eps-worker);
# interop-vector eps-worker only forwards to the core feature.
hsk-studio-interop-vector-core = [["eps-worker"]]
hsk-studio-interop-vector = [["eps-worker"]]
hsk-studio-harness = [["import-psd"], ["import-psd", "import-raw"], ["import-tiff"], ["import-tiff", "import-raw"], ["import-pdf"], ["import-raster"], ["viewer"], ["desktop", "viewer"], ["media"], ["media-native"], ["audio-device"], ["audio-batch"], ["layout-ui"], ["studio-aac"], ["os-encode"], ["audio-plugin"]]
hsk-studio-composite = [["motion"]]

[ignored]
# develop: real_dng, real_raw, container_identity; interop-tiff: real_tiff.
hsk-studio-develop = [[]]
hsk-studio-interop-tiff = [[]]
hsk-studio-interop-raster = [[]]
# harness: psd-tools sweep (16 size-balanced shards, 0-15), DNG convert, vendor RAW refusals (tests/import_psd.rs needs import-psd;
# the DNG/RAW tests need import-raw).
hsk-studio-harness = [["import-psd", "import-raw"]]

[prebuild]
# F-R32-2 (R32): viewer_media.rs h264_frames_decode_through_the_media_foundation_worker spawns
# <target>/debug/reel-native-mf-worker; build it from the candidate right before the unit.
"hsk-studio-harness+media-native" = [["hsk-studio-reel-native", "reel-native-mf-worker", "mf-worker"]]
# SMB-PR-SOURCE-MONITOR (R36): timeline_captions.rs h264_preset_encodes_through_the_os_encoder_with_captions spawns the
# same worker beside the test target; its --encode modes need os-encode.
"hsk-studio-harness+os-encode" = [["hsk-studio-reel-native", "reel-native-mf-worker", "mf-worker", "os-encode"]]
# SMB-AU-WAVEFORM-EDITOR slice 4b (557ac06): tests/audio_waveform_plugin.rs spawns score-plugin-worker from the same
# target directory (else NOT_PROVEN); build it from the candidate right before the unit.
"hsk-studio-harness+audio-plugin" = [["hsk-studio-score-plugin", "score-plugin-worker"]]
