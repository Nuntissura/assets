# Studio workspace test-runner policy (cargo-nextest). Round entrypoint: tools/run-round.sh.
nextest-version = "0.9.148"

[profile.default]
fail-fast = false
retries = 0
# Per-test cap 120 s (CX-EXEC-005): flagged slow at 30 s, terminated after 4 periods.
slow-timeout = { period = "30s", terminate-after = 4 }

# F-R32-3 (lead-approved 2026-10-15): render-gpu's GPU tests slow each other down when many run at once (R32 union
# 77-91 s per test against the 120 s cap). Measured on the steward export of 673baba (58 render-gpu tests, a round
# running concurrently): 32 threads = 25 timed out, max 122 s; 8 threads = all pass, max 23.7 s, wall 64 s;
# 4 threads = all pass, max 22.9 s, wall 86 s. At most 8 render-gpu tests run at once; other crates are unaffected.
[[profile.default.overrides]]
filter = 'package(hsk-studio-render-gpu)'
test-group = 'render-gpu'

[test-groups]
render-gpu = { max-threads = 8 }

[profile.default.junit]
# Written to <target-dir>/nextest/default/junit.xml; run-round.sh copies it into each unit's results dir.
# Full results: every test is a <testcase> (passing names included), passing tests' stdout/stderr stored
# (e.g. a NOT_PROVEN branch stays distinguishable from a parity PASS), skipped tests listed (report-skipped: 0.9.143+).
path = "junit.xml"
store-success-output = true
store-failure-output = true
report-skipped = "all"

# Smoke check: run-round.sh --canary selects the first listed test of every selected package
# (computed from `cargo nextest list`, so it never names stale tests) and runs it with this profile.
[profile.canary]
fail-fast = false
retries = 0
slow-timeout = { period = "10s", terminate-after = 3 }

[profile.canary.junit]
path = "junit.xml"
store-success-output = true
store-failure-output = true
report-skipped = "all"
