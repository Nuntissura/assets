[package]
name = "fforager-storage"
version = "0.1.0"
workspace = "../../../build"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
fforager-contracts = { version = "0.1.0", path = "../fforager-contracts" }
redb.workspace = true
fforager-core = { version = "0.1.0", path = "../fforager-core" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Wdk_System_SystemServices", "Win32_System_SystemInformation", "Wdk_Storage_FileSystem", "Wdk_Foundation", "Win32_System_IO"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
disallowed_types = "forbid"
disallowed_methods = "forbid"
disallowed_macros = "forbid"
