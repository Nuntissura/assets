[package]
name = "fforager-xtask"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
cargo_metadata.workspace = true
serde.workspace = true
serde_json.workspace = true
saphyr.workspace = true
sha2.workspace = true
toml.workspace = true
redb.workspace = true
fforager-contracts = { version = "0.1.0", path = "../../../product/crates/fforager-contracts" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Diagnostics_Debug"] }

[lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
disallowed_types = "forbid"
disallowed_methods = "forbid"
disallowed_macros = "forbid"
