schema_version: handshake.template-pack.v7
kind: template_pack
identity:
  pack_id: KUMIHIMO-HSRT-MINIMAL-v1
  version: 38
  status: project_customized
payload_contract:
  marker_version: 1
  format: yaml
  exactly_one_payload_per_note: true
  duplicate_keys_allowed: false
  unresolved_placeholders_forbidden_for_selected_materialization: true
  on_demand_templates_may_retain_declared_placeholders_until_selected: true
  prose_outside_payload_is_authoritative: false
  universal_modularity_baseline:
    rule_refs:
    - BR-MODULE-LIFECYCLE-001
    - BR-MODULE-LIFECYCLE-002
    - BR-MODULE-LIFECYCLE-003
    - BR-MODULE-LIFECYCLE-004
    - BR-MODULE-LIFECYCLE-005
    - BR-MODULE-LIFECYCLE-006
    - BR-MODULE-LIFECYCLE-007
    - CODEX-MODULE-LIFECYCLE-001
    mandatory_for_every_future_project: true
    executor_independent: true
    existing_pinned_projects_require_explicit_reassessment_and_adoption: true
    legacy_gaps_must_be_reported_not_certified: true
    adoption_uses_existing_workflow: true
  dependency_meaning: Template/schema inputs; dependencies on per-WP/MT shapes do not require creating a WP/MT during
    project bootstrap.
