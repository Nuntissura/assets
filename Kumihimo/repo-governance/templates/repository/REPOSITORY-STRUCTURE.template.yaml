product_runtime_storage:
  rule_refs:
  - BR-CORE-STATE-001
  - BR-SDK-OP-001
  - BR-OBS-SURVIVAL-001
  binding: product_runtime_data_root
  version_controlled: false
  authority_owner: selected_sdk_state_and_resource_modules
  resolved_by: selected_solution_runtime_configuration
  separate_from_governance_wp_state_and_disposable_test_workspace: true
  recorder_and_operation_state_may_share_storage_with_distinct_ownership: true
  cleanup_requires_declared_retention_and_recovery_policy: true
  remote_stores_use_explicit_configured_bindings: true
machine_local_workspace:
  version_controlled: false
  root: .local/
  root_resolution: canonical_main_git_repository_root
  gitignore_entry: .local/
  bootstrap_starters_if_absent: []
  starter_values: placeholders_only_never_absolute_machine_paths
  starters_are_machine_owned_never_hash_managed: true
  entries:
  - locks/
  - claims/
  - caches/
  - staging/
  - runtime-logs/
  - host-profile.yaml
  host_profile_owner: this_file_never_version_controlled
  host_profile_fields:
  - device_classes
  - link_device
  - test_io_device
  - restart_evidence_source
  - artifact_root
  - project_workspace_root
  - hang_procedure
  - database_sync_setting
  - governance_worktree_path
  artifact_root_and_project_workspace_root_bind_here: true
  tools_manifest:
    file: tools.yaml
    fields:
    - tool_id
    - path
    - version
    - purpose
    - invocation
    - non_interactive
    - timeout_seconds
    machine_facts_live_here_never_in_codex_or_build_rules: true
    referenced_by:
    - build_rulebook.project_profile.test_environment.tools_manifest_ref
    - build_rulebook.canonical_commands
execution_mode_contract_ref: HT-AUTH-CODEX-001.execution_modes
hydration:
  manifest_driven: true
  version_pinned: true
  staged: true
  schema_validated: true
  transactional: true
  receipt_backed: true
  rollback_required: true
  solution_bindings_resolved_before_work_compilation: true
  solution_lock_is_generated_and_pinned: true
  kernel_sdk_baseline_binding_required: true
  baseline_module_manifests_required_for_product_code: true
  kernel_catalog_views_generated_from_module_declarations: true
  second_apply_requires_zero_semantic_diff: true
  bootstrap_history_archive:
    path_pattern: repo-governance/hydration/bootstrap-archive/{{digest}}/
    digest: short_hex_prefix_of_prior_bootstrap_record_sha256_extended_12_16_24_on_recorded_collision
    rule_ref: REPO-SPEC-ARCHIVE-003
    note: 'Named like the specification archive: a short digest prefix, extended on a recorded prefix collision
      with different content, never the full 64-character digest, to stay within Windows path-length limits inside
      worktrees. The full digest remains recoverable from the archived bootstrap record itself. An upgrade renames
      an existing full-digest bootstrap-archive directory to its short form when free of collision; it never renames
      existing spec-archive directories.'
managed_stock_artifacts:
  rule_id: REPO-STOCK-ART-001
  when_selected: HT-WORK-CODING-001
  overrides: temporary_output_policy_root_and_cleanup_containment_only
  root_source: host_profile.artifact_root_binding
  portable_binding: relative_to_registered_project_workspace_or_local_configuration
  absolute_machine_paths_in_stock_payload: forbidden
  root_verification: resolve_existing_registered_root_or_explicitly_authorized_provisioning_never_ad_hoc_fallback
  wp_child: controller_allocated_wp_id
  mt_children: optional_scoped_logs_and_attempts
  reuse: compatible_wp_batch_cache_with_exclusive_mutable_owner
  outside:
  - product_source
  - repo_governance
  - durable_product_runtime_storage
  activation: verify_all_wp_mt_runner_paths_under_same_bound_root_before_release
  cleanup: verified_inactive_wp_child_beneath_bound_root_no_reparse_escape_or_other_owner
  retained_evidence: existing_durable_evidence_owner_before_disposable_cleanup
  default_compatibility_temp_target: not_used_as_fallback_for_unresolved_stock_binding
