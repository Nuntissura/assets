schema_version: kumihimo.wp-contract.v1
wp_id: WP-KUM-020-foreign-window-hosting-v1
title: Optional supported foreign-application window hosting
scope:
- Extend the optional external-app package with a capability-gated native window attachment lifecycle
- Add narrow egui native-parent/epoch/physical-content-bounds hooks without exposing native handles through Core
- Embed one compatible installed app in a frame/tab and support resize, visibility/focus routing and detach to desktop
