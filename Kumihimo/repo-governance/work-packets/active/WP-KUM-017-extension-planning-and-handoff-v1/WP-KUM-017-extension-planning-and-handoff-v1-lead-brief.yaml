start_command: python repo-governance/repo-scripts/session_start.py
ownership_transfer:
  readiness: New chat may read and prepare team during WP017 publication; no source/Git/session mutation until original lead sends release and canonical session names the new lead
  after_release: Fresh lead exclusively owns session, packet state, shared integration files, Git publication and Cargo admission; original lead has no active source assignment
  existing_roles: Prior role chats/coders are held or retired; create fresh roles rather than assume prior agents are active
team:
  lead: Coordinate implementation to completion, track state and read actual evidence; do not end at a planning response
  dependency_chat: Inspect source APIs, current external sources and actual runtime/tool/cache readiness before coding admission
  diagnostic_chat: Deliberate failures directly with coding leaders, identify causal blockers and explore changed inputs before another attempt
  evaluation_chat: Author focused cases and observed evidence per packet; distinguish contracts, fixtures, actual OS/application behavior and unproven support
  coding_leader_chats: Fresh chats with gpt-6.1-sol high coding agents and bounded subagents; rotate individual coders after two implementation packets
  source_parallelism: Give disjoint files to parallel teams; serialize native.rs, lib.rs, protocol/routing, workspace manifests/lock, docs and governance
  no_parallel_cargo: Exactly one Kumihimo build/test lane across all role and leader chats
implementation_context:
  portable_boundary: Core holds arrangement, never native handles, file IO or process control. New optional kumihimo-external-apps package bundles related platform identity/tiling/hosting only
  file_drop_gap: Native runner/host traits lack a file-drop host pipeline; browser pilot has no DataTransfer/files handler. AssetAction references do not themselves transfer files
  native_hosting_gap: egui native parent helper is private and content GPU handoff rejects native child surfaces; add narrow native parent/epoch/physical-bounds hooks with capability gating
  sample_gap: render-bridge compose.rs is captured plan/image composition; BridgeDesktopHost is not the current interactive NativeHost. WP021 requires live wiring and actual providers
  shell: Kumihimo desktop shell surrounds a Servo pane and a supported external-app pane; do not claim Blender runs inside a Servo web page
  handshake: No real Handshake/Notes/Studio dependency or implementation required
  blender: Example and preferred installed test candidate; another installed program is authorized if incompatibility is observed and documented
machine_local_readiness:
  inventory_ref: .local/external-apps/planning-inventory.json
  observed_candidate: Blender installed per registry5.1.2 and executable inspected; no Blender process observed during planning; no launch or hosting proof yet
  fallback: VLC inspected, with an existing unowned VLC process; never reuse or disrupt that process. System Notepad may hand off to Store app, so process ownership must be proven
  servo_runtime_ref: .local/servo-runtime/runtime-inspection.json
  servo_config_example_ref: .local/servo-proof/35f141655e64/worker-config.json
  servo_scope: Prior real Servo0.6 Linux x64 under WSL, copied pixels into Windows x64 DX12; native Windows Servo/libservo and video/audio unproven
  cache: sccache executable found; verify current wrapper/version/stats before enabling reuse. Previous gameplan/confirmations belong WP014 and require fresh assignment checks
  resource_policy: Fresh CPU/memory/disk and Cargo/rustc/linker observations before costly work; other Rust teams may delay builds while source work continues
execution_constraints:
- Use gameplan skill preparation before costly commands and its moment checks; correct preparation to project authority, never bypass hooks
- Reuse compatible green proof only when all source/dependency/config/behavior inputs are unchanged
- Bundle affected checks once inputs stabilize; no massive full historical suite for each small failure
- Actual installed-app HWND/pixels/input and native/browser drop boundaries must be observed; mocked state or old PNGs cannot replace them
- Launch fresh owned test app/engine instances with ignored local config; do not change user app profiles, documents or existing sessions
- Default automation quiet/nonforeground; surface controlled visible/focus requirements before unavoidable input proof
- Never stop unowned processes, delete caches, run parallel Cargo or repeat failures without changed inputs/evidence
- Update internal manual and spec status from actual completed behavior; preserve hidden-by-default manual and explicit unsupported capabilities
- Keep WP state, taskboard and recovery current at meaningful milestones; commit/push after each completed packet and verify canonical origin
completion: Finish all four authorized packets or preserve exact evidence-backed blocking dependency; do not substitute documentation-only output for implementation
