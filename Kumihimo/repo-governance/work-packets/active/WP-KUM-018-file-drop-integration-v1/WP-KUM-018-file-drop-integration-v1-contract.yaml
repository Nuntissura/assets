schema_version: kumihimo.wp-contract.v1
wp_id: WP-KUM-018-file-drop-integration-v1
title: Host-owned file and asset drop integration for desktop and web
scope:
- Add optional bounded drop coordination over canonical frame/view destinations and
  existing host request/ACK routing
- Implement actual native file-drop and browser File/internal-asset adapter paths
  with host-owned effects
- Expose clear target/action preview, cancellation, rejection and pending/completed
  host outcomes; preserve arrangement-only movement
