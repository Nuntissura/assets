research_basis:
  sources:
  - id: servo-webview
    url: https://github.com/servo/servo/blob/main/components/servo/webview.rs
    observed_pattern: Host drives frame readiness, redraw and presentation; input returns an event ID whose result
      arrives asynchronously; focus is explicit; visibility does not establish disposal; shared rendering-context
      resize can affect multiple views.
    use: Model host-executed requests and later correlated acknowledgment; keep view and shared-resource ownership
      distinct.
  - id: winit-window-events
    url: https://docs.rs/winit/latest/winit/window/struct.Window.html
    supporting_url: https://docs.rs/winit/latest/winit/event/enum.WindowEvent.html
    observed_pattern: Redraw requests are event-loop work and may coalesce or be delayed; focus, resize and occlusion
      are separate signals; occlusion is unsupported on some platforms.
    use: Preserve separate signals and unknown occlusion; do not promise immediate presentation.
  - id: egui-context-output
    url: https://docs.rs/egui/latest/egui/struct.Context.html
    supporting_url: https://docs.rs/egui/latest/egui/output/struct.PlatformOutput.html
    observed_pattern: Repaint requests and deadlines are backend-mediated; frame output carries platform commands
      for the backend to execute.
    use: Keep invalidation, animation deadlines and host effects as separate protocol facts. Current latest egui
      docs report Rust 1.95, above this project's Rust 1.91; no dependency adoption.
  - id: chrome-page-lifecycle
    url: https://developer.chrome.com/docs/web-platform/page-lifecycle-api
    observed_pattern: Hidden, frozen, terminated and discarded differ; discard may have no observable event, and
      transition ordering varies.
    use: Hidden cannot imply unload, suspension or memory release; retain unknown and require reconciliation/restoration-strength
      reporting.
  - id: lsp-3.17-cancellation
    url: https://raw.githubusercontent.com/microsoft/language-server-protocol/gh-pages/_specifications/lsp/3.17/specification.md
    observed_pattern: Cancellation still receives a response; older results may remain useful; cancel or ignore
      only when no longer useful.
    use: Per-request ticket and terminal outcome; avoid global-generation invalidation. This source is the versioned
      3.17 specification, not a claim about latest LSP.
  - id: egui-dock-close
    url: https://docs.rs/egui_dock/latest/src/egui_dock/widgets/tab_viewer.rs.html
    observed_pattern: Normal close supports veto/ignore, while force-close can bypass the close callback.
    use: Enforce close approval in the canonical wrapper path, not solely through toolkit callbacks.
  - id: webview2-suspend
    url: https://learn.microsoft.com/en-us/microsoft-edge/webview2/reference/win32/icorewebview2_3?view=webview2-1.0.4191.47
    observed_pattern: Suspend is best-effort and asynchronous; success may mean only that the request was sent,
      and provider behavior can resume automatically.
    use: Keep requested and confirmed lifecycle state separate and report actual host measurements independently
      from estimates. Windows adapter evidence only.
  selected: Std-only privately owning content companion using canonical Core identity and routed mutations, scoped
    request epochs, bounded pull dispatch/recovery and declared host reservations
  reuse:
  - Core0.3 canonical IDs/Snapshot/Envelope/ledger/effective tool presentation
  - Existing optional schema1 JSON remains untouched; stable compiler outputs/cache and quiet model manual
  rejected:
  - Add a mandatory engine, GUI toolkit, async runtime, serializer or shared-asset-store dependency; these are host-owned
    and not needed for typed std-only contracts.
  - Add async identity/epoch state to Core or its persisted DTO; this packet's selected owner is a wrapper that
    observes the existing canonical mutation route.
  - Use global Core generation as an equality precondition for all asynchronous ACKs; unrelated metadata/layout
    changes would incorrectly stale valid requests.
  - Infer suspension, unloading, physical release or memory savings from hidden state, request submission or metadata
    Drop.
  - Treat UI close callbacks as the sole veto or accept tool actions based only on current focus.
  - Make guessed physical memory ceilings or engine performance claims without a concrete host adapter and measured
    scenario.
  risks_controls:
  - risk: Late, duplicate, foreign-session or provider-mismatched ACK changes current attachment state.
    control: Validate identity, session token, provider/resource/view, attachment epoch, request/channel epoch and
      request ID before effects; terminal outcomes are idempotent; reconcile unknown.
  - risk: Unrelated Core changes blanket-stale valid ACKs or restore/rebind transitions go unnoticed.
    control: Wrapper routes all execute outcomes, uses scoped transition epochs, and tests metadata-only preservation
      plus identical-ID restore and away/back rebind invalidation.
  - risk: Unknown unload or cancellation frees capacity and causes duplicate destructive effects or premature shared
      disposal.
    control: Hold bounded reservation until exact reconciliation or confirmed cleanup; separate resource leases
      from view mounts; never blindly retry.
  - risk: A close decision becomes stale before execution or is consumed twice through replay.
    control: Bind approval to host protection snapshot and canonical close ticket; only successful non-replayed
      execution consumes it.
  - risk: Queue coalescing drops accepted lifecycle or terminal acknowledgments; slow content blocks frame interaction.
    control: Pull-based bounded dispatch, explicit backpressure, reserved terminal capacity, documented coalescing
      classes, immutable dispatched tickets and bounded waits.
  - risk: UI or OS signals falsely imply content lifecycle or performance state.
    control: Model signals separately, preserve Unknown, and label estimates separately from measured host diagnostics.
  validation: Twelve public recording-host cases, focused companion compile/tests/example; preserved existing Core/JSON
    evidence, exact published source readback. No engine/GUI/physical/performance proof inferred.
