boundary_decisions:
- decision_id: EVAL-KUM-010-D01
  status: adopted_published_and_scoped_runtime_inspected
  case_refs:
  - EVAL-KUM-010-002
  - EVAL-KUM-010-003
  - EVAL-KUM-010-004
  reuse: Existing typed IDs, Identity and read-only canonical Snapshot; no second arrangement owner.
  preferred_choice: Privately owning std-only companion selected in R002-R005; full defaults/proof are fixed by the inspected contract.
  api_evidence:
  - core.rs Core owns model/allocator/receipt fields privately; snapshot returns &Snapshot.
  - Core::execute returns Outcome and Response.replayed; only successful non-replayed relevant changes should invalidate bindings.
  - Snapshot has identity/global generation but no per-view reopen or whole-state restore epoch; matching current IDs cannot identify an intervening
    identical-ID restore.
  selected_choice: Std-only kumihimo-content companion with path dependency Core0.3; private owned Core, read-only inspection and routed execute, no
    mutable Core escape/extraction API/Core epoch fields/schema1 DTO change. Fresh host-supplied controller-session token scopes all tickets; host
    guarantees uniqueness.
  authority_refs:
  - DEC-KUM-CONTENT-PROTOCOL-v1
  selected_contract_summary: Observe every routed canonical mutation and invalidate only successful non-replayed relevant transitions, including close/reopen,
    provider/ownership changes and all live restore even identical IDs. Unrelated metadata replies remain valid. Bind async work to Core identity,
    fresh controller session, exact provider/resource/view, attachment epoch and request/channel revision. Reuse canonical Snapshot rather than owning
    a second arrangement; retain existing lease entries for historical cleanup.
- decision_id: EVAL-KUM-010-D02
  status: adopted_published_and_scoped_runtime_inspected
  case_refs:
  - EVAL-KUM-010-003
  - EVAL-KUM-010-004
  - EVAL-KUM-010-005
  selected_constraints: R008/R010/R011/R013 fix terminal replay/eviction, 30000ms host deadline, one dispatched effect per instance, in-place reserved
    recovery and unchanged Core close delegation; unknown reservations held until exact reconciliation and Drop metadata-only.
  authority_refs:
  - DEC-KUM-CONTENT-PROTOCOL-v1
  selected_contract_summary: Separate current confirmed state from retired attachment cleanup. Only exact pending old cleanup/reconciliation can release
    its old reservation once; it cannot revive/update a replacement. Requested timeout/cancellation and historical receipt replay do not prove effects
    reversed or authorize blind destructive redispatch. R008/R010/R011 select terminal retention, bounded deadlines and recovery-slot reconciliation.
    Fresh attached close requires selected provider decision/host approval bound to relevant conditions, without rewriting Core Envelope intent. Retained/expired
    canonical operations delegate to Core without a fresh permission gate because they cannot newly mutate. Consume permission only after successful
    non-replayed close. Original host approved:false closes delegate unchanged through Core before any provider permit gate. Retiring uses existing
    lease metadata; one fixed typed recovery slot reserved at lease creation permits bounded cleanup despite ordinary pending/queue exhaustion. Every
    slot reuse has a fresh checked revision, and exact duplicate terminal ACK returns historical status only.
- decision_id: EVAL-KUM-010-D03
  status: adopted_published_and_scoped_runtime_inspected
  case_refs:
  - EVAL-KUM-010-002
  - EVAL-KUM-010-006
  - EVAL-KUM-010-011
  authority_refs:
  - DEC-KUM-CONTENT-PROTOCOL-v1
  selected_contract_summary: Use bounded typed pull requests with no synchronous provider execution. R006/R007 define live-instance accounting unit,
    pending/live/retired reservations, payload/queue/cache/render/default limits, overload/coalescing priority and cancellation; do not conflate logical
    tabs/resources with actual instances or bytes. Preserve host protections and unknown reservations until reconciliation. Shared-instance admission
    needs Core capability, negotiated provider capability and explicit host grant; one instance reservation can back multiple distinct mount charges.
    Finite declared cache-byte admission requires explicit host reservation amounts, while physical unknown bytes remain Unknown. Per-lease recovery
    capacity is pre-reserved fixed typed state, not an unbounded admission bypass; retired entries are not newly allocated or silently evicted. Lowering
    preserves existing reservations and cleanup capability while rejecting new growth.
  selected_defaults:
    status: adopted_in_full_contract_and_spec12
    providers: 1024
    view_mounts: 256
    live_instance_reservations: 64
    lease_entries_including_retired_unknown: 1024
    pending_requests: 1024
    unsent_queue: 1024
    receipts: 1024
    payload_string_utf8_bytes: 65536
    cache_entries: 256
    declared_cache_reservation_bytes: 67108864
    unrestricted_policy: Configurable None only as explicit opt-in; counts/reserved bytes are not actual host memory ceilings.
    aggregate_retained_protocol_opaque_bytes: 16777216
    byte_scope: All retained companion opaque request/receipt copies only; excludes Core canonical ledger storage and physical host memory; atomic
      checked and net-size coalescing admission.
    controller_session_token_utf8_bytes: 128
    ordinary_deadline_ms: 30000
    dispatched_provider_effects_per_resource_instance: 1
- decision_id: EVAL-KUM-010-D04
  status: adopted_published_and_scoped_runtime_inspected
  case_refs:
  - EVAL-KUM-010-001
  - EVAL-KUM-010-007
  - EVAL-KUM-010-008
  - EVAL-KUM-010-009
  authority_refs:
  - DEC-KUM-CONTENT-PROTOCOL-v1
  selected_contract_summary: R003/R014-R018 select version/capability compatibility, host-owned recovery-strength/reference semantics, embedded input
    and anchored resize completion, asset linked/copy/domain undo routing and invocation-time tool validation without implementing editors, engines,
    document models or an asset store.
  selected_details:
    status: adopted_in_full_contract_and_spec12
    protocol_version: Exact v1.0 compatibility for this packet; incompatible/absent provider retains placeholder and original references.
    capabilities: Typed host/provider intersection for presentation, input/embed, anchors and restoration strength; capability does not substitute
      for per-request permission.
    geometry: Finite rectangle/clip and positive scale, monotonically scoped revision, bounded opaque host anchor echoed only by matching geometry
      acknowledgment; host owns reflow.
    assets: Bounded opaque host asset identity/revision and explicit host document/domain undo scope; arrangement move performs no asset or domain
      mutation.
    tools: Current ToolId/EditingTarget plus relevant target epoch and active attachment, canonical origin/target/provider applicability and explicit
      host permission revalidated at invocation; focus never substitutes target.
- decision_id: EVAL-KUM-010-D05
  status: adopted_published_and_scoped_runtime_inspected
  case_refs:
  - EVAL-KUM-010-010
  - EVAL-KUM-010-011
  - EVAL-KUM-010-012
  authority_refs:
  - DEC-KUM-CONTENT-PROTOCOL-v1
  selected_contract_summary: R019-R021 select independent visibility/active/focus/minimized/unknown-occlusion signals, invalidation versus animation/deadline
    coalescing, explicit render/cache ownership and diagnostics with measured/estimated/unknown provenance; synthetic protocol evidence must not become
    physical performance or engine acceptance.
  selected_details:
    status: adopted_in_full_contract_and_spec12
    coalescing: Only coalesce within the unsent segment after the most recent semantic barrier for that binding. Input/tool/asset action, close/lifecycle,
      attach/detach and anchored completion are barriers; never rewrite dispatched tickets or coalesce/overtake dependent work. Confirm captured geometry/focus
      prerequisites before exposing dependent action; future queued revisions alone do not stale it. Missing prerequisite backpressure is visible,
      independent bindings remain pullable, and failed/superseded/stale prerequisites explicitly reject dependents.
    animation: Keep animation deadline separately from invalidation; supplied host ticks and earliest active required deadline, no hidden clock.
    resources: Exact host-declared owner/instance and sharing grant; cache-byte reservations are declared admission, unknown physical usage stays Unknown.
    diagnostics: Typed units and host-supplied tick/duration provenance; measured/estimated/Unknown values distinct, bounded reasons/IDs and no physical/performance
      claims.
