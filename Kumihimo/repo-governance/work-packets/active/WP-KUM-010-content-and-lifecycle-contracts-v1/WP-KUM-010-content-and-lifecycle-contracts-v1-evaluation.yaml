  - REQ-KUM-LIFECYCLE-004
  title: Moves, hidden controls, close veto and disposal ownership
  method: Move/dock a frame, hide its tool/control or tab, veto dirty close, approve eligible close, detach and dispose through distinct provider/host
    requests; include multiple declared views of one shared resource. Change unsaved/protection/pin/provider state after a provider close-permission
    request but before its reply. Drop the companion metadata without invoking host cleanup. Submit host approved:false close while provider permission
    is absent or approved; include missing and already-closed targets. Exercise HostDecisionOnly versus ProviderVeto, pinned-denied close, invalid/zero/old
    operation IDs, stale expected generation and foreign identity; compare original Core error/receipt ordering.
  expected: Arrangement moves preserve resource identity; hiding is independent of freeze/unload/disposal and memory release. Close veto preserves
    logical data and runtime obligation; confirmed disposal affects only the explicitly identified eligible attachment/instance and does not invalidate
    remaining shared consumers. Host content cleanup remains explicit. Old provider approval cannot authorize a changed current close request; the
    selected relevant revision preserves veto/host ownership rather than treating arbitrary unrelated generation as its validity rule. Drop performs
    metadata cleanup only; actual content/engine cleanup remains an explicit host obligation and no extraction API is admitted in this packet. Protocol
    attach ACK alone does not assert Core host visibility/usability without the selected explicit host update. Original host approved:false routes
    unchanged through Core missing/closed/veto and canonical receipt behavior, without consuming provider permission.
  red_team_control: Do not free a live slot merely because its logical view closed or disappeared; retain exact cleanup/recovery obligations until
    confirmation.
