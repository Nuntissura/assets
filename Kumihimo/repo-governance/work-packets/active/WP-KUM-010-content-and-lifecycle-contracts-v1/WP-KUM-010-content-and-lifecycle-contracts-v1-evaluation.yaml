    line: 291
    proof_ref: EVAL-KUM-010-P-tests
- case_id: EVAL-KUM-010-003
  refs:
  - REQ-KUM-CONTENT-001
  - REQ-KUM-CONTENT-002
  - REQ-KUM-LIFECYCLE-005
  title: Attachment epochs and late/duplicate acknowledgments
  method: Request attach, edit unrelated tab/group metadata, deliver its reply; then detach/reconnect/rebind/close-reopen and deliver old replies.
    Repeat same-incarnation whole-state restore with identical IDs, fresh-incarnation restore, out-of-order and duplicate ACKs, conflicting duplicate
    payloads and counter exhaustion. Exercise the actual selected owner/routed-execute flow, including rejected and retained-replayed restore. Avoid
    seeded attachment status as the sole proof. Deliver an old ticket to a distinct controller session with matching numbers; close/reopen then replay
    a retained old close without a new provider permit. Reuse a terminal recovery slot and deliver the prior round delayed duplicate ACK.
  expected: 'A valid current attachment reply survives unrelated canonical metadata changes. Retired binding or old request replies cannot change replacement/current
    state. Exact pending retired cleanup/reconciliation may release only its recorded old reservation once. Whole-state/fresh restore invalidates old
    bindings, foreign identity has no bookkeeping effects, and exhausted counters never wrap. Rejected/replayed canonical transitions cause no extra
    invalidation; successful restore cannot be missed through an incomplete observer feed. Controller-session mismatch rejects before bookkeeping.
    Retained/expired old canonical operations retain Core behavior: historical close replay cannot reclose the reopened view or require/consume a new
    permission. Fresh host session uniqueness is assumed, not proved by one mismatch check. Recovery-slot reuse uses a fresh checked request/revision
    identity; an old cleanup reply cannot complete a later round.'
  red_team_control: Lead-selected companion privately owns Core and observes all routed execute results; only successful non-replayed relevant transitions
    invalidate bindings. Global generation is synchronous optimistic state, and IDs alone are insufficient for async freshness. Core receipts remain
    canonical; delegated old operations must not become new effects or be rewritten to manufacture a veto.
  contract_refs:
  - WP010-R004
  - WP010-R005
  - WP010-R008
  - WP010-R011
  - WP010-R013
  - WP010-R014
  acceptance_refs:
  - WP010-A003
  runtime_status: PASS_SCOPED_RUNTIME
  runtime_observed: Unrelated rename preserves current attach ACK; exact duplicate is historical, conflicting/session replies reject; actual identical-ID
    Restore retires binding, rejected/replayed Restore preserves state; old reconciliation/detach cannot revive replacement; exhaustion atomic.
  runtime_consumer:
    path: product/kumihimo-content/tests/recording_host.rs
    function: eval_003_epochs_restore_replay_and_exact_ack
    line: 398
    proof_ref: EVAL-KUM-010-P-tests
