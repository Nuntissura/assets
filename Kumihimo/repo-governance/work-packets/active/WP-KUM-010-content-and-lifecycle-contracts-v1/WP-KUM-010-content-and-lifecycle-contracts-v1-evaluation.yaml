  method: Keep a canonical saved-tab set larger than the declared live budget; issue competing attach/resume requests, lower limits, inject host pressure,
    keep-alive/unsaved/audio/download protections and missing recovery reference, then overflow pending work. Exercise cleanup/reconciliation while
