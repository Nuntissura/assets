    and never borrows saved-tab counts or infers actual engine sharing. Host policy/eligibility and recovery references control destructive unload;
    lower budgets preserve existing obligations while bounding new growth and allowing selected recovery. Unknown/failed cleanup cannot falsely free
    capacity. Count host-declared shared resource instances independently from per-view attachment/mount records; one shared resource is not evidence
    of one engine or one mount. Companion request/receipt payload admission counts every retained opaque copy with checked arithmetic; overflow preserves
    prior pending work, receipts, reservations and revisions. Core canonical ledger storage and physical host memory remain separate.
  red_team_control: R006/R007/R011/R012 define separate instance/mount/live/retired/Unknown accounting, configurable finite defaults and host pressure/protection
