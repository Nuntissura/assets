- case_id: EVAL-KUM-010-002
  refs:
  - REQ-KUM-CONTENT-004
  - REQ-KUM-TEXT-002
  - REQ-KUM-PERFORMANCE-003
  title: Boundary routing, input/focus and bounded work
  method: Send malformed, foreign-incarnation, wrong-provider, wrong-view/resource, stale-attachment and oversized events; route frame drag versus
    content/domain input and embedded-content focus. Enqueue beyond explicit bounds while retaining a slow host request. Place noncoalescing input/tool
    work between two focus/geometry updates for the same binding. Specifically queue focus-in/geometryA, dependent input/action, then focus-out/geometryB;
    distinguish later queued intent from a confirmed or canonical binding replacement.
  expected: Validation precedes effects or reservation changes. Stable canonical ownership and negotiated input capability select the exact recipient;
    unsupported or stale work reports structured rejection. Pull-based bounded dispatch/cancellation keeps protocol work independent of synchronous
    provider execution; embedded input ownership is explicit. Coalescing preserves necessary ordering or explicitly rejects a superseded dependent
    request; it cannot silently reinterpret target, focus or coordinate meaning. Under the selected segmented rule, A and focus-in survive the action
    barrier and are delivered/confirmed before the captured action; B/focus-out cannot overtake it. Future queued revisions alone do not stale the
    earlier action, while changed identity/attachment/tool target still invalidate immediately. Pending prerequisite backpressure is visible and independent
    bindings remain pullable.
  red_team_control: Reserved per-lease recovery/ACK work survives ordinary queue exhaustion; R007 fixes finite defaults and atomic payload admission,
    R009 fixes unsent segment/barrier causality. Check structured rejection and unchanged queues, receipts, reservations and revisions on overflow.
  contract_refs:
  - WP010-R004
  - WP010-R007
  - WP010-R008
  - WP010-R009
  - WP010-R016
  acceptance_refs:
  - WP010-A002
  runtime_status: PASS_SCOPED_RUNTIME
  runtime_observed: Public geometryA/focus-in/action/geometryB/focus-out dispatch/ACK order preserved; frame-chrome, undispatched/wrong-scope ACK and
    queue overflow reject with unchanged snapshots.
