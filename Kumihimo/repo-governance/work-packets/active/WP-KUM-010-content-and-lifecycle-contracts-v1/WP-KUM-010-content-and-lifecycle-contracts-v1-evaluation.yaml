  refs:
  - REQ-KUM-LIFECYCLE-002
  - REQ-KUM-LIFECYCLE-005
  title: Requested versus confirmed lifecycle and reconciliation
  method: Request visible/background/throttled/frozen/unloaded/restoring/failed outcomes from capable/incapable providers. Inject rejection, missing/late
    ACK, timeout and cancellation with host-supplied time; reconcile observed state before retrying. Check ordinary default30000ms deadline, backward
    host ticks and checked deadline overflow, terminal receipt eviction and one dispatched effect per instance; independent instances remain pullable.
  expected: Requested, pending, confirmed, failed, unsupported and unknown remain distinct. Only a matching supported acknowledgment confirms an effect.
    Timeout/cancellation request is not proof of reversal, disposal or freed memory; unresolved reservations remain accounted until selected bound
    reconciliation establishes their outcome. Destructive retry requires that outcome rather than blind resend.
  red_team_control: R008/R010/R011 fix bounded terminal retention, monotone host milliseconds, cancellation and reconciliation. Evicted terminal IDs
    are expired/unknown, never reapplied; unsent cancellation releases only uncommitted reservations, ambiguous dispatched effects remain Unknown.
    No hidden clock or cross-process exactly-once claim.
