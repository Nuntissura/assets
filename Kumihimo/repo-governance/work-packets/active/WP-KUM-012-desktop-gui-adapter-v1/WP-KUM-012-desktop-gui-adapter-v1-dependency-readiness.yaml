alternatives:
- option: egui 0.36.2 current release
  decision: reject_for_current_candidate
  reason: Current declared Rust 1.95 floor exceeds this project's Rust 1.91 package/toolchain floor; required native viewport and wgpu/accessibility path already exists in cached 0.33.3.
- option: eframe 0.33.3 native bootstrap
  decision: reject_for_quiet_native_proof
  reason: Inspected source unconditionally makes the native root window visible after its first post-render; the adapter needs explicit hidden-window policy and observable surface errors.
- option: egui_kittest wgpu+snapshot features for rendered pixels
  decision: reject_as_default_test_feature_set
  reason: WP012-R002 selects semantic queries only; use the contract's optional capture/native path for actual raster pixels, without adding broad test renderer backends.
- option: Iced 0.14.0
  decision: reject_for_this_contract_candidate
  reason: MSRV fits, but no Iced source/archive is cached and inspected evidence does not show a better fit than the contract-selected egui draw path plus owned winit/Painter runner for this Windows native proof.
- option: Slint 1.19.0
  decision: reject_for_current_candidate
  reason: Current source declares Rust 1.95 and brings a declarative UI/compiler and renderer surface not justified by the existing immediate-mode Core geometry mapping.
- option: GPUI
  decision: reject_for_this_contract_candidate
  reason: Pre-1.0 API and latest-stable-Rust requirement with no local cache or exact bounded Windows proof path.
- option: Native UI owned by Core
  decision: reject
  reason: Would couple portable canonical state to platform windows, GUI input and renderer dependencies, violating the accepted Core/adapter/host ownership boundaries.
risks_and_mitigations:
- risk: Toolkit or test-harness interaction is mistaken for native Windows/touch/pen/accessibility proof.
  mitigation: Separate unit/harness rendered-pixel and AccessKit assertions from native x64 window, OS input, accessibility tree, resize/scale and device-recovery cases; report unsupported coverage by exact platform label.
- risk: A Core InAppFloat is mislabeled as a native OS popout or a widget viewport becomes a second layout authority.
  mitigation: Keep distinct IDs for canonical target and adapter OS window; move only after destination readiness; preserve origin/return location, close behavior and capability result in the adapter protocol.
- risk: Nested geometry, hit targets, clipping or DPI conversion diverges from Core output.
  mitigation: Drive every rectangle from Snapshot::geometry; define logical/physical scale conversion once per surface; clip content explicitly; assert input hit target and rendered target share the same canonical identity and revision.
- risk: Immediate viewport repaint coupling or default feature activation increases idle CPU and compile/download closure.
  mitigation: Prefer deferred native viewports, keep egui/winit defaults disabled, inspect invalidation/visibility behavior, and freeze target-specific features before lead lock resolution.
- risk: Provider renderer cannot share the adapter's wgpu device/queue or surface.
  mitigation: Advertise renderer-sharing capability per host/provider; use an explicit supported handoff or host-owned image/native child surface; never promise cross-device sharing or infer success from a rendered egui snapshot.
- risk: GPU/backend/driver differences make image snapshots flaky or tolerance hides a regression.
  mitigation: Pin renderer features and deterministic fixture inputs; use exact low-resolution snapshots and narrow tolerance; retain semantic/accessibility assertions and inspect failure images.
- risk: The selected Painter capture path cannot read back the negotiated surface format.
  mitigation: Its screenshot helper supports Rgba8Unorm/Bgra8Unorm; have the runner select a compatible supported surface format or return an explicit unsupported/capture failure, never a Ready receipt.
- risk: Existing eframe bootstrap unexpectedly displays a hidden proof window or hides a renderer setup failure behind a window handle.
  mitigation: Exclude eframe bootstrap; own winit creation and visibility, require Painter::set_window success, and bind readback to the current viewport/window epoch before reporting readiness.
- risk: Cached direct archives are mistaken for a fully cached resolved dependency graph.
  mitigation: Bind cache readiness to the exact 139-node Windows-filtered graph; verify all 135 registry archives and source directories against lock checksums. This does not claim cache readiness for other target-filtered graphs.
reuse_opportunities:
- Existing Core immutable Snapshot, IDs, pure geometry and canonical command route.
- Existing content-controller host boundary, request/acknowledgment ownership, provider leases and renderer effect separation.
- Cached egui 0.33.3 ecosystem and existing Rust 1.91 package floor; no change to Core or content dependency features.
focused_proof_plan:
  required_after_contract_freeze:
  - Compile the adapter for the exact declared Windows x64 target with the frozen feature set and exact workspace lock closure; lead offline resolution and independent dependency reconciliation are complete.
  - Render a deterministic fixture with nested views from at least two providers, selected/pinned state and docked toolbar; assert offscreen image output and semantic/widget target identity, then separately prove correlated native-surface readback.
  - Exercise keyboard commands and native touch/pen/mouse paths with target/scale coherence; distinguish injected events from OS/hardware evidence.
  - Verify adapter-owned native popout creation, readiness-before-move, return/redock, close and capability fallback on each claimed platform; web remains separately labeled.
  - Exercise resize, DPI/scale transitions, occlusion/minimize, surface loss/recreation and bounded recovery; separate injected loss from actual device loss.
  - Inspect egui_kittest AccessKit semantic data separately from the native AccessKit event-loop bridge and independent Windows UI Automation tree/action query bound to the owned HWND; report unproven platforms explicitly.
  - Confirm default Core/content builds remain GUI-free and adapter features are selected only by the optional package/feature.
  run_boundary: Lead ran cargo metadata with all features, x86_64-pc-windows-msvc filter and offline mode; dependency role independently parsed the resulting graph, lock, manifests, cache archives and cached sources. No build, tests, install or network download ran; offline download delta is 0 bytes. Dependency role made no product, manifest, state, spec or Git edits.
