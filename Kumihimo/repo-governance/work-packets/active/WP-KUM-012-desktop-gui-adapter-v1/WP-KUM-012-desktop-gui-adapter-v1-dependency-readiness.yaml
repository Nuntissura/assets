research:
  reviewed_primary_sources:
  - id: egui-wgpu-0.33.3-winit-painter
    url: https://docs.rs/egui-wgpu/0.33.3/egui_wgpu/winit/struct.Painter.html
    supporting_source: https://github.com/emilk/egui/blob/0.33.3/crates/egui-wgpu/src/winit.rs
    observed: The public winit Painter associates per-viewport Windows and surfaces; set_window returns WgpuError; paint_and_update_textures acquires/renders/submits/presents and accepts correlated capture data, with screenshot events returned after GPU readback.
    use: Use as the small public native renderer boundary; surface/setup failures and captures stay explicit and attributed to the exact viewport.
  - id: egui-winit-0.33.3
    url: https://docs.rs/egui-winit/0.33.3/egui_winit/struct.State.html
    supporting_source: https://github.com/emilk/egui/blob/0.33.3/crates/egui-winit/src/lib.rs
    observed: State translates winit events and supports optional AccessKit integration through init_accesskit, event processing and platform-output handling.
    use: Reuse native input/accessibility translation while the adapter owns the event loop, hidden-window policy and error receipts.
  - id: eframe-0.33.3-native-bootstrap
    url: https://github.com/emilk/egui/blob/0.33.3/crates/eframe/src/native/epi_integration.rs
    observed: Its first post-render hook calls Window::set_visible(true); this conflicts with the required controlled quiet hidden-window path.
    use: Reject eframe's native bootstrap for this adapter; retain egui UI and renderer crates through the public winit integration.
  - id: egui-0.33.3-viewports
    url: https://docs.rs/egui/0.33.3/egui/viewport/index.html
    observed: egui supports multiple native-window viewport descriptions; upstream native eframe implements them, while web does not. Deferred viewports repaint independently; immediate viewports can multiply repaint work. Embedded fallback is not an OS window.
    use: The custom runner must implement viewport creation/event routing and prove it before claiming native popout support; bind viewport identity to canonical Core targets and keep popout return/docking ownership outside egui.
  - id: egui-kittest-0.33.3
    url: https://docs.rs/egui_kittest/0.33.3/egui_kittest/
    observed: AccessKit-based UI queries support semantic interaction and the optional wgpu+snapshot features render UI pixels into saved image snapshots. Documentation warns screenshots vary with GPU/backend and high tolerances can hide defects.
    use: Focused rendered-sample/accessibility evidence; not proof of OS presentation, touch/pen hardware, native accessibility behavior, or real device-loss recovery.
  - id: egui-current-release
    url: https://github.com/emilk/egui/blob/main/Cargo.toml
    observed: Current egui 0.36.2 declares Rust 1.95, above the project's Rust 1.91 floor.
    use: Reject current egui for this package candidate under the existing MSRV; R002 selects egui 0.33.3 and excludes eframe.
  - id: eframe-0.36-changes
    url: https://github.com/emilk/egui/blob/main/crates/eframe/CHANGELOG.md
    observed: eframe 0.34 changed app callbacks from one update method to separate logic and UI; wgpu became the default renderer. 0.34.3 added winit access to Frame and CreationContext.
    use: Historical eframe API evolution only; R002 excludes eframe, so these callbacks and renderer defaults do not shape the selected adapter.
  - id: iced-0.14
    url: https://docs.rs/crate/iced/0.14.0/source/Cargo.toml
    observed: Iced 0.14.0 has Rust 1.88 minimum and feature-selectable wgpu/software rendering; its package directly composes multiple iced subcrates.
    use: Viable alternative, but its source/build closure is not cached here; the selected egui 0.33.3 path has a cached, contract-matched native renderer boundary.
  - id: slint-1.19
    url: https://github.com/slint-ui/slint/blob/master/Cargo.toml
    observed: Current Slint 1.19.0 declares Rust 1.95 and defaults include software/femtovg renderers and accessibility.
    use: Reject current release for the Rust 1.91 package floor; reassess only with an explicit toolchain/MSRV decision.
  - id: gpui
    url: https://github.com/zed-industries/zed/blob/main/crates/gpui/README.md
    observed: GPUI is pre-1.0 and its project documentation asks for latest stable Rust.
    use: Reject for this bounded WP because the exact stable API/MSRV and cached dependency closure are not established.
