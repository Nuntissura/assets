  - '[WP012-R011] Implement a thin optional native winit ApplicationHandler runner using public egui-winit State
    and egui-wgpu::winit::Painter, reusing field implementations and preserving their license/provenance where
    code is adapted. Use Painter set_window Result and actual correlated screenshots; never eframe first-frame
    auto-show or an immediate callback as graphics readiness. Root and child automation windows are created
    hidden, inactive and absent from taskbar, never activated/shown/focused by automation. Interactive showing
    is an explicit user-run opt-in command. OS handles, surface epoch, physical dimensions/scale, backend, screenshot
    nonce and image bytes are observed; independent foreground/visibility/owned-PID reads prove quiet behavior.
