  title: Rendered recursive mixed-provider composition
  method: Render a host-chosen nested split/grid with different view counts and at least two actually rendered
    provider implementations; vary counts, grid weights and holes, add a containment level, shrink and restore
    the viewport. Selected actual providers are editable text/demo document and generated image/canvas, explicitly
    labeled demos. With backgrounds selected, draw actual host still texture behind content with brightness/opacity/fit
    and inspect legibility; unsupported video/audio/decoder/native-child or incompatible GPU handoff is explicit.
  expected: Rendered panes match canonical ownership and derived geometry; shared boundaries align, clipping
    contains output, supported content remains reachable and unsupported compositing is explicit. Demonstrated
    counts are examples, never a ceiling.
  red_team_control: 'Reject impossible geometry, cycles and unsupported integration without losing existing
    identities; a missing provider has a labeled recoverable placeholder. Maximize an ancestor while descendant
    contexts remain retained: hidden descendants must neither paint nor accept input; derive child bounds from
    owner content with ancestor clipping.'
  evidence:
  - Inspect actual renderer-produced images at normal and narrow sizes against canonical Core snapshot/geometry.
  - Record provider identity and actual integration path; decorative labels or recorded callback counts alone
    do not prove mixed rendering.
