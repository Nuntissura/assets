  selected_contract_controls:
  - '[WP012-R001] Preserve the complete desktop-adapter stub and accepted recursive/variable-count workspace
    intent. Implement an actual reusable optional GUI adapter, controlled rendered mixed-provider sample and
    separately observed Windows x64 native runner. Toolkit chrome/layout state is never a second canonical layout
    owner. Full platform, physical hardware and real-engine requirements remain open beyond the exact observations
    below.'
  - '[WP012-R003] Use small cohesive modules in this one GUI package; native and raster dependencies are independently
    selectable feature boundaries. Reusable adapter borrows the host-owned Controller and host dispatcher per
    surface/draw. Host allocates actor/Envelope operation identity and serial canonical commands; no mutable
    Core extraction, duplicate Controller, private canonical tree or alternate sequence allocator. Native sample
    may own the single shared Controller/dispatcher for every surface. Public adapter version/capabilities describe
    implemented versus observed platform behavior and explicit unsupported/unknown states.'
  - '[WP012-R004] Project workspace/frame/tab/group/tool geometry from current canonical Snapshot/Core geometry
    and stable IDs. Traverse nested owners iteratively top-down, deriving each child context from its owner
    frame_content only when measurements change, through host-dispatched SetGeometryContext. Intersect all ancestor
    clips; suppress hidden/maximized descendants while retaining their identities and an accessible reveal/restore
    route. Convert finite global logical DIP to physical pixels once per surface, validate scale/size/arithmetic
    and surface epoch. Host-configurable projection/control/page budgets limit live work, not saved counts or
    conceptual nesting. Rejection/undersized overflow is visible with a reachable pane/tab list; never silently
    drop content.'
  - '[WP012-R010] Host render/content slots receive exact canonical target, global bounds/clip, local mapping,
    physical size/scale, visibility/focus and surface epoch. Offer ordinary egui drawing and capability-checked
    compatible GPU texture/PaintCallback handoff only under capture/native features; native child surfaces and
    incompatible graphics devices reject explicitly. The sample supplies two real small host-owned renderers
    (editable text/demo document and generated image/canvas preview), labelled as demos rather than Notes/Studio/terminal/Servo
    engines. Actual provider interaction/typed ACK proves recipient, not engine integration. If backgrounds
    are selected demonstrate a host-provided still texture behind content with brightness/opacity/fit/legibility;
    video/decoder/audio remain unsupported unless an actual provider is supplied, no mock decoder or physical-saving
    claim.'
  evaluation_scope: Frozen bounded WP012 case; full physical hardware, real engines/external GPU fault and other-platform
    acceptance remain open per contract non_goals. Actual owned native/UIA/raster observations required by mapped
    acceptances cannot be replaced with semantic fixtures.
