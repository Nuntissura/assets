  title: Native popout readiness, return, veto and failure
  method: Create a separately supported native destination; move view/group only after readiness, retry the
    same operation, close with return policy, remove original pane and exercise content veto; test destination
    creation failure and interrupted handoff. Exercise individual view, group and whole-frame handoff; reuse
    bounded carrier/root slots, fail partial preparation and test custom-layout return anchors, maximized destinations
    and mixed close/veto outcomes. Roundtrip and reconcile versioned DesktopSession metadata alongside unchanged
    SavedLayout/schema1; duplicate/foreign/stale bindings, restored incarnation mismatch and occupied or owned
    carrier reject before new native association. Old native handle/texture identity is never trusted on restore.
  expected: Actual distinct OS windows own their overlays/input/accessibility; one canonical layout owner retains
    content, return/fallback is reachable and failures never lose or duplicate views. Return uses revalidated
    semantic placement or an explicit reachable fallback; ordinal alone does not claim restoration of custom
    slots/weights. Partial close outcomes remain distinct and a held native window retains surviving content.
  red_team_control: A second in-app panel or synthetic window ID is not native popout proof. Unsupported capabilities
    explain the limit without masquerading as a float. Popup/dialog state stays transient. Reject caller-supplied/fake,
    wrong-window, old-epoch, wrong-nonce, wrong-size or timed-out readiness evidence; revalidate canonical generation
    and ownership at commit. Capture receipt fields are runner metadata, not OS observations by themselves.
    Capture final Envelope freshness after real root/context preparation mutations; reject occupied/owned reused
    carriers and reset their exact context. Bound empty roots/handles without claiming nonexistent DeleteWorkspace/DeleteFrame.
    Empty-root capture is preflight only; device loss after a committed move is recovery, not proof the source
    remained unchanged.
  evidence:
  - Independent OS window/process observation, actual rendered source/destination, destination-ready result
    and canonical before/after ownership.
  - Native close/focus/return and failed destination observations; browser popup/origin proof remains separately
    scoped to the web adapter.
  - Proposed thin winit/egui-winit/egui-wgpu runner owns actual window and private capture channel; readiness
    requires successful surface binding plus first matching nonzero actual capture, correlated to handle/epoch/nonce/viewport/backend
    and canonical intent. Independently inspect captured pixels and OS handle/ownership; absent capture means
    no handoff.
  - Hidden native surface acquire/present/readback remains runtime-unverified; even when observed it does not
    prove visible compositor display, native user gestures or OS accessibility. After canonical move, inspect
    destination content/image/input recipient and source removal independently.
