observed_baseline:
- Clean session-start HEAD bdd19d6; WP012 remains a planned work_packet_stub and canonical gui_check is null.
- Workspace contains Core0.3, layout-json0.1 and content0.2 only; content uses protocol2.0 and independently
  optional navigation/backgrounds, default empty.
- Core DockIntent supports dock/float/redock/preview; SurfaceKind currently has only InAppFloat. Native window
  readiness/return and OS observers are not existing Core APIs.
- Content Geometry carries rect/clip/scale; generic Input is host-owned payload. Navigation PointerKind and
  gesture settlement are semantic contracts, not evidence of physical hardware/capture.
- controls_host explicitly reports host rendering external. Existing diagnostic samples are host-fed and cannot
  independently prove physical rendering/resources.
- Snapshot::geometry(workspace) uses that workspace context and returns its frame/content/clip/tool projection.
  Proposed nested adapter traversal must derive child viewport from owner content and intersect ancestor clips;
  this traversal is not implemented or proven.
- Scheduler eligibility compares Input.x/y directly against supplied Geometry.clip in the same logical DIP space
  and rejects FrameChrome input to providers; local provider coordinates must be mapped once after that boundary,
  not substituted before clip validation.
- Scheduler checks ToolAction target view/resource against current tool and mount, then current visibility/usability/applicability/provider
  availability. GUI action proof must observe the actual host recipient.
