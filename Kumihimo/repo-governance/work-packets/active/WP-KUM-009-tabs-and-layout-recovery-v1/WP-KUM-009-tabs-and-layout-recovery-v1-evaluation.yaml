  - REQ-KUM-MODEL-001
  method: Reorder/move tabs with selected and unselected siblings, close selected/last/dirty tabs under host allow and veto, then reopen
    from retained metadata; include two views of one resource.
  expected: Close requires current explicit host permission and pin approval; veto preserves membership/unsaved state. Approved close
    retains ViewId/resource/frame/index/group/pin tombstone, removes only open membership; selected close picks first remaining or none,
    unselected close retains selection. Reopen preserves identity, clamps eligible index, resets volatile confirmation and rechecks
    sharing/open-view/record/pin budgets. Closed admission defaults1024, configurable/unrestricted with no silent eviction; lowering
    permits unchanged/decreasing recovery. No content or engine effects follow.
