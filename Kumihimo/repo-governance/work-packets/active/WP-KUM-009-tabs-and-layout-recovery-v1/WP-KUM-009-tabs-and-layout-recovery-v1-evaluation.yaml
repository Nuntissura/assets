- Exact remote/current/published product binding and contracted lead-owned runtime proof independently inspected; this is a scoped headless verdict,
  not complete RECOVERY or cross-platform acceptance.
proof_plan:
- Resolve exact published predecessor/readiness under WP009-R001 before coding; frozen cases cover R002-R022 and acceptance A001-A009.
- Coder owns public consumer assertions plus quiet core/JSON examples and no-context manual under R023; lead owns exact default-core/all-features
