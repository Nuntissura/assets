red_team_preparation:
  authority: Historical preparation controls resolved by full WP009 R007-R022; source seams remain bounded implementation inputs, not
    findings against a WP009 candidate
  boundaries:
  - Incarnation mismatch must precede replay lookup/high-water effects; fresh token inequality with one saved token cannot prove host
    uniqueness across prior instances.
  - Same-lineage live restore needs immutable extant identity checks and allocator protection covering closed records/omitted newer
    IDs; retained receipts are historical acknowledgments, not current membership proof.
  - Closed records and open frame membership need distinct validation; effective tool usability must not be revived by supplied host
    true flags, and closed view-edge reservations need explicit dormant handling.
  - Restore preparation must bind DTO and target generation/incarnation plus provider-resolution/bounds policy; source generation is
    provenance, not live state.
  - Bounded codec must reject duplicate input before map overwrites and size before parsing; validated numeric deserialization must
    preserve constructors, normalized zero and exact Eq.
  - Maximize projection must not restore an old full Snapshot over intervening tab/group edits; topology/packing/docking restrictions
    and allowed geometry updates need explicit selection.
  verified_source_seams:
  - arrangement.rs lines 201-203 index every prior frame in the candidate; restore omitting newer frames needs a whole-state activation
    path that skips legacy repair/measurement migration.
  - tools.rs lines 109-124 uses host flags only; solver consumes presentation in minimum measurement, reservation and output. Closed/provider-missing
    policy needs one consistent snapshot-aware effective path.
  - docking.rs line 295 calls ownership movement internally; affected-workspace maximize guards must cover direct and Dock/CommitPreview
    routes, both source/destination and cell-tool edits.
  - Retained sibling/float minima belong to ordinary solver geometry; selected maximize projection and restoration under changed constraints
    need explicit geometry/rejection rules.
gap_flags:
- No blocking contradiction found between the full R001-R023/spec9 choices and these focused cases; independent publication readback
  and final dependency readiness remain prerequisites.
- No WP009 implementation candidate or runtime proof inspected; prepared cases establish no product behavior.
proof_plan:
- Resolve exact published predecessor/readiness under WP009-R001 before coding; frozen cases cover R002-R022 and acceptance A001-A009.
- Coder owns public consumer assertions plus quiet core/JSON examples and no-context manual under R023; lead owns exact default-core/all-features
  workspace check/test/example matrix in contract proof.
- JSON proof uses actual bounded wire bytes, not Snapshot cloning; pure stamp proof never claims host filesystem atomicity.
- Evaluator inspects stabilized candidate and serialized lead results, binds exact runtime inputs/publication and reuses unchanged green
  proof instead of duplicate Cargo.
