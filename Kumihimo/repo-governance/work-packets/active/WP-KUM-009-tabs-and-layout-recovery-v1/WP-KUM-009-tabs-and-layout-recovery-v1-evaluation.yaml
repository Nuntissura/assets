- JSON proof uses actual bounded wire bytes, not Snapshot cloning; pure stamp proof never claims host filesystem atomicity.
- Evaluator inspects stabilized candidate and serialized lead results, binds exact runtime inputs/publication and reuses unchanged green proof
  instead of duplicate Cargo.
