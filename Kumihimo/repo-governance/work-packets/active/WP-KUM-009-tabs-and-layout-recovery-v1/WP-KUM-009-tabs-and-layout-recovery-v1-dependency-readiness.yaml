    observed: DockState gates Serialize/Deserialize with its serde feature and explicitly skips translations; this
      supports selective semantic serialization, not serializing all runtime state.
  - url: https://dockview.dev/docs/core/panels/tabOverflow/
    observed: Mature overflow patterns include reachable dropdown lists, optional scrolling and searchable keyboard
      navigation rather than shrinking every tab.
  - url: https://dockview.dev/docs/core/panels/tabGroups/
