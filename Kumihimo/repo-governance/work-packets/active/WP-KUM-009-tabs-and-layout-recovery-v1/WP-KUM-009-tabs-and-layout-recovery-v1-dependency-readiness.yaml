dependency_decision:
  status: selected_by_dev_lead_and_reconciled_to_full_contract_spec9
  required_default_profile:
    core_default_external_dependencies: []
    independently_usable_core: true
    compulsory_gui_or_platform_backend: false
  selected_architecture_candidate:
    semantic_owner: product/kumihimo-core
    wire_package: product/kumihimo-layout-json
    wire_format: JSON
    core_feature: optional_serde_feature_default_off
    filesystem_owner: host adapter
    provider_resolution_owner: host adapter using explicit stable provider keys and opaque restore references
    scope_note: Exact lead selections are present in WP009-R002–R012 and reconciled below. Current report is dependency-ready;
      remote publication, lockfile resolution, evaluator refresh and explicit coder admission remain lead-owned
      predecessors.
    core_target_version: 0.3.0
    wire_package_target_version: 0.1.0
    serde_version: 1.0.229
    serde_json_version: 1.0.151
  recommendation:
  - Implement the distinct flat schema-1 PersistedLayout DTO, validation, preparation and activation in product/kumihimo-core;
    never serialize live Core, Snapshot, commands, receipts, previews or runtime handles.
  - Keep kumihimo-core default-std-only. Gate Serde 1.0.229 behind an optional default-off feature on semantic saved
    DTO types only; the independent product/kumihimo-layout-json package uses serde_json 1.0.151 for bounded byte
    encoding/decoding.
  - Persist generated typed IDs, including ProviderId and ResourceId, as canonical decimal strings within saved
    lineage. Reopening retains the same ViewId; no remapping. Keep host stable provider keys and opaque resource
    recovery references distinct from IDs; exclude engine handles and runtime provider instances.
  - Persist next_entity above all active and closed generated IDs plus source lineage/incarnation/generation provenance.
    Use validating constructors for finite normalized Scalar/f64 values; reject duplicate JSON members, duplicate
    logical IDs, malformed IDs, unknown fields/schema and incomplete input.
  - Require host-supplied bounded nonempty lineage and incarnation at Core construction. Enforce incarnation equality
    before receipt lookup or allocator/operation high-water changes; wrong-incarnation commands consume no operation
    or ledger state. Freshness/uniqueness across Core instances is a host guarantee.
  - Prepare restore against detached complete state, binding the DTO, target identity/generation, provider resolution
    and admission/bounds. Live same-lineage activation retains live incarnation/ledger and monotone high-water;
    fresh import starts a new ledger/incarnation and seeds from saved next_entity.
  - Keep filesystem paths, atomic replacement, backups, content/provider engines and runtime resolution in the host
    adapter. The host uses generation-stamped immutable bytes, a single writer, stale-stamp rejection and atomic
    replacement or recoverable last-valid storage.
  live_restore_candidate:
  - R008 requires detached whole-state preparation that skips legacy ownership repair and measurement migration;
    validate IDs, references, ownership, cycles, membership, selection, layout coverage, floats, arithmetic and
    bounds before one activation.
  - R007 makes incarnation mandatory at Core construction and requires identity checks before replay lookup and
    high-water advancement. Core can detect mismatch; the host supplies uniqueness across all prior Core instances.
    Wrong-incarnation commands consume no operation/ledger state.
  - 'R009 rejects extant entity-kind and immutable provider/resource/view-resource identity changes. It explicitly
    limits historical identity guarantees to extant records: there is no historical identity fingerprint registry
    for omitted records. The validated next_entity floor prevents generated-ID reuse; do not claim detection of
    a previously omitted historical identity.'
  - 'R009/R010: same-lineage live restore keeps the current incarnation and receipt ledger, advances live generation,
    and preserves at least the live allocator high-water. Fresh import preserves saved semantic IDs/lineage and
    allocator floor but starts a fresh host-supplied incarnation, ledger and live generation 1.'
  - R013 retains closed View records as tombstones and reopens the same ViewId at a policy-admitted location; no
    durable ID remap. Host veto preserves the complete open view. Close history remains bounded with no silent eviction.
  - R008 binds the complete DTO, target identity/generation and host resolution/bounds/admission inputs into an
    immutable prepare token; commit rejects if any bound input is stale. Decode/prepare failures do not enter a
    Core ledger; rejected execute envelopes follow normal receipt/high-water rules.
  - Retained receipts acknowledge their original command outcome and do not attest current membership after restore.
    Cross-restart exactly-once replay is not claimed.
  wire_identity_and_placeholders:
  - Use exact decimal-string semantic generated IDs scoped to saved lineage; preserve distinct typed IDs and plan-local
    NodeId selectors.
  - Persist stable host provider keys and opaque per-resource recovery references separately from semantic IDs;
    do not persist handles, credentials, secrets or provider implementation state.
  - Unavailable providers become labeled placeholders preserving original identity, order, group, selection, placement
    and recovery reference. Host resolution is explicit and cannot execute a supplied reference as a path or URL.
  - Reopening a retained closed view preserves its original ViewId; do not remap it. Canonical membership/tab order
    stays independent of split/grid packing order.
  - Open and closed membership are validated as distinct sets. Saved records, mounted list rows and live-content
    budgets remain distinct; overflow pages the full canonical collection without truncation.
  tab_group_and_budget_candidate:
  - 'R013: close veto/unsaved indicators remain host-controlled. Selected close chooses first remaining tab or none;
    unselected close retains selection. Closed records preserve ViewId/resource and previous frame/index/group/pin
    metadata; close removes only open membership/selection and never disposes host content.'
  - 'R013: sharing capability checks count open placements only; closed history is not a second open placement.
    Reopen preserves the same ViewId, clamps the saved index, and rechecks destination budgets, pin policy and sharing.'
  - 'R014: closed records count toward aggregate admission and default1024 closed-view admission; reject if retention
    exceeds policy and never silently evict. Existing per-frame view limits count open membership. Lowered limits
    preserve existing data and admit unchanged/decreasing recovery.'
  - 'R014: default UTF-8 caps are 128 bytes for persistent identity tokens, 256 bytes for provider/resource keys,
    and 65536 bytes for labels and recovery references. Persistence caps are host-configurable; exceeding an admitted
    cap rejects and never truncates data.'
  - 'R015: open/closed references remain distinct. Closed origins/targets and missing providers are effectively
    unusable and inapplicable even if host flags say true. Closed compatible targets remain valid references, but
    explicit rebind to a closed/unavailable target rejects.'
  - 'R015: a closed View-anchored edge placement is dormant and reserves no active-frame space. Frame-, Workspace-
    and Cell-anchored placement still follows declared visibility and HiddenSpace Release/Retain policy; effective
    usability/applicability remains false. No retargeting or auto-reveal.'
  - 'R016-R018: group identity/metadata/member order/pins survive movement; whole-group moves use canonical source
    open-member order and after-removal indexes, rejecting atomically on policy conflict. Search/order/page limits
    never truncate saved or canonical membership.'
  layout_004_candidate:
    equalize: 'R019: set every split/grid/automatic weight in the selected workspace to 1; minima still apply and
      the solver distributes equal spare shares, not necessarily equal pixels. Preserve topology/selectors/identities
      and reject atomically on constraints.'
    swap: 'R019: exchange exactly two docked frame-leaf spatial placements in one workspace. Preserve frame/tab/content
      identities and other placements; reject float, cross-workspace and tool swaps explicitly.'
    maximize_pane: 'R020: reversible projection of one docked frame, retaining canonical plan, siblings, floats
      and identities. Solve the selected frame/descendants, its tools and root-edge tools; hide sibling/floating/cell-tool
      projections without allowing hidden minima to reject the active projection. Validate underlying structure.'
    restore_layout: 'R020: restore-layout exits maximize only if the full underlying geometry/bounds solve succeeds
      under current host context. Failure retains maximize with an explicit constraint. It never replaces an old
      Snapshot or discards intervening tab/group edits.'
    maximize_guard: 'R021: shared guard rejects structural/docking/packing changes in the maximized workspace through
      every listed direct or indirect route before effects. It permits independent workspaces, unchanged operations,
      tab/group metadata and membership, host geometry, and tool state/policy updates subject to projected validation.'
  schema_and_atomic_save_questions:
  - Snapshot v2 is documented as having no file-restore guarantee; do not invent or claim a migration from an unpublished
    serialized Snapshot v2 format.
  - Define durable schema version 1 as the first persisted form, with no prior durable schema and no retroactive
    Snapshot migration. Reject unsupported older and newer versions visibly; keep the migration table empty until
    a genuine prior durable schema exists, and add only real version-to-version migrations later.
  - Expose a host save protocol over generation-stamped immutable bytes: one writer serializes commits, stale generation
      stamps reject, and host storage uses atomic replacement or a recoverable last-valid protocol. Never infer
      file or platform behavior from JSON codec success.
  - Require duplicate JSON object-key and duplicate typed-record-ID rejection before map normalization can overwrite
    earlier input. Require total byte-size rejection before parsing/allocation and keep serde_json's default recursion
    guard enabled.
  - The inspected product/ tree contains only kumihimo-core, with no application/store adapter. Keep full RECOVERY
    acceptance open until a real platform adapter supplies atomic replacement/recovery proof; do not invent native-store
    behavior or mark host persistence complete from JSON tests.
  dependency_resolution_boundary: Exact versions and package placement are selected by R002. Inspected cache artifacts
    support candidate availability, but only the lead may establish actual workspace lockfile closure in its serial
    lane.
  contract_scope_summary:
  - 'R001-R006: full promotion, selected optional dependency boundary, semantic schema DTO, canonical decimal IDs,
    bounded strict JSON and schema-1-only rejection policy.'
  - 'R007-R012: mandatory host-supplied Core incarnation, detached restore preparation, extant-only immutable identity
    checks, live/fresh restore rules, provider placeholders and host-owned immutable save stamps/recovery.'
  - 'R013-R018: bounded tombstones/reopen without ID remap; selected-close picks first remaining or none, unselected
    close retains selection; open-placement sharing checks and rechecks; host close veto/pins; effective closed/missing-provider
    tool behavior; groups, overflow/search and independent budgets.'
  - 'R019-R021: all carried equalize/swap/maximize/restore-layout operations and the precise workspace-wide maximize
    guard/allowed operations.'
  - 'R022-R023: structured atomic failures and focused consumer proof, plus quiet examples/manual, exact build matrix/topology/status
    updates and lead-owned serial locked/offline validation.'
alternatives:
- option: Put optional serde derives directly on live Core/Snapshot and serialize current runtime records
  decision: reject
  reason: Snapshot omits the entity allocator and replay ledger, uses Core-local IDs and provider runtime IDs, and
    has no stable provider key. Serializing it directly risks restoring stale commands, identity collisions, hidden
    runtime state and an accidental migration promise.
- option: Core DTO plus optional Serde feature, with host-owned codec and I/O
  decision: viable_alternative
  reason: Preserves default Core independence and keeps all bytes/platform effects with the host, but it does not
    provide a concrete bounded byte parser or repository-owned wire round-trip proof in WP009.
- option: One optional JSON wire package plus optional Core Serde feature
  decision: selected_by_dev_lead
  reason: It provides a concrete versioned byte boundary, byte/count/depth budgets and corruption/unknown-version
    cases while leaving the normal Core dependency graph empty. The added package remains opt-in and owns only format
    conversion.
- option: RON as the persistence codec
  decision: defer
  reason: RON 0.12.2 is current and has Rust 1.64 MSRV, but exact 0.12.2 source is not cached locally; cached source
    is 0.12.0. No project need justifies choosing it over broadly interoperable JSON.
- option: egui_tiles or egui_dock as the canonical semantic model
  decision: reject_for_core
  reason: Both are useful field references with optional Serde support, but their canonical state and behavior are
    coupled to egui presentation and dependencies. They would duplicate Core ownership and bring an unnecessary
    GUI bundle.
- option: Dockview as a Core dependency
  decision: reject
  reason: Dockview is a TypeScript/browser docking system and cannot serve as the Rust semantic Core; retain only
    its tab-group, overflow and maximize behavior as research evidence.
