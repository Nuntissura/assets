      movement/recolor/collapse operations.
  - url: https://dockview.dev/docs/core/groups/maximizedGroups/
    observed: Maximization is a reversible viewport projection with an explicit exit operation.
  - url: https://code.visualstudio.com/docs/configure/custom-layout
    observed: VS Code distinguishes expand from maximize; maximize hides other groups, while pinned tabs have explicit
      position, visibility and close-policy semantics.
  - url: https://code.visualstudio.com/docs/editing/getting-started/userinterface
    observed: Closing the last editor may close its group or preserve empty groups via explicit host setting; overflow/navigation
      policy is separate from persisted tab count.
  - url: https://code.visualstudio.com/docs/editing/codebasics
    observed: Unsaved editor content and its hot-exit backup are separate from arrangement; layout recovery must
      not pretend to own provider data.
  - url: https://github.com/microsoft/vscode/src/vs/sessions/LAYOUT_CONTROLLER.md
    observed: Saves/restores are serialized to prevent an older asynchronous apply overwriting a newer one; geometry
      and active-session state have distinct owners.
  rejected_or_deferred_patterns:
  - Do not serialize live renderer/provider objects, content, secrets, event handles, previews or Core ledger state
    into the durable semantic layout.
  - Do not use JSON unbounded_depth, recursive DTO trees, silent unknown-version coercion, best-effort dropping
    of unknown providers, or an implicit fallback that discards the last valid layout.
  - Do not add egui, Dockview, Taffy, a generic math crate or an unrequested filesystem/backend bundle to Core.
risks_and_controls:
- risk: Direct Snapshot deserialization reuses Core-local IDs or accepts stale commands while omitting allocator/replay
    state.
  control: Use a distinct validated DTO with decimal-string IDs, source lineage/incarnation/generation and validated
    next_entity; define incarnation and restore generation/ledger rules; preserve canonical state atomically while
    applying the existing rejection receipt/high-water policy.
- risk: Missing provider lookup drops tabs or binds saved references to the wrong provider.
  control: Use host stable provider keys, opaque per-resource recovery references and explicit placeholders that
    preserve exact order and reference until resolution.
- risk: A corrupt, oversized or deeply nested payload consumes excessive memory/stack or replaces valid live state.
  control: Enforce byte limits before JSON parsing, keep DTO flat, retain default parser depth limits, enforce record/layout
    budgets, validate detached state, and activate only after full validation.
- risk: Close handling disposes dirty host content before the host veto or loses reopen metadata.
  control: Make close approval an explicit host boundary; preserve the tab on veto; retain bounded reopen metadata
    only after accepted close; never dispose provider content in Core.
- risk: Group movement, pinning or overflow changes canonical membership/order or silently truncates saved tabs.
  control: Define canonical tab order and group identity independently from spatial packing; treat overflow as a
    projection over all tabs; expose separate saved/list/live budgets and explicit disabled-command reasons.
- risk: Maximize or restore-layout silently discards topology changes made during the temporary state.
  control: Keep maximize reversible over the underlying layout; make restore source/version and intervening-generation
    behavior explicit and stale-safe.
- risk: Host filesystem write is torn or a delayed earlier save replaces newer state.
  control: Bind immutable bytes to captured generation, serialize commit ownership and reject stale stamps; retain
    platform atomic replacement or recoverable last-valid protocol as an explicit host interface. Full RECOVERY
    acceptance remains open until a real adapter proves storage behavior.
- risk: Claimed migration accepts fabricated legacy data or downgrades a newer schema.
  control: Treat Snapshot v2 as nonpersistent; define durable schema 1 with no legacy migration, reject unsupported
    older/newer versions, and implement only migrations between genuine published durable versions.
- risk: The optional persistence package becomes a compulsory backend bundle.
  control: Keep the Core default graph empty, make format package independently selectable, and prove default Core
    use without enabling serialization/JSON.
focused_proof_plan:
  cases:
  - case_id: WP009-DTO-001
    expected: Round-trip all durable workspace/frame IDs, membership order, layout placement, proportions, selection,
      group state, overrides and opaque recovery references; exclude handles/secrets/ledger/runtime state.
  - case_id: WP009-DTO-002
    expected: Reject malformed/duplicate JSON keys and typed IDs, broken references, cycles, invalid geometry, over-count,
      over-depth and over-byte inputs without changing canonical model, generation or allocator. Decode/preparation
      failures do not enter a Core ledger; rejected execute envelopes follow the existing high-water/receipt policy.
  - case_id: WP009-DTO-003
    expected: Restore with a missing provider to an ordered placeholder preserving identity and recovery references;
      resolve it later through an explicit host-provided mapping without duplicate views.
  - case_id: WP009-SCHEMA-001
    expected: Accept only the explicitly supported schema versions and real migrations; reject unsupported older/newer
      schemas with a structured result and preserve last valid state.
  - case_id: WP009-TABS-001
    expected: Exercise host-approved close, dirty close veto, reopen metadata, individual and group movement, selection,
      group identity/member order, pin restrictions, overflow search and independent saved/list/live budgets.
  - case_id: WP009-LAYOUT-004
    expected: Exercise equalize and swap on the contract's exact target scope; maximize/restore while tabs and groups
      change and while prohibited topology/plan commands are attempted; keep stable content IDs and enforce minima/generation
      conflicts.
  - case_id: WP009-REPLAY-001
    expected: Prove incarnation is checked before receipt lookup/high-water advancement; pre-restore stale envelopes,
      cross-Core mismatch, exact retained replay and fresh-Core import cannot repeat, collide or partially apply
      a restore. Mutate a prepared token's source DTO, target generation and provider policy to prove staleness.
  - case_id: WP009-STORE-001
    expected: Verify generation-stamped immutable-byte protocol, single-writer ordering and stale-stamp rejection.
      Keep full RECOVERY acceptance open until a real platform adapter proves interrupted atomic replacement or
      last-valid recovery; codec proof is separate.
