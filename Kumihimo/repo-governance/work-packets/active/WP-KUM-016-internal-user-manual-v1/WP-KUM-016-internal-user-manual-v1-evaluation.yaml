  observed: Windows x64 desktop, scoped Chrome/WASM and external Linux x64 Servo copied pixels into Windows DX12 are distinguished. No ARM, physical pen/touch, other-platform, native Windows Servo, zero-copy, media or broad performance proof is invented. Current web pilot does not enable optional navigation/background modules. All 99 full specification requirements remain open.
