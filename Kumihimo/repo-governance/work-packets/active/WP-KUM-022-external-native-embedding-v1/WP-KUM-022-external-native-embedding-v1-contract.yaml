requirements:
- Provide a reusable public optional native embedding coordinator in the ORIGINAL Assets/Kumihimo component. The
  coordinator owns actual renderer binding, private tagged GPU capture/readback and sealed readiness mint. No public
  constructor accepts image bytes, screenshot events or asserted readiness. Commit binds the actual owned window,
  pending nonce/root, controller identity/generation, surface epoch, physical dimensions, scale and complete readback;
  stale, cancelled, foreign or replayed proof cannot move source ownership. Expose host-selected semantic preview/divider/rail
  tokens with defaults derived from caller visuals. Preserve existing tab/provider-veto/semantic-return/quiet behavior.
  No geometry expansion or native runner replacement. Eframe compatibility remains unproven; distinct pinned Handshake
  adoption remains held until standalone proof and canonical GitHub publication.
- Maintain exact upstream eframe0.33.3 and egui-wgpu0.33.3 original normalized source packages in the Assets component,
  pinned to upstream44cdd653e2317d300fb8a6c9c36b03f23991e803 with archive and original-file hashes/notices. Add
  bounded renderer-owned native request/completion delivery available through public Frame before application-mutable
  Screenshot input. Privately construct immutable receipts only from actual authoritative root/deferred/immediate
  viewport GPU copy/readback and completed presentation call. Derive window/renderer incarnation, one-shot request,
  extent, scale and submission internally; reject stale/recreated/mismatched windows, duplicate consumption, cancellation,
  failed/skipped frames, map/format failures and unverifiable borrowed bindings. Bound pending captures and bytes.
  Preserve ordinary screenshots, existing0.33.3 runner, sibling surfaces and original asset/host acceptance. No
  raw receipt/image/callback constructor or Deserialize bypass, offscreen substitute, global surface clear, framework
  upgrade or Handshake-local copy. Consuming workspace roots explicitly select immutable future source patches;
  package-local patch declarations do not prove adoption.
acceptance:
- A001 Public consumer completes actual asset-owned quiet renderer readback and one canonical detach; no raw Ready/image/event
  constructor
- A002 Wrong owner/viewport/root/nonce/identity/generation/epoch/size/scale/byte count, timeout/cancel/replay reject
  before source movement
- A003 Existing semantic return/pin/dirty/provider veto and bounded slots remain intact
- A004 Dark/light caller tokens reach shared preview/divider/rail; independently opened changed pixels and unchanged
  identities/input/state
- A005 Affected default/all-feature compile, owning tests and genuine quiet native readback pass on frozen source;
  independent affected evaluation
- A006 Meaningful original source/proof commit normally pushed to Nuntissura/assets codex/handpick and immutable
  remote revision reread
- A007 Private SDK native receipt derives actual renderer/window incarnation, request, extent/scale/submission and
  presented/readback result for root/deferred/immediate viewports; ordinary screenshots unchanged
- A008 Actual existing-runner root/deferred/immediate source consumer plus stale/recreate/cancel/replay/raw-Screenshot
  negative proof; failures explicit; independent provenance and pixels inspected
- A009 Original normalized SDK package/notices/hash provenance retained; only six producer sources and necessary
  manifest exports/bindings patched; no unrelated upstream drift
proof:
- cargo check --manifest-path product/Cargo.toml -p kumihimo-egui --all-targets --locked --offline -j 2
- cargo check --manifest-path product/Cargo.toml -p kumihimo-egui --all-targets --all-features --locked --offline
  -j 2
- cargo test --manifest-path product/Cargo.toml -p kumihimo-egui --all-features --test adapter_contracts --test
  native_app_contracts --test manual_sample_contracts --locked --offline -j 2
- cargo run --manifest-path product/Cargo.toml -p kumihimo-egui --all-features --example capture_host --locked --offline
  -j 2 -- --output <owned-output>
- cargo run --manifest-path product/Cargo.toml -p kumihimo-egui --all-features --example native_probe --locked --offline
  -j 2 -- --output <owned-output>
- Independent opened actual pixels, native/UIA/readiness observations and diff; actual owned process settlement
- git ls-remote origin refs/heads/codex/handpick; independent immutable source/proof readback
- Affected exact SDK owning provenance/queue tests and original native_probe existing-runner genuine eframe root/deferred/immediate
  consumer mode; literal batch fixed before compiler grant
