bounded_vulkan_selection:
  decision_id: WP022-STRICT-VULKAN-SELECTION-20261025
  spec_ref: DEC-KUM-STRICT-VULKAN-SELECTION-v1
  status: SOURCE_AND_SCOPED_RUNTIME_VERIFIED
  files:
  - product/kumihimo-egui/src/native.rs
  - product/kumihimo-egui/Cargo.toml
  - product/Cargo.lock
  - product/kumihimo-egui/tests/native_app_contracts.rs
  - product/kumihimo-egui/examples/native_probe.rs
  requirements:
  - Add a compatible explicit native-renderer configuration or entrypoint that selects Vulkan exclusively when requested.
    Preserve the legacy DX12 default and existing NativeOptions exhaustive-literal compatibility. A strict Vulkan
    request uses only Backends::VULKAN, records the actual adapter backend and reports a typed unavailable failure
    rather than silently selecting DX12 or OpenGL. Preserve the existing renderer/device, viewport/window identity,
    capture/readback receipts, source ownership, docking, semantic return, lifecycle and bounded budgets. Enable
    Vulkan through the existing pinned optional wgpu dependency and controlled dependency resolution; do not invent
    dependency versions. The existing native and eframe probe modes must report the actual selected backend; eframe
    Vulkan is a distinct production-boundary proof. Offscreen DX12 captures do not prove Vulkan. Host policy, centralized
    GPU accounting and later exact-revision adoption remain host responsibilities. No SDK producer, bridge, offscreen-capture
    or framework upgrade is included.
  acceptance:
  - Legacy DX12 entrypoints and exhaustive NativeOptions construction remain compatible
  - Explicit Vulkan requests are exclusive, observe the actual adapter and expose typed unavailability
  - Native and eframe root/deferred/immediate genuine readback, stale rejection, return and owned cleanup retain
    their original obligations
  - Pinned dependency resolution preserves unrelated records; isolated candidate proof and canonical publication
    precede separate host adoption
  execution_authority_ref: KUM-WP022-DEPENDENCY-EXECUTION-20261025
  historical_execution_predecessors:
    status: SUPERSEDED_FOR_SOURCE_SEQUENCING_ONLY_BY_DIRECT_OPERATOR_PRODUCT_AUTHORIZATION
    previous:
    - Matching saved kernel MT175/MT198 exact five-path admission
    - Published accepted asset spec and WP predecessor before source start
    operator_direction: paperwork and repo ceremony can never block work
    preserved: Actual resource ownership, technical proof, safety, historical failures, product acceptance and distinct
      exact-revision host adoption remain required
  host_adoption: HELD_SEPARATE_EXACT_REVISION_ADOPTION
  research_basis:
    sources:
    - https://docs.rs/crate/wgpu/27.0.1/features
    - https://docs.rs/crate/wgpu-hal/27.0.4/features
    - https://doc.rust-lang.org/cargo/reference/features.html
    reuse: Existing NativeRenderer configuration and runner; pinned optional wgpu27.0.1; additive Cargo feature
      unification
    selected: Additive backend-selecting entrypoints preserve exhaustive NativeOptions construction and existing
      adapters
    rejected:
    - Host-local renderer copy or lifecycle bypass
    - Unnecessary render-bridge dependency change
    - Adding a public NativeOptions field
    - Fallback to another graphics API reported as Vulkan
    - Manually invented dependency versions
    risks_controls:
    - 'Native and eframe use separate initialization paths: observe and validate each actual backend'
    - 'New native targets can change before initialization settles: real warmup receipts precede arming; armed stale
      receipts still reject'
    - 'Winit Windows destruction is queued: drain only verified own-window messages before cleanup assertions'
    - Default users retain DX12 behavior and original error classification
    validation: Affected production configuration tests, exact dependency-graph delta, changed examples and genuine
      native/eframe presentation/readback/return/cleanup with independent source and artifact review
