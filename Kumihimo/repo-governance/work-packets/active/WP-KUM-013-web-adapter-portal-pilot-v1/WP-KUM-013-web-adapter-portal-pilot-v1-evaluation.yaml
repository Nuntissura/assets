- '[WP013-A005] Versioned bounded decimal-ID model routes, replay/conflicting actors/stale identity/generation/same-ID-different-intent
  and redacted failure agree with GUI/fresh canonical snapshot; manual lets a no-context model reproduce.'
- '[WP013-A006] Exact toolchain/generated-WASM/browser capabilities and actual restricted-popup denial preserve
  source ownership; real readable controls/DOM accessibility and quiet owned browser proof, scoped focused checks,
  unchanged prior inputs/spec preservation/published independent evaluation and origin verified.'
proof_plan:
  owner: ROLE-KUM-DEV-LEAD
  commands_and_observations:
  - Lead-owned exact manifest/locked graph and cached closure inspection; verify matching CLI archive hash/version
    and installed wasm target before coding readiness
  - cargo check --manifest-path product/Cargo.toml -p kumihimo-web --all-targets --locked --offline -j 2
  - cargo test --manifest-path product/Cargo.toml -p kumihimo-web --test web_contracts --locked --offline -j
    2
  - cargo build --manifest-path product/Cargo.toml -p kumihimo-web --features wasm --target wasm32-unknown-unknown
