- '[WP013-A003] Actual host task IDs/column/status/domain revision remain unchanged by arrangement; separate
  explicit domain action edits meaning; exact recipient, missing provider/stale/veto behavior observed.'
- '[WP013-A004] Actual localStorage publication and fresh-WASM reload restore valid layout/membership/proportions/provider
