    screenshot bytes. Resize A and reread both; B retains exact dimensions and image/content until addressed.
  - Genuine WebDriver pointer AND keyboard actions address each view through current RenderSlot mapping. Local/global/physical/scale
    route is single mapping and current canonical recipient; inspect actual DOM/content change in intended engine
    and absence of change in the other.
