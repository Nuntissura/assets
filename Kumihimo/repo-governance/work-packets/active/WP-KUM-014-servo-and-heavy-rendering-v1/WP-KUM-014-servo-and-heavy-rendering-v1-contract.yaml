non_goals:
- Full future Servo/media/YouTube/native Windows/ARM/zero-copy/browser rewrite compatibility; all full spec acceptances
  remain open
- Core/content public changes, shared raw engine handles, physical input/GPU faults, freezing claims or universal
  resource/performance gains
- Global WSL shutdown, unowned process/cache mutation, broad default cold builds/suites
research_basis:
  checked_at: '2026-10-12'
  sources:
  - url: https://github.com/servo/servo/releases/tag/v0.6.0
    pattern: Pinned LTS release and exact external artifact, avoid cold engine/toolchain build.
  - url: https://github.com/servo/servo/blob/v0.6.0/rust-toolchain.toml
    pattern: 1.97.1 separate from current1.91 host.
  - url: https://github.com/servo/servo/blob/v0.6.0/components/shared/paint/rendering_context.rs
    pattern: GL/GLES software context and CPU image readback, not WGPU zero-copy.
  - url: https://github.com/servo/servo/blob/v0.6.0/ports/servoshell/desktop/headless_window.rs
    pattern: Real headless software renderer/context, owned resize.
  - url: https://github.com/servo/servo/blob/v0.6.0/components/servo/webview.rs
    pattern: Shared context resize affects all views; Rc/thread ownership, frame-ready and throttling differ from
      unload.
  - url: https://github.com/servo/servo/blob/v0.6.0/components/webdriver_server/lib.rs
    pattern: 0.0.0.0 bind, actual rectangle/input/PNG screenshot routes; isolated namespace required.
  - url: https://github.com/servo/servo/blob/v0.6.0/ports/servoshell/prefs.rs
    pattern: Headless GL video disabled; do not claim YouTube/media.
  - url: https://github.com/emilk/egui/blob/0.33.3/crates/egui_demo_app/src/apps/custom3d_wgpu.rs
    pattern: Owning-device callback resources, prepare/paint separation and viewport-aware custom GPU rendering.
  - url: product/kumihimo-egui/src/content.rs
    pattern: Actual reusable RenderSlot/GpuBinding/texture/callback guards; no engine handles in Core.
  - url: product/kumihimo-egui/src/capture.rs
    pattern: Existing quiet DX12 capture/device/resources/readback, shared adapter; warm compiled dependencies.
  selected: Separate external software engine per browser view, bounded CPU pixel bridge into existing optional
    WGPU adapter, host-owned dirty/lifecycle policy and true 3D provider. Namespace isolation independently verified
    before public-bind WebDriver.
  reuse: Existing Controller/content lifecycle and geometry, RenderSlot/GpuBinding/OffscreenRenderer, current warm
    dependency graph and separate role chats.
  rejected: Direct libservo/current Rust1.91 linking, shared-context differently sized views, zero-copy promise,
    public Windows WebDriver launch without denial proof, screenshot polling represented as engine notification/freeze.
  risks_and_mitigations: Public WebDriver→kernel-isolated private loopback namespace with independent proof; wrong/stale
    images→exactidentity/epoch/dimensions/sequence; hidden falsely unloaded→PID/starttime independent absence; lossy
    restore→page reload label; slow cold engine→verified binary/cache; GUI/device mismatch→actualbinding guards
    and recoverable CPU reupload.
  validation: Seven frozen affected cases above; one engine/GPU boundary batch, no broad repeated prior suites.
