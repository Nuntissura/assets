  bounded_work:
    - Implement flat horizontal/vertical splits and regular weighted non-spanning row/column grids, explicit holes and plan-local layout selectors; preserve canonical frame membership and order separately from spatial packing.
    - Compute shared geometry from validated finite f64 logical DIP inputs, iterative minimum/allocation passes, positive weights and checked arithmetic; expose reject or scrollable virtual extent for undersized viewports.
    - Store canonical viewport/measurement/minimum/gap/proportion/host-target/reservation context through Core commands so every preview input participates in generation validation.
    - Model tool original owner/origin, pinned editing target, placement, independently supplied visibility/usability/applicability and host edge/grid eligibility; reserve edges deterministically and apply host release/retain policy.
    - Produce pure previews for existing frames/tools, consume no generation/entity allocation/ledger result, cancel without mutation, and revalidate commits through existing envelope/replay handling.
    - Support bounded in-app floating frames with one workspace owner and return docking location. Native popouts, temporary/modal overlays, GUI scrolling, rendering/input/accessibility and provider command invocation remain later boundaries.
    - Carry REQ-KUM-LAYOUT-004 equalize/swap/maximize/restore to WP-KUM-009; this packet does not claim them implemented.
dependency_decision:
  runtime_external_dependencies: []
  selected_implementation_boundary: One cohesive headless product/kumihimo-core package with private layout, geometry, tool-policy and docking modules. Core Snapshot owns semantic state, the single generation and receipt ledger; solver rectangles and caches are derived only.
  rationale:
    - WP008-R002..R019 and specification revision 7 bound the algorithms to flat split/regular-grid packing, host constraints, tool strips, eligible existing boundaries and in-app floats; CSS/intrinsic layout, spans, arbitrary overlap, native windows and GUI behavior are excluded.
    - The accepted math and semantic records fit private standard-library modules. Taffy's broader layout model is unnecessary and a separate crate would duplicate package/API boundaries without a second consumer.
    - Flat semantic state, one Core generation and one receipt ledger preserve existing ownership and replay; pure solver results cannot become a competing arrangement authority.
    - Dependency selection is final for this contract: no runtime external dependency, no new generic math crate and no GUI toolkit dependency.
  contract_choices:
    - Flat split nodes and regular weighted non-spanning grids use explicit cells/holes; no spans. Each non-floating canonical frame occurs once. Unconfigured packing derives from frame order.
    - Legacy Workspace.frames indexes keep after-removal order semantics. A changed legacy move repairs custom spatial packing separately; source pruning retains grid tracks/holes and configured-empty state. Explicit docking chooses spatial placement; moved child-workspace packing stays intact.
    - Logical coordinates use validated finite f64 DIPs with normalized signed zero and reflexive exact envelope equality. Reject NaN/infinity before command construction; weights are positive; dimensions/minima/gaps are nonnegative; arithmetic and constraint errors are structured and atomic.
    - Core geometry context stores viewport, measurement/minimum/gap/proportion inputs, host target state and relevant policies. Any changed preview input invalidates generation.
    - Undersized layouts expose explicit reject or scrollable virtual extent with required extent, clipping and geometry for all panes; actual scrolling is adapter work.
    - Tool strips reserve top, bottom, left, then right; ties use host order then ToolId. Hidden release/retain changes derived reservation only.
    - Layout entries default to 65,536 and are host-configurable or unrestricted; tools count toward aggregate records. Lowered limits preserve existing state and allow unchanged/decreasing recovery.
    - Public record/command extension declares Snapshot v2 and unreleased package v0.2; file restore/migration is excluded.
  alternatives:
    - option: Taffy as a runtime dependency or optional solver crate
      decision: defer
      reason: Current Taffy 0.14 supports caller-owned node storage through TraversePartialTree and has an optional built-in taffy_tree feature, but its flexbox/CSS-grid and style model is broader than this packet. Its algorithm-facing geometry uses f32, adding precision and command-equality policy work. Keep it as a future candidate if the full contract adopts general layout semantics.
    - option: egui_tiles or egui_dock as the canonical model/dependency
      decision: reject for core
      reason: Their useful split/tree, surface, identity and interaction patterns are integrated with egui and its UI geometry. Core is currently portable/headless and owns domain identities and replay. Reuse patterns only; do not import their UI-facing state as another authority.
    - option: Dockview as the core dependency
      decision: reject
      reason: Dockview is a TypeScript/browser docking system and cannot serve as a Rust core dependency. It is a useful behavior reference for groups, floating layouts and drop targets; its repository places smart guides/snapping among Enterprise features, so it does not provide a needed free solver here.
canonical_ownership:
  invariant: Core is the single canonical owner of workspace/frame membership, layout nodes or placement references, and tool-surface semantic placement. Any geometry solver/module consumes this state and returns derived rectangles/candidates; it cannot maintain an independent authoritative tree, membership, generation, or operation ledger.
  required_contract_rules:
    - Existing CreateFrame and MoveFrame operations must reconcile layout membership atomically with canonical workspace/frame membership; reject without partial record, identity, generation or layout changes.
    - Every canonical frame in a layout scope must be represented exactly once, with no stale or duplicate leaf references. Derived indexes and geometry caches cannot become an alternate owner.
    - Tool placement parent, host content owner, bound editing view/resource, focus, visibility, reservation policy and provider lifecycle remain separate fields or decisions. Docking cannot retarget content, and hiding cannot unload it.
    - A preview is a read-only value tied to all topology, geometry and host-policy inputs used to compute it. Commit must revalidate those inputs and then use the existing Core mutation/replay path.
numeric_contract_gate:
  status: resolved_by_WP008-R005_and_R006
  selected_policy: Validated finite f64 logical DIP scalars, signed-zero normalization and reflexive exact Envelope equality; reject NaN/infinity before command construction; positive weights; nonnegative dimensions, minima and gaps; checked arithmetic/constraint errors; iterative minimum then allocation passes using shared edges.
  required_results: Successful rectangles/endpoints are finite with nonnegative extents; invalid/impossible calculations reject without canonical mutation; adjacent cells use shared boundaries.
  remaining_contract_detail: Implement the declared allocation rule in code and focused tests; no dependency or numeric-policy choice remains open.
