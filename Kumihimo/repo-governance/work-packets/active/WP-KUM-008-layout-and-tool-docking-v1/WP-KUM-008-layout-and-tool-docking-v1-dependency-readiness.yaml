risks_and_mitigations:
  - risk: A solver or adapter becomes a second layout owner and Core frame moves leave stale geometry membership.
    mitigation: Keep semantic layout/tool records and generation in Core; derive caches; validate exact frame leaf coverage and reconcile existing CreateFrame/MoveFrame atomically.
  - risk: Floating-point NaN, infinity, signed zero, or accumulated arithmetic break Eq/replay or produce invalid rectangles.
    mitigation: Implement validated finite f64 DIP values, signed-zero normalization, exact reflexive envelope equality and checked arithmetic; reject invalid values before envelope creation and test finite output/replay.
  - risk: Minimum constraints cannot fit a viewport, or multiple retained tools compete for one edge.
    mitigation: Implement the declared reject/virtual-extent result and deterministic top-bottom-left-right, host-order, ToolId reservation order; return full geometry accounting and preserve canonical records.
  - risk: Stale preview commits a destination that changed after preview.
    mitigation: Bind preview to topology/geometry/policy revisions or equivalent complete inputs; revalidate atomically at commit; prove cancel and stale commit leave canonical snapshot/generation unchanged.
  - risk: Docking a tool moves its content target or focus, or hide/reservation accidentally implies provider disposal.
    mitigation: Keep placement, owner, bound target, focus, visibility, reservation and provider lifecycle independent; test moves across frame/root edges with multiple editing views.
  - risk: Work silently omits accepted equalize/swap/maximize/restore semantics or advertises unsupported native popouts.
    mitigation: Contract carries REQ-KUM-LAYOUT-004 operations to WP-KUM-009 and limits this packet to in-app floats; native popouts remain a separate later surface.
focused_proof_plan:
  cases:
    - case_id: EVAL-KUM-008-001
      expected: Nested horizontal/vertical splits and unequal host grid tracks share derived boundaries, account for every canonical frame once and respect declared proportions/gaps/minima.
    - case_id: EVAL-KUM-008-002
      expected: Reject non-finite, negative, out-of-range and impossible inputs; exercise zero extents and checked arithmetic; assert all successful edges/results are finite and nonnegative, and rejection is atomic.
    - case_id: EVAL-KUM-008-003
      expected: Below-minimum extent returns the contract's explicit overflow/reachability status without deleting canonical panes; restoring extent returns usable geometry.
    - case_ids: [EVAL-KUM-008-004, EVAL-KUM-008-006]
      expected: Accept only host-eligible edge/grid targets; preserve frame/tool identity; verify reservation release/retain, deterministic competing-edge behavior and in-app float placement.
    - case_id: EVAL-KUM-008-005
      expected: Move a tool among frame/root placements while verifying placement, content owner, bound view/resource, focus and visibility remain independent.
    - case_id: EVAL-KUM-008-007
      expected: Preview/cancel leaves Snapshot, generation, IDs and ledger unchanged; commit revalidates preview inputs; stale/forbidden commits reject atomically through existing replay semantics.
    - case_id: EVAL-KUM-008-008
      expected: Enforce disclosed layout/tool admission and traversal bounds; verify identical retained envelopes replay and changed intent conflicts.
    - case_id: EVAL-KUM-008-009
      expected: Confirm REQ-KUM-LAYOUT-004 equalize/swap/maximize/restore remains carried to WP-KUM-009 and is not reported as implemented here.
  execution_boundary: Coder owns focused headless tests after dev-lead publication/admission. Adapter/UI proof and broader serial-lane validation remain governed by the final contract and project build lane; this preparation report runs no Cargo/build/test commands.
handoff:
  next_action: Lead publishes the full contract/specification and reads those exact published artifacts per WP008-R001 before coding; this report records the selected dependency as ready.
  no_product_or_toolchain_changes: true
