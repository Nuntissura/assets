  selected: Standard-library flat semantic records and pure iterative geometry inside the existing canonical Core, with explicit finite/envelope numeric semantics and host policy
  rejected:
  - GUI toolkit-owned competing tree or duplicate arrangement/generation wrapper
  - General CSS solver and intrinsic measurement scope absent from this packet
  risks_controls:
  - 'Packing diverges after original moves: one owner, atomic reconciliation and full canonical coverage assertions'
  - 'NaN breaks envelope equality or allocation overflows: validated scalars, signed-zero normalization, checked arithmetic and exact replay tests'
  - 'Toolbar acts on wrong file: independent original owner, pinned target and placement; incompatible explicit rebind rejected'
  - 'Preview becomes stale after resize/policy: every relevant input owned by canonical context generation and revalidated at commit'
  - 'Minima or hidden reservations make content unreachable: explicit rejection/virtual extent and returned clip/accounting; actual GUI access remains future proof'
  - 'Added metadata bypasses admission: explicit aggregate entity and layout-entry policies, unchanged-state rejection and lowered-budget recovery'
