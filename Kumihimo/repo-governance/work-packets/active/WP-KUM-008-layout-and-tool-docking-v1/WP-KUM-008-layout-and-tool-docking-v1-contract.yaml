schema_version: kumihimo.wp-contract.v1
wp_id: WP-KUM-008-layout-and-tool-docking-v1
title: Implement geometry and scoped docking
scope:
- Extend the canonical portable core with flat split/grid packing, finite shared geometry and host-controlled minimum sizes, gaps, proportions and overflow
- Store independently dockable host tool surfaces at eligible tab/frame/workspace edges or grid cells, preserving original owner and editing target
- Implement generation-bound pure docking previews, cancellation, directional commits, eligible-boundary snapping and bounded in-app frame floats
- Reconcile existing frame creation/movement with configured packing under the same Core owner, generation and bounded operation ledger
- Extend the public consumer contracts, quiet runnable example and no-context manual; retain prior ownership/replay behavior
