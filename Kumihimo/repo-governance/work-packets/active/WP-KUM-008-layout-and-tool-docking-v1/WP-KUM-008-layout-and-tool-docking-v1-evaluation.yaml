INDEPENDENT_FINDINGS:
  - finding_id: EVAL-KUM-008-F01
    status: resolved_scoped_runtime
    refs: [WP008-R012, WP008-A007, EVAL-KUM-008-004]
    source: product/kumihimo-core/src/docking.rs
    anchors: Initial return_location at lines 165-170; dock_frame eligibility at lines 245-252 in the inspected source
    observed: New floats store Append as their return location without checking allowed_docks; redock requires that stored location to be allowed.
    failure_case: With allow_floating true and only a same-workspace WorkspaceEdge allowed, a valid float succeeds but its Redock route rejects ForbiddenDestination.
    remediation: Preserve/select an eligible return location or reject an impossible-return float atomically; exercise float/redock without Append eligibility in the focused consumer proof.
    remediation_observed: Float now probes saved/append and allowed same-workspace return locations through detached Redock mutation/validation, stores an accepted location or rejects when none succeeds (docking.rs lines 179-194 in the inspected revision).
    focused_test: floating_uses_an_eligible_return_and_requires_a_return_path inspects Left-only return, redocks, then rejects a float with no allowed destination.
    proof_limit: Inspected source remediation and focused assertions are bound to candidate 90f93239d2e474e28451cab15458454ecd1649dc; actual test log reports the focused return-path regression ok
