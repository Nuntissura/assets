acceptance_scenarios:
  - case_id: EVAL-KUM-008-001
    refs: [REQ-KUM-LAYOUT-001, REQ-KUM-LAYOUT-002, REQ-KUM-LAYOUT-006]
    contract_refs: [WP008-R002, WP008-R003, WP008-R004, WP008-R006, WP008-R018, WP008-A001]
    method: Solve nested horizontal/vertical splits and a weighted regular grid with holes, unequal proportions, gaps and minima. Use original CreateFrame/MoveFrame after configuration, including after-removal indexes, same-parent unchanged order, compatible root append, retained grid/leaf root wrapping, source pruning to empty and a moved subtree with child-local configuration.
    expected: Exactly one packed leaf represents each non-floating canonical frame; floats remain separately owned and accounted for. Legacy indexes retain Workspace.frames semantics and unchanged order remains a no-op. Changed moves preserve unrelated branches/proportions, retained grid tracks/holes, explicit configured-empty state, child-local plans and resource identities under one owner/generation/receipt. Iterative minima-first allocation yields shared finite DIP boundaries using the documented spare-space rule; solver output owns no second arrangement.
  - case_id: EVAL-KUM-008-002
    refs: [REQ-KUM-LAYOUT-002, REQ-KUM-CHROME-005, REQ-KUM-CHROME-010]
    contract_refs: [WP008-R003, WP008-R005, WP008-R006, WP008-A002]
    method: Construct scalars from NaN/infinity and both signed zeros; exercise negative and extreme finite dimensions/gaps/minima, nonpositive weights, zero extent and arithmetic overflow. Submit malformed/cyclic/duplicate plans, wrong references and invalid grid cells/orientations through public commands.
    expected: NaN/infinity reject before command construction; normalized signed zero preserves reflexive exact Envelope equality. Positive weights and nonnegative dimensions/minima/gaps are enforced. Structured command rejection preserves the full model, generation and next entity allocation compared with an untouched control. Successful rectangles and endpoints remain finite with nonnegative extents; constructor failures create no envelope/ledger operation.
  - case_id: EVAL-KUM-008-003
    refs: [REQ-KUM-LAYOUT-002, REQ-KUM-LAYOUT-005, REQ-KUM-CHROME-009]
    contract_refs: [WP008-R007, WP008-R008, WP008-A003]
    method: Resize below the combined pane/tool minima plus gaps, inspect the declared infeasibility result, then restore usable extent.
    expected: Reject and scrollable virtual-extent policies are explicit. Rejection preserves records; virtual extent returns required extent, clipping and geometry accounting for every existing pane. Saved frames become geometrically reachable after viewport/policy changes; actual scrolling/reveal UI remains later adapter proof.
  - case_id: EVAL-KUM-008-004
    refs: [REQ-KUM-LAYOUT-003, REQ-KUM-LAYOUT-007, REQ-KUM-POPOUTS-001]
    contract_refs: [WP008-R009, WP008-R011, WP008-R012, WP008-R014, WP008-A007]
    method: Dock a tool/panel at eligible grid and ancestor-edge destinations; float and redock an in-app frame; request a forbidden edge/orientation and snap to an ineligible boundary.
    expected: Supported moves retain stable identities; a floating frame retains one workspace owner, explicit in-app kind and return docking location, with its full rectangle/minima inside workspace bounds. Impossible or forbidden destinations reject atomically. Snap candidates use eligible existing edges/shared split boundaries/regular cells with deterministic distance/tie ordering. Exact subdivisions, spans, arbitrary overlap, hysteresis and native popouts remain excluded.
  - case_id: EVAL-KUM-008-005
    refs: [REQ-KUM-LAYOUT-007, REQ-KUM-CHROME-006, REQ-KUM-CHROME-007, REQ-KUM-CHROME-008]
    contract_refs: [WP008-R007, WP008-R009, WP008-R010, WP008-A004, WP008-A005]
    method: Move a Studio tool to a root edge/cell while two editing views exist; supply tool/Notes focus, target visibility/usability/applicability and hidden/returned target states through canonical context. Exercise pinned default, explicit compatible rebind and incompatible rebind.
    expected: Placement, original owner/origin, bound view/resource, visibility and applicability remain distinct. Outward movement changes placement only; focus alone does not retarget/hide a visible usable target. Ordinary activation never reveals/substitutes another file; only explicit compatible host rebind changes binding, and incompatible rebind rejects atomically. Provider command execution and actual GUI focus events remain excluded.
  - case_id: EVAL-KUM-008-006
    refs: [REQ-KUM-CHROME-009, REQ-KUM-CHROME-010, REQ-KUM-LAYOUT-007]
    contract_refs: [WP008-R008, WP008-R011, WP008-A004, WP008-A005]
    method: Hide/restore edge tools under release/retain policies; combine multiple edges, host-order ties, allowed orientations, preferred/minimum sizes, grid-cell conflicts and an undersized workspace.
    expected: Strips reserve in top,bottom,left,right order, then host order and ToolId ties. Hidden policy changes derived reservation only; placement/target metadata survives, remaining space follows host proportions/minima, and hiding has no lifecycle effect. Reservations/content geometry never silently overlap or become negative; conflicting cells/orientations reject atomically and undersized handling follows the explicit policy.
  - case_id: EVAL-KUM-008-007
    refs: [REQ-KUM-LAYOUT-003, REQ-KUM-LAYOUT-007, REQ-KUM-MODEL-001]
    contract_refs: [WP008-R007, WP008-R013, WP008-R019, WP008-A006]
    method: Preview valid/invalid docking of existing frames/tools, cancel, commit a current preview and replay it. Independently change topology, viewport, measurement/minimum/gap/proportion inputs, target state and relevant placement/reservation policy between preview and commit; compare allocation with an untouched control.
    expected: Preview/cancel preserves snapshot, generation, stable entity allocation and ledger. Hypothetical packing-node selectors are plan-local metadata, distinct from stable identities and permitted to change during repair. Every changed preview input invalidates its generation; stale/forbidden commit rejects atomically. Current commit revalidates intent through Envelope/replay and mutates once; caller-supplied geometry never becomes canonical state.
  - case_id: EVAL-KUM-008-008
    refs: [REQ-KUM-LAYOUT-001, REQ-KUM-LAYOUT-006, REQ-KUM-MODEL-001]
    contract_refs: [WP008-R015, WP008-R016, WP008-A002, WP008-A008]
    method: Vary canonical counts/containment, include tools in aggregate record admission and nodes/tracks/child references/retained context-policy entries in layout admission. Inspect default 65536 layout entries, configurable/unrestricted limits, lowered-budget growth rejection and unchanged/decreasing recovery; exercise retained replay and existing WP007 contracts.
    expected: Canonical coverage is independent of visible/selected subsets. Lowering limits preserves state; rejected growth preserves full model/generation/next allocation and recovery remains possible. Snapshot version 2/package 0.2 disclose the public extension while local IDs, replay and overflow behavior remain intact. Counts are not byte ceilings; no persistence/migration, GUI-speed or unobserved-host claim follows.
  - case_id: EVAL-KUM-008-009
    refs: [REQ-KUM-LAYOUT-004]
    applicability: Deferred accepted scope; excluded from WP008 runtime acceptance
    carried_forward_to: WP-KUM-009-tabs-and-layout-recovery-v1
    method: Inspect the full contract carried_forward field and spec7 scope statement.
    expected: Equalize, swap, maximize-pane and restore-layout remain accepted outstanding WP009 work; WP008 does not mark them implemented or use their absence as a failure.
boundary_decisions:
  - decision_id: EVAL-KUM-008-D01
    status: resolved_from_full_contract
    refs: [WP008-R002, WP008-R004, WP008-R007, WP008-R018]
    decision: Core Snapshot owns semantic packing/tool/context state; all mutations share one generation/ledger, solver output is derived, and original routes reconcile configured packing with legacy ordering preserved.
  - decision_id: EVAL-KUM-008-D02
    status: resolved_from_full_contract
    refs: [WP008-R003, WP008-R005, WP008-R006, WP008-R008, WP008-R014]
    decision: Flat H/V splits and weighted regular non-spanning grids permit holes; finite f64 DIP uses normalized zero, positive weights and nonnegative dimensions/minima/gaps. Iterative minima-first allocation and explicit reject/virtual extent preserve accounting; exact subdivisions remain excluded.
  - decision_id: EVAL-KUM-008-D03
    status: resolved_from_full_contract
    refs: [WP008-R009, WP008-R010, WP008-R011, WP008-R012]
    decision: Tool origin/owner/target/placement are separate; pinned default and compatible explicit rebinding use independent target flags. Host orientation/size/eligibility/order and release/retain policies govern top,bottom,left,right strips with host-order/ToolId ties; floats remain bounded in-app frames.
  - decision_id: EVAL-KUM-008-D04
    status: resolved_from_full_contract
    refs: [WP008-R005, WP008-R007, WP008-R013, WP008-R019]
    decision: Validated finite normalized scalars preserve exact reflexive Eq. All relevant preview inputs belong to canonical context/generation; previews use existing targets without stable allocations/ledger changes, local node selectors are distinct, and commit revalidates intent through Envelope.
  - decision_id: EVAL-KUM-008-D05
    status: resolved_from_full_contract
    refs: [WP008-R015, WP008-R016, REQ-KUM-LAYOUT-004]
    decision: LAYOUT-004 is carried forward to WP009. Tools join aggregate record admission; aggregate layout entries default to 65536 with configurable/unrestricted policies and lowered-budget recovery. Snapshot 2/package 0.2 declare the unreleased public extension.
