dependency_decision:
  package: product/kumihimo-core
  runtime_external_dependencies: []
  standard_library:
  - std::collections::BTreeMap for keyed flat records and deterministic key traversal
  - Vec for ordered child, tab, and membership sequences
  - VecDeque for the bounded operation-outcome ledger
  model_recommendations:
  - Use distinct private newtype IDs for each entity kind; IDs are local to one in-memory model and are allocated monotonically without reuse.
  - Use checked allocation and return a structured exhaustion error before changing records, identity allocation, or generation.
  - Keep flat canonical records and explicit workspace-to-owner-frame and frame-to-placement-workspace relations; validate moves by iterative ancestry traversal before mutation.
  - Keep ViewId and ContentResourceId distinct. A view references a host-owned resource; a second view of that resource is accepted only with declared sharing support.
  - Keep operation actor, operation ID, expected generation, request intent, and outcome explicit; check the retained ledger before stale-generation validation, replay only an identical complete retained envelope, and reject a retained ID reused with changed intent.
  - Use a monotonic operation sequence per core instance and retain its high-water mark with the bounded outcome ledger; reject an older sequence whose receipt expired, rather than admitting it as a new mutation.
  - A rejection may update bounded operation bookkeeping, but it leaves model records, generation, and entity-ID allocation unchanged.
  rationale:
  - The current specification explicitly requires stable distinct identities, explicit recursive frame/workspace containment, identity preservation on moves, cycle rejection, and a headless portable core.
  - This packet excludes persistence, GUI, GPU, browser, native window, and content-engine behavior, so those dependencies provide no required capability here.
  - std collections cover the required records, ordered membership, and bounded ledger without introducing a dependency-resolution or feature-unification surface.
alternatives:
  rejected:
  - option: slotmap or generational-arena for initial domain identity/storage
    reason: They provide generation-checked handles that prevent stale slot aliasing, but WP-KUM-007 requires non-reused local domain IDs and flat records; reusable internal slots are not required. Keep them as a later option if measured storage needs justify them, and do not expose storage handles as stable domain IDs.
  - option: egui_tiles as the core model or a runtime dependency
    reason: Its current manifest is a GUI layout crate with egui and other runtime dependencies; its useful ID and transient-cache patterns do not justify importing its presentation model into Kumihimo's portable core.
  - option: Taffy as a WP-KUM-007 dependency
    reason: Taffy is a layout algorithm library with optional tree/storage and serialization features; geometry is outside this packet and belongs to a later bounded WP.
  - option: serde for the initial model
    reason: File persistence and serialized snapshots are explicitly excluded from WP-KUM-007; add serialization only with the later persistence contract.
