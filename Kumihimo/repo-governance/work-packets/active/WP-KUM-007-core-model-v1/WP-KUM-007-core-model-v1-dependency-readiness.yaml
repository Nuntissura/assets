risks_and_controls:
  - risk: A failed move or rejected mutation partially changes records, entity IDs, or generation.
    control: Validate target existence, membership, cycle, sharing, index, admission, generation, and allocation capacity before committing any mutation; test that rejection leaves those model fields unchanged. Operation bookkeeping may record the rejection.
  - risk: Bounded replay retention is misread as exactly-once behavior beyond the retained window.
    control: Use monotonic per-core-instance operation sequences and explicitly reject an expired sequence using the retained high-water mark; document that replay returns a prior outcome only while its receipt is retained.
  - risk: Internal storage identity leaks into saved or public domain identity.
    control: Keep domain IDs as typed, non-reused local IDs; use no slot-reuse library in this packet and introduce persistence identity policy in the later persistence WP.
focused_proof_plan:
- Inspect the resulting kumihimo-core manifest and confirm it has no normal dependencies; independently inspect `cargo tree --manifest-path product/Cargo.toml -p kumihimo-core --edges normal` once the package exists.
- Run the contract's focused `cargo check --manifest-path product/Cargo.toml --all-targets --locked`, `cargo test --manifest-path product/Cargo.toml --locked -p kumihimo-core`, and minimal workspace example on the observed host, after coder admission and build-lane ownership.
- Cover typed-ID separation, monotonic non-reuse and overflow rejection; create nested flat records, move a subtree, preserve IDs and resource references, and reject cycles.
- Cover failed-mutation atomicity for missing/duplicate IDs, invalid index, incompatible sharing, admission limit, and stale generation; verify no record, entity-ID allocation, or generation changes, while allowing a rejection receipt in bounded bookkeeping.
- Cover deterministic operation replay: identical complete retained envelope returns the recorded outcome, changed envelope conflicts, stale generation is explicit, no-op preserves generation, and an expired operation sequence is rejected by the retained high-water mark.
- Exercise the illustrative 20 frames by 30 tabs and additional nesting as functional proof only; do not describe it as a performance benchmark or architectural limit.
not_run:
- No Cargo build, test, example, dependency resolution, install, or target download was run.
- No runtime, WASM, ARM64 execution, or performance result is claimed.
