  upstream_primary_sources:
  - url: https://github.com/rerun-io/egui_tiles/blob/main/src/tiles.rs
    observed: Flat tile map keyed by numeric TileId, explicit next-ID collision checks, and a transient rect cache excluded from serialization.
  - url: https://github.com/rerun-io/egui_tiles/blob/main/src/tree.rs
    observed: A tree root references tile IDs while tile records are separately stored.
  - url: https://github.com/rerun-io/egui_tiles/blob/main/Cargo.toml
    observed: Current manifest is egui_tiles 0.17.1, Rust 1.95, with egui, ahash, itertools, and log runtime dependencies; serde is optional.
  - url: https://docs.rs/slotmap/latest/slotmap/
    observed: SlotMap uses distinct typed keys and generation-aware storage; this is useful if reusable internal slots are later required.
  - url: https://docs.rs/generational-arena/latest/generational_arena/
    observed: Arena indexes pair a slot and generation to reject stale handles after slot reuse.
  - url: https://github.com/DioxusLabs/taffy/blob/main/Cargo.toml
    observed: Taffy keeps its node tree behind the optional taffy_tree feature, which enables slotmap; geometry algorithms can remain separately selected.
  - url: https://doc.rust-lang.org/std/collections/struct.BTreeMap.html
    observed: BTreeMap is a standard-library ordered map with ordered iteration.
  - url: https://doc.rust-lang.org/cargo/reference/features.html
    observed: Cargo unifies dependency features across users; feature selection is therefore not a hard isolation boundary for core dependencies.
