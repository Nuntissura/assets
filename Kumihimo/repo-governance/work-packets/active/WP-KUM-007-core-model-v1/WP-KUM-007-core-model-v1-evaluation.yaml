scope: Portable in-memory core only; coder owns product tests and serial Cargo proof
acceptance_scenarios:
  - case_id: EVAL-KUM-007-001
    refs: [REQ-KUM-BOUNDARIES-002, REQ-KUM-LAYOUT-006]
    method: Move a frame owning multiple containment levels between workspaces with distinct sibling orders and resources.
    expected: Exactly one placement parent changes; descendant workspace/frame/view/resource/group identities and local order survive. Each frame has at most one owned child workspace.
  - case_id: EVAL-KUM-007-002
    refs: [REQ-KUM-LAYOUT-006, REQ-KUM-MODEL-001]
    method: Reject self/descendant cycles, absent targets, a second child-workspace attachment to the same owner frame and invalid insertion indexes; compare the complete canonical model and the next successful generated identity allocation with a control sequence.
    expected: Records, order, ownership, generation and identity allocation are unchanged; structured errors identify the cause and relevant target. Bounded outcome-ledger bookkeeping is evaluated separately from model atomicity.
  - case_id: EVAL-KUM-007-003
    refs: [REQ-KUM-LAYOUT-006]
    method: For siblings [A, B, C], move B to insertion indexes 0, 1 and 2 interpreted after removal; reject index 3. Also append to an empty destination and move an item back to its unchanged order.
    expected: Results are [B, A, C], unchanged [A, B, C], and [A, C, B]; unchanged order is a no-op with unchanged generation. Invalid index preserves the complete model.
  - case_id: EVAL-KUM-007-004
    refs: [REQ-KUM-LAYOUT-001, REQ-KUM-LAYOUT-006]
    method: Create the illustrative 20 frames with 30 views each, vary counts, add nested levels and move a deep subtree through the public API.
    expected: Example counts are neither preset nor ceiling; flat records and iterative traversal do not bind conceptual depth to recursive ownership or call-stack traversal. Functional proof makes no throughput, GUI or engine-resource claim.
  - case_id: EVAL-KUM-007-005
    refs: [REQ-KUM-LAYOUT-001]
    method: Inspect finite aggregate defaults and explicit Limits::unbounded() opt-in; exercise small configured budgets at limit-minus-one, limit and limit-plus-one; lower policy below existing usage, attempt new admission and move an existing item.
    expected: Aggregate default admission is finite and configurable; depth and per-frame limits may remain None. Explicit unrestricted opt-in is honest about host input responsibilities and does not claim a byte/memory ceiling. Rejected admission deletes no existing records and consumes no identity; the manual specifies budget scope and movement accounting.
  - case_id: EVAL-KUM-007-006
    refs: [REQ-KUM-BOUNDARIES-002, REQ-KUM-BOUNDARIES-003]
    method: Request two views of one resource with sharing allowed and denied; move supported views independently and inspect provider/resource references.
    expected: Shared views have different typed view IDs and retain the same resource reference; denied duplication preserves the original. Local identity scope, non-reuse and overflow handling are explicit; no durable-global identity or persistence claim is required.
  - case_id: EVAL-KUM-007-007
    refs: [REQ-KUM-MODEL-001, REQ-KUM-MODEL-002]
    method: Submit increasing instance-local operation sequences, a valid mutation, stale generation, exact-envelope replay after generation changes, changed-envelope reuse, a rejected-operation replay and retention eviction under a small budget.
    expected: Retained exact-envelope replay precedes stale-generation checks and cannot repeat a mutation; changed actor/generation/command under a retained sequence is rejected. A sequence at or below the high-water mark without a retained outcome is explicitly expired and cannot execute again; retention and sequence-overflow behavior are documented without unbounded ID storage.
  - case_id: EVAL-KUM-007-008
    refs: [REQ-KUM-BOUNDARIES-001, REQ-KUM-BOUNDARIES-005, REQ-KUM-BOUNDARIES-006, REQ-KUM-BOUNDARIES-007]
    method: Inspect minimal consumer imports, public API and package graph; consume the coder-owned focused Cargo and runnable-example results; follow the no-context manual.
    expected: Independently usable cohesive core has no mandatory runtime external dependencies when admitted as such; no GUI/native/GPU/Servo public inputs. Manual states commands, ownership, errors, recovery and exact observed host proof. Geometry, persistence, native popouts and actual provider lifecycle stay outside this packet.
proof_handling:
  coding_admission: Independently read published WP-006 revision and dependency readiness before implementation review.
  cargo_owner: Dev-lead-dispatched serial build owner; evaluator does not launch or duplicate Cargo runs.
  independent_review: Read actual product diff and external consumer assertions against these scenarios; reuse unchanged passing proof and target only uncovered behavior.
  completion: Separate compile/test/example results, contract alignment, observed architecture and publication; never mark entire referenced future features implemented from this bounded core.
risks_controls:
  - Partial detach before validation loses a subtree; full pre/post-state comparison and control identity allocation detect it.
  - Frame-owned workspaces confused with split nodes or resource sharing; inspect canonical parent relations and distinct typed records.
  - Replay retention or validation ordering hides repeated effects; small-ledger public command sequences expose the declared boundary.
DIFF_ATTACK_SURFACES:
  - Partial detach or entity allocation before failed admission/cycle/index validation.
  - Subtree depth checks that measure only the moved root; recursive ownership or traversal imposing stack depth.
  - Public snapshot mutation bypassing canonical invariants; frame/group/resource ownership conflation.
  - Retained replay checked after generation, expired sequence admitted again, or receipt bookkeeping confused with model mutation.
INDEPENDENT_CHECKS_RUN:
  - Inspected every mutation arm against validation/commit boundaries; allocation/generation capacity is checked before writes, and public snapshot access is immutable.
  - Compared lowered-limit recovery clauses in the manual with actual CreateFrame/MoveFrame/MoveView/SetLimits paths; deeper moves measure subtree height, while same-depth/shallower recovery matches the declared policy.
  - Inspected all public fields, module visibility, minimal workspace/package manifests and lockfile; no mandatory external runtime dependency, restore setter, GUI/native/GPU/Servo type or hidden external effect is present.
  - Independently opened refreshed dependency readiness and published WP-006 artifacts; core coding admission predecessors are recorded, with publication independently read at c78de3ae9b58cd467225583dee9d63f0ad8961a2.
COUNTERFACTUAL_CHECKS:
  - If mutation.rs MoveFrame wrote source membership before ancestry/index/depth/next_generation validation, rejection would lose or reorder a subtree; actual writes follow these checks.
  - If core.rs execute checked expected_generation before retained complete-envelope lookup, replay after another successful mutation would incorrectly reject; actual lookup precedes that check.
  - If model.rs derived an unrestricted Default again, ordinary Core construction would implicitly bypass aggregate admission; the explicit finite Default and unbounded opt-in are inspected.
BOUNDARY_PROBES:
  - Inspected public consumer contracts.rs against exported commands/snapshot rather than private storage; pre/post snapshots and next generated ID against a control expose rejection side effects. Directly opened saved test output showing every external case passed on the bound candidate.
  - Compared complete retained Envelope equality with actor/operation/generation/command definitions and public replay assertions; original outcome generation is intentionally distinct from current snapshot generation.
NEGATIVE_PATH_CHECKS:
  - Opened cycle/missing/duplicate-child/invalid-index/sharing/stale/budget rejection assertions and private counter-exhaustion assertions; these preserve full model snapshots and test allocation where accessible. Saved log records their owning tests passed.
  - Opened zero/changed-envelope/evicted/capacity-zero/final-sequence assertions; they target explicit denial rather than successful re-execution. Saved log records the replay test passed.
INDEPENDENT_FINDINGS: []
resolved_findings:
  - Initial all-None Limits::default() replaced by max_records=16_384; explicit Limits::unbounded() and host-owned byte/input responsibilities documented.
conclusions:
  source_alignment: No blocking scoped contract gap found in the concrete source/public assertions/manual read.
  compile_tests_example: Independently opened saved check/test/example logs and lead command results; all three exit 0, one private and nine external tests pass, example returns the expected identities at generation 8.
  platform: No ARM64 execution, WASM, GUI, native popout or performance claim accepted.
  final_decision: PASS for the admitted portable in-memory core on the observed Windows x64 host; evaluator reused exact-candidate proof and ran no Cargo. Final outcome publication remains separately pending.
