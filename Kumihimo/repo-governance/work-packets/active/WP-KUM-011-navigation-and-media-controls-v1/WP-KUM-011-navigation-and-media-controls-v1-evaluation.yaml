- case_id: EVAL-KUM-011-011
  refs:
  - REQ-KUM-BACKGROUNDS-003
  title: Requested versus confirmed reduced media work
  method: Hide media or change host frame-rate/resolution/visibility policy; request pause/throttle/budget
    through capable/incapable provider. Delay/refuse/mismatch/duplicate ACK, expire/cancel queued and
    dispatched work, then reconcile exact uncertain effect. Reconcile Applied without typed actual fps/resolution/pause
    observation, then send current and stale-model actual observations.
  expected: Requested/pending/confirmed/unsupported/rejected/failed/Unknown stay distinct; only exact
    current supported applied result confirms pause/throttle and budget. Opacity/hide/submission never
    establishes reduced decode work. Queued expiry is known-not-dispatched; dispatched uncertainty holds
    obligations until reconciliation; stale replies cannot apply newer requested settings. Generic Applied
    reconciliation cannot invent actual pause/fps/resolution; confirmation requires selected typed actual
    echo or fresh scoped observation. Old effect settlement cannot replace newer model observations.
  red_team_control: Reuse010 scoped tickets, host ticks, deadline/barrier, reserved recovery and one-instance
    effect ordering; selected contract fixes typed media request/capability/applied-budget echo rather
    than generic status claiming media facts.
  runtime_status: NOT_RUNTIME_EVALUATED
