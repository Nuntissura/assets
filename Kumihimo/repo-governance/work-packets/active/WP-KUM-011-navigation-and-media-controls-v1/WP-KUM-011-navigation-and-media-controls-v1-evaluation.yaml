    dispatched navigation intent as Applied without a typed actual offset; obtain a later fresh scoped
    observation.
  expected: Each update binds exact provider/model/overview/geometry/settings/gesture scope fixed by selected
    contract. Stale work cannot jump a revised document or revive old gesture. Selected cancel-without-scroll
    policy preserves current authoritative position on stationary representation change; unrelated metadata
    generation alone does not blanket-stale valid work. Applied-effect reconciliation without typed actual
    data settles only the old obligation; actual offset stays Unknown until a valid fresh observation,
    never synthesized from requested offset.
  red_team_control: Check selected revision domains and canonical transition observation owner; final
    IDs and global Core generation alone cannot detect away/back or identical-ID restore.
