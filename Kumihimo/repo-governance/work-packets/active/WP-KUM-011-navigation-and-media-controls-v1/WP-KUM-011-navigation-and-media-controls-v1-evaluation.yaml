  selected_contract_controls: 'Release immediately returns idle controls at latest host-observed position
    while final accepted intent remains pending. Cancel/Escape/capture/focus loss settles local gesture
    and cancels only its own unsent work; dispatched/Unknown effects remain recoverable and position never
    rolls back by assumption. Keep bounded last exact settlement: exact duplicate idempotent, conflicting/older
    reject. Late events never restart drag.'
