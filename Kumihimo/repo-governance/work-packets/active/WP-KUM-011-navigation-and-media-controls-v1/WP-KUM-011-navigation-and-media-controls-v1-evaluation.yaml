    revision stale; counters never wrap. Model/extent/rail geometry/effective mode/settings/binding changes
    cancel drag without scroll; overview-only update never moves document. Observe identical-ID Restore
    and frame movement on canonical transition path; unrelated metadata is not blanket invalidation. Generic
