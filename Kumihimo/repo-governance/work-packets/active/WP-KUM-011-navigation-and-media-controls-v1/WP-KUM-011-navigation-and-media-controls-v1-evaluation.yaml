    and lower limits while prior overview or request is retained.
  expected: Public requests/projected state preserve host semantics and exact jump target/revision. Work
    is bounded by accepted sparse input, never by automatically loading entire documents. Overflow/growing
    replacement rejects unchanged; accepted lowering preserves obligations and permits selected non-growing
    recovery. Unsupported providers disclose capability/fallback.
  red_team_control: Provider owns virtualization, text/scene meaning, content generation and font/layout.
    Selected contract fixes finite defaults, accounting copies and replacement policy as specified.
