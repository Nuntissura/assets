architecture_alignment:
  status: selected_by_lead_full_contract_and_self_contained_spec
  package_direction: '[WP011-R002] Advance unreleased kumihimo-content to0.2 with independent Cargo features
    navigation and backgrounds, default[]. Keep the sole std-only local Core0.3 dependency/default-features=false.
    Use small cohesive settings/navigation/overview/backgrounds modules and minimal existing protocol/routing/lifecycle/scheduler/diagnostics
    integration. One owned Core and existing request/instance/cache/recovery authority; no second controller/queue/arrangement.
    Core0.3/Snapshot3/saved schema1/JSON and their files remain unchanged. No GUI/codec/async/serializer
    dependency.'
  scope_direction: '[WP011-R003] Require exact protocol2.0, reject1.0 and every other version explicitly.
    Replace public Scope.view with typed MountTarget View(ViewId), FrameBackground(FrameId), WorkspaceBackground(WorkspaceId),
    with background variants/APIs only under backgrounds. Preserve all WP010 identity/session/epoch/counter/permission/replay/close/recovery
    guarantees and current admission defaults; narrow fixture migration retains all twelve WP010 behavior
    cases. Document intentional0.1-to0.2 API break and feature selection. [WP011-R004] View attach remains
    canonical; background attach uses a real canonical ResourceId/provider plus existing FrameId or WorkspaceId
    and supported image/video capability, without creating a dummy view/tab or changing Core arrangement.
    At most one active mount per typed target. Common instance allocator, canonical/negotiated/explicit
    host sharing grant, cache ownership and exact cleanup are reused. Mixed View/background sharing rejects
    for this packet; background-to-background sharing requires all grants and same resource. [WP011-R005]
    Validate typed target/current Core identity/resource/provider/connection/mount before updates, enqueue,
    dispatch and ACK. Successful identical-ID Restore retires all target bindings; rejected/replayed Core
    operations cause no extra effects. CloseView affects View mounts only. Moving a frame preserves its
    FrameBackground target/resource, invalidates affected geometry and active gesture prerequisites, and
    never disposes an instance. Provider changes/removal/unavailability and relevant target disappearance
    stale effects; unrelated metadata does not blanket-stale them. Retired exact cleanup never updates
    replacement targets.'
  navigation_direction: '[WP011-R011] Release immediately settles local drag and restores configured idle
    controls at latest host-observed position, while accepted final intent remains pending/confirmed/Unknown
    explicitly. Cancel/Escape/lost capture/focus loss settles local gesture, cancels only its unsent work
    and never assumes dispatched effects or document position reverted. A bounded last exact settlement
    is idempotent; conflicting or older events reject. Model/extent/rail geometry/effective mode/settings/binding
    changes cancel active drag without emitting scroll; later host observation establishes actual position.
    Overview-only update does not move the document. [WP011-R012] Host supplies exact-scope document model
    revision and monotone observation revision with coherent extent/viewport/actual offset, and an independently
    revised sparse semantic overview. Model includes semantic/extent identity, not every offset ACK. Same
    revision/same data is idempotent, same revision/different data conflicts, older revisions stale; checked
    counters never wrap. Offset observations bound model and current attachment; stale/foreign/late data
    never updates current document state. Frame movement/restore/rebind/focus/model change invalidates
    appropriate gesture/request prerequisites without blanket invalidating unrelated metadata.'
  pending_direction: '[WP011-R015] Generic Reconciled Applied settles only its exact old effect/busy obligation.
    Without an exact validated typed actual-offset/applied-budget observation, navigation/media observation
    remains Unknown; never synthesize actual values from requested intent or Confirmation::Done. Existing
    terminal duplicate/history, conflict/expiry, deadline, reserved recovery slot and retired cleanup
    semantics remain. Queued expiry is known-not-delivered; dispatched timeout/cancel ambiguity stays
    Unknown and does not release unrelated/shared reservations.'
  overview_direction: '[WP011-R013] Admit at most one current overview per View mount, default4096 markers
    per overview,65536 aggregate retained marker entries,65536 UTF-8 bytes per overview and256 bytes per
    opaque marker ID/jump target/label/style/unit token. Host may choose explicit None for unrestricted
    dimensions. Validate candidate shape/finite ranges/unique marker IDs and checked sums before replacement;
    full replacement work is O(admitted overview), never whole-document scanning. Every retained opaque
    copy in overview/settings/request/receipt metadata is charged to existing16MiB aggregate, existing
    per-field65536 cap still applies; fixed metadata is bounded by mounts/pending/receipts. Lowered limits
    preserve existing obligations and allow unchanged/decreasing replacement while blocking growth. Caller-owned
    snapshot copies/host render handles are outside retained library bytes, explicitly disclosed.'
  media_direction: '[WP011-R018] Keep per-consumer media work policy, current instance aggregate request
    and exact provider-confirmed actual/Unknown separate. Policies Run/Throttle/Paused/Poster use upper
    work ceilings, not minimum quality demand: default30fps/1920x1080, fps1..240 and dimensions1..16384
    with checked pixel product; None denotes unconstrained allowance only where host policy permits. Pause
    is separate from these ceilings, never a side effect of opacity0 or visibility alone. Unsupported,
    pending, refused, failed, stale and Unknown are observable. Typed applied echo binds exact ticket,
    aggregate/policy revision and reports actual pause/fps/resolution satisfying current aggregate ceilings
    before confirmation; lower actual work is allowed and does not promise quality, physical allocation
    bounds or performance measurements. [WP011-R019] For a shared background instance compute each aggregate
    work ceiling as the component-wise minimum of finite ceilings across consumers requiring active work
    plus separate host instance hard ceilings; None imposes no additional ceiling, allNone remains unconstrained.
    Never use a maximum and falsely claim that a smaller consumer ceiling was met. Pause only when every
    reserved consumer explicitly opts Paused/Poster and none is protected/audio/keep-alive/unsaved/downloading;
    a visible consumer explicitly choosing a still/paused presentation is allowed, while any visible or
    hidden Run/Throttle consumer vetoes pause. Missing/Unknown policy is an active-work veto. Default
    sharingfalse; explicit background grants only. Revalidate current consumer policies/eligibility at
    enqueue, dispatch and ACK. New consumer/protection/policy changes invalidate old aggregate satisfaction;
    a dispatched old effect may have happened, so preserve exact effect recovery/history and Unknown current
    policy until fresh observation. Hiding one consumer changes no other policy and never pauses media
    needed by another. Report instance-confirmed actual separately from per-consumer policy satisfaction.'
  validation_effect: '[WP011-R022] Implement the twelve frozen public WP011 recording-host cases once
    in their owning targets, preserving/revalidating the twelve affected WP010 consumers with narrow API
    migration. Include default/navigation-only/backgrounds-only/all-feature compilation plus one all-feature
    focused test batch and quiet controls example using stable target/verified cache, locked/offline j2
    lead lane. No duplicated helper self-tests, no extra broad Core/JSON suite when inputs remain identical,
    no actual GUI/decoder/physical/platform proof inferred.'
