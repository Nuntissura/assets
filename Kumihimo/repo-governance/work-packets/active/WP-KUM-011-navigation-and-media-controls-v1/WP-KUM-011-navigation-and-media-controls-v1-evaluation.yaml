observed_baseline:
- Historical preparation at 451f7c13cb7527b9f831c4f16854ce4638d75a04 was read-only. This reconciliation
  edits only evaluator-owned YAML; no Cargo/product/Git/state/spec changes. Current full contract is 23R/14A
  with16 accepted specification references.
- Actual settings authority is TOPIC-KUM-CHROME REQ004/005; precedence defaultsâ†’host profileâ†’workspace
  overrideâ†’surface override, constrained by host policy/capability; safe runtime change validates ranges
  and preserves layout identity.
- Existing content privately owns Core; immutable core/snapshot and routed execute expose canonical transition
  path. Scope binds Core identity/session/provider/resource/view/connection/instance/mount; public attach
  requires canonical ViewId.
- Existing typed requests expose attach/input/geometry/focus/presentation/lifecycle and asset/tool/cache/recovery;
  media fps/resolution budget, overview/model and gesture are not existing dedicated typed variants. Capability/support
  and requested/confirmed resource semantics need explicit selected011 extension.
- Core Snapshot canonical records do not provide a universal scrollbar/media settings model; relevant
  host settings projection belongs at the selected modular boundary rather than an invented SETTINGS topic
  or second arrangement.
- Current lifecycle reconciliation result carries effect plus optional lifecycle; generic request kinds
  map to Confirmation::Done. New navigation/media actual values therefore need typed result/observation
  semantics; Applied alone cannot prove requested offset or fps/resolution.
