  refs:
  - REQ-KUM-NAVIGATION-006
  - REQ-KUM-INPUT-001
  title: Stationary press and grab-anchor preservation
  method: Press without moving at top/middle/bottom thumb grab offsets using mouse/touch/pen metadata;
    expand transient overview beside the document.
  expected: Stationary press emits no document-position jump; same pointer/gesture identity and grab anchor
    survive thumb-to-viewport transformation. Document rect/layout remains stable; only selected transient
    presentation changes.
  red_team_control: Distinct rail and map coordinate systems must not turn presentation expansion into
    an absolute document jump; actual OS capture and rendered pixels remain later adapter proof.
