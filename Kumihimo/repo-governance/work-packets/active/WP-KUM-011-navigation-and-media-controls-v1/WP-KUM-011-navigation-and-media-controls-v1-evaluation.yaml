  title: Modes, settings precedence and declared capability fallback
  method: Select thumb/rail only, persistent minimap, persistent combined controls and transient scrub
    mode through defaults/host/workspace/surface overrides; negotiate providers with missing overview/compositing/input
    capability. Change valid and invalid settings at runtime.
  expected: Supported modes expose exact configured controls; host policy/capability constraints and explicit
    fallback are observable. Unsupported map capability never fabricates overview. Invalid settings preserve
    prior effective state/layout identity; recreation/restart requirement is reported when applicable.
  red_team_control: Selected contract fixes supported settings subset/version/projection and fallback
    policy; no fictitious SETTINGS topic or default transient mandate.
  runtime_status: NOT_RUNTIME_EVALUATED
  contract_requirement_refs:
  - WP011-R006
  - WP011-R007
  - WP011-R009
  contract_acceptance_refs:
  - WP011-A001
  selected_contract_controls: Version2 typed field patches resolve defaults→host profile→workspace→surface
    with value/source and explicit policy/capability constraints; selected and effective mode are distinct.
    Four exact modes are ScrollbarOnly/MinimapAlways/ScrollbarAndMinimap/ScrubToMinimap; overview support
    and admitted overview required. Host chooses ScrollbarOnly or Unavailable fallback; invalid settings
    reject unchanged; restart/recreation metadata never executes implicitly.
- case_id: EVAL-KUM-011-002
  refs:
  - REQ-KUM-NAVIGATION-001
  - REQ-KUM-NAVIGATION-002
  - REQ-KUM-INPUT-001
  - REQ-KUM-INPUT-002
  title: Complete range with enlarged thumb and degenerate metrics
  method: Use start/middle/end offsets and a large minimum thumb; vary content extent/viewport/rail length,
    zero scrollable extent or thumb travel, extremely large finite ratios and nonfinite/negative/overflowing
    inputs. Include precise keyboard/page navigation.
  expected: Enlargement preserves reachable complete range on a usable rail and agrees with host scroll
    state. Short/zero travel follows explicit fallback instead of dividing by zero or falsely claiming
    drag reachability; keyboard/page path remains declared. Invalid dimensions/arithmetical overflow reject
    atomically; accessible hit area and visible thumb dimensions stay independent.
  red_team_control: Compare public navigation outputs against known host metrics/endpoints, not a test
    that copies production mapping; selected contract fixes degenerate range/precision policy and large-control
    profile.
  runtime_status: NOT_RUNTIME_EVALUATED
  contract_requirement_refs:
  - WP011-R008
  - WP011-R009
  contract_acceptance_refs:
  - WP011-A002
  selected_contract_controls: Check C,V>=0; R=max(C-V,0); offset[0,R]; rail origin/length>=0 and checked
    finite arithmetic. Thumb=min(track,max(minimum,track*(V/C))) with explicit C0 handling; normalized
    offset/R maps across track-thumb, including exact endpoints. R0 yields offset0; R>0/travel0 disables
    pointer mapping but retains full keyboard range. Include signed zero and large finite inputs. Standard
    rail12/thumb8/min24/hit24 DIP and Comfortable24/16/48/40; positive finite overrides; line40 host document
    units, pageV, Home0/EndR.
