  refs:
  - REQ-KUM-NAVIGATION-003
  - REQ-KUM-NAVIGATION-004
  title: Bounded sparse overview and provider semantic ownership
  method: Attach text and non-text providers carrying sparse overview markers/opaque descriptors, viewport
