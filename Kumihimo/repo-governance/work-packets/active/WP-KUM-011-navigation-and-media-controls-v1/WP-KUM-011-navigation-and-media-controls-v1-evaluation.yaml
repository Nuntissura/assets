    revisions, captured press/grab/presentation anchors. Stationary press, expansion and unchanged pointer
    emit neither Scroll nor Geometry. Held thumb becomes viewport rectangle with unchanged document bounds;
    conflicting pointer/old gesture rejects unchanged.
