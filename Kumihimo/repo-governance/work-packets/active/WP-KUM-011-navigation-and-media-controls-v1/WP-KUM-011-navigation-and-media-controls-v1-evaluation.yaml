  refs:
  - REQ-KUM-NAVIGATION-006
  - REQ-KUM-INPUT-001
  - REQ-KUM-INPUT-002
  - REQ-KUM-INPUT-003
  - REQ-KUM-INPUT-004
  title: Release, cancellation, focus and idempotent settlement
  method: Release outside pane, cancel/Escape, lose focus/capture, change pointer identity and duplicate/reorder
    settlement events during transient drag, including unconfirmed host scroll intent.
  expected: Exactly one gesture settlement returns usable ordinary scrollbar or configured persistent
    controls. Pending versus confirmed scroll position and unsent-only cancellation and no assumed rollback
    policy stay explicit; late movement/release cannot restart or retarget settled gesture. Cancellation
    never rewrites document/layout state from stale start metadata.
