    host hard ceilings;60/15fps consumers require actual<=15, lower actual allowed. AllNone stays unconstrained.
    Pause only if every reserved consumer explicitly Paused/Poster and none protected/audio/keep-alive/unsaved/downloading;
    visible explicitPaused/Poster allowed, visible or hiddenRun/Throttle and missing/Unknown policy veto.
    Hiding one changes no other policy. Revalidate enqueue/dispatch/ACK; old aggregate ACK cannot confirm
    current policy after changes. Instance actual and each consumer satisfaction separate; exact ticket/policy
    revision typed actual required, generic Applied leaves current observation Unknown.
