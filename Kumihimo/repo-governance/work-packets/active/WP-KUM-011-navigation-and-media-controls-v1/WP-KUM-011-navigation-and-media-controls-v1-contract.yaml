research_basis:
  sources:
  - id: vscode-scrollbar
    url: https://raw.githubusercontent.com/microsoft/vscode/main/src/vs/base/browser/ui/scrollbar/scrollbarState.ts
    observed_pattern: Minimum slider clamp recomputes usable travel/full-range ratio; page/delta navigation separate
      from drawing.
    use: Independent geometry and range mapping, with additional explicit zero-travel guards.
  - id: vscode-minimap
    url: https://raw.githubusercontent.com/microsoft/vscode/main/src/vs/editor/browser/viewParts/minimap/minimap.ts
    observed_pattern: Viewport slider derives document/viewport ranges and drag delta; minimap rendering uses bounded
      line window and invalidation.
    use: Host-fed revised sparse overview and captured delta, no full-document rendering in this module.
  - id: egui-scroll-style
    url: https://docs.rs/egui/latest/egui/style/struct.ScrollStyle.html
    observed_pattern: Visible width, minimum handle length and floating/solid allocation are separate style controls.
    use: Host-exposed independent visible/hit geometry and stable document allocation; pattern only, no toolkit
      dependency.
  - id: pointer-events
    url: https://www.w3.org/TR/pointerevents3/
    observed_pattern: Capture, pointerup, pointercancel and lost capture are explicit input stream lifecycle events.
    use: Bounded local gesture settlement; actual OS/browser capture remains adapter work.
  - id: aria-slider
    url: https://www.w3.org/WAI/ARIA/apg/patterns/slider/
    observed_pattern: Step/Home/End/page commands and value/orientation/name semantics are separate from visual
      thumb.
    use: Precise keyboard and inspectable accessibility metadata; actual assistive technology proof remains open.
  - id: html-media
    url: https://html.spec.whatwg.org/multipage/media.html#dom-media-pause
    observed_pattern: Media pause, playback, mute and poster are distinct actions/state.
    use: Separate visual/audio policy and exact acknowledged decoder budget; no HTML engine dependency.
  - id: chrome-lifecycle
    url: https://developer.chrome.com/docs/web-platform/page-lifecycle-api
    observed_pattern: Hidden, frozen and discarded differ; disappearance need not emit a reliable terminal event.
    use: Visibility never proves paused/disposed resources; retain Unknown and old exact reconciliation.
  - id: cargo-features
    url: https://doc.rust-lang.org/cargo/reference/features.html
    observed_pattern: Features compose additive conditional compilation and default selection.
    use: Two independent optional features, default[], with all four relevant compilation combinations.
  selected: Content0.2/protocol2.0 one existing controller with independent optional navigation/backgrounds feature
    modules and typed non-tab background targets
  reuse:
  - Core0.3 IDs/immutable snapshot/routed execute
  - WP010 scoped queue/terminal history/Unknown/recovery/instance/cache ownership
  - Stable target and verified cache; existing quiet public recording-host/manual
  rejected:
  - Mandatory toolkit/codec/async/serializer or another controller/resource ledger
  - Dummy tab/view for frame or workspace background
  - Opacity/hidden/request/Drop as proof of pause/release or speed
  - Whole-document overview scan or generic Applied as actual offset/media budget
  - Unrelated ML/asset-training/social claims as runtime dependency evidence; primary source implementations fit
    this problem
  risks_controls:
  - risk: Generalized mount misses view-only close/protection/tool or restore paths.
    control: Exhaustive typed target matching plus unchanged Core files, retained twelve WP010 cases and real non-tab/background
      target acceptance.
  - risk: Thumb clamp/zero travel or expanded map jumps or loses endpoints.
    control: Separate normalized range mapping, captured anchor, no-motion assertion and explicit unavailable pointer/full
      keyboard fallback.
  - risk: Model/setting change or cancellation invents rollback of already dispatched scroll.
    control: Cancel local gesture/unsent only; retain exact Unknown recovery and require fresh typed actual observation.
  - risk: Generic Applied reconciliation or old media ACK fabricates current actual state.
    control: Settle exact old obligation only; observation remains Unknown without validated actual echo/current
      revision.
  - risk: Sparse overview/settings copies evade bounded admission or atomic replacement.
    control: Per-item/field/current and aggregate retained-copy accounting, checked net size and lower-limit preservation.
  - risk: One hidden consumer pauses a shared visible/protected engine or premature release.
    control: Aggregate all reserved consumers, revalidate before pull/ACK, preserve instance/cache reservations
      until exact cleanup.
  - risk: Optional modes grow into toolkit/decoder integration or fake physical/GUI proof.
    control: Default[] features, local Core dependency only, quiet recording-host proof and explicit actual integration
      limits.
  validation: Twelve WP011 cases and twelve affected WP010 consumers in one all-feature batch; four compile feature
    combinations and quiet example; unchanged Core/JSON proof reused; exact source/origin binding; GUI/decoder/physical/platform
    open
