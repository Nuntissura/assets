research_sources:
  - title: Cargo Book, Build Cache
    url: https://doc.rust-lang.org/cargo/reference/build-cache.html
    relevance: Documents stable target-dir configuration and sccache as a separate compiler cache layer.
  - title: Cargo Book, cargo build
    url: https://doc.rust-lang.org/cargo/commands/cargo-build.html
    relevance: Documents the Cargo parallel-job control; use it to bound concurrency within the admitted lane.
  - title: Mozilla sccache, Local Cache
    url: https://github.com/mozilla/sccache/blob/main/docs/Local.md
    relevance: Documents the Windows default local cache, default size, and single-local-server constraint.
  - title: Cargo Book, build.incremental
    url: https://doc.rust-lang.org/cargo/reference/config.html#buildincremental
    relevance: Confirms CARGO_INCREMENTAL=0 overrides Cargo profile/config settings and disables incremental compilation.
  - title: Rustc Book, incremental codegen option
    url: https://doc.rust-lang.org/rustc/codegen-options/index.html#incremental
    relevance: Describes rustc incremental state reuse and its effect on recompilation.
  - title: Mozilla sccache, Rust support
    url: https://github.com/mozilla/sccache/blob/main/docs/Rust.md
    relevance: States incremental rustc compilation must be disabled for Rust caching and lists unsupported linker and emission cases.
  - title: Mozilla sccache, README caveats
    url: https://github.com/mozilla/sccache
    relevance: Confirms incremental Rust crates are not cached and documents cache-key caveats.
