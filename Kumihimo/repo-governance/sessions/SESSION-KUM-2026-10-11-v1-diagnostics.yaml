recommendation:
  ownership: Keep one admitted owner and at most one active Cargo command for Kumihimo; keep all Kumihimo Cargo runs serialized as current.yaml requires.
  target_directory: Use .local/cargo-target relative to the Kumihimo project root, as current.yaml.target_path_anchor specifies; set CARGO_TARGET_DIR in dev-lead commands and keep the same path across builds.
  shared_pc_contention: If another Rust compile or test run is active and resource contention is material, defer the Cargo run, recheck process and available-memory snapshots, and continue non-build work. Never stop another project's process.
  sccache: Dev-lead commands will set RUSTC_WRAPPER=sccache process-locally. Reuse the available sccache installation and cache; never stop an unowned server or delete the cache as a coordination mechanism.
  incremental_compilation: Set CARGO_INCREMENTAL=0 process-locally for the std-only core while using sccache. sccache's Rust support rejects incremental rustc invocations, so disabling incremental compilation makes eligible invocations cacheable. The tradeoff is loss of rustc's per-crate incremental reuse for changed crates; stable target reuse can retain unchanged Cargo artifacts, but it does not restore that incremental state. sccache only caches eligible invocations with matching inputs and flags, and some crate/linker invocations are unsupported, so no speedup is promised.
  initial_jobs: 'Keep the first owned Cargo lane at -j 2. The latest snapshot showed 57% CPU load and active rustup, cargo, and rustc processes whose command lines did not reference Kumihimo; defer any new Cargo run until they clear. The sample is instantaneous and does not identify those processes’ owners.'
  lane_admission: Contention is present in the latest snapshot; defer another Cargo run while the observed Rust processes remain active. Do not stop them. The dev lead retains lane ownership.
  proof_boundary: WP007 check, test, and example outputs are recorded in runtime_observations. The example's 0.01-second dev-profile duration is a single warm run observation, not a benchmark or speedup claim.
  build_lane_configuration: Runtime outcomes are verified from saved logs; the exact process-local Cargo environment values are not recorded in those logs.
