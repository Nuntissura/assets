[package]
name = "kumihimo-external-apps"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
description = "Explicitly selected external-window positioning for Kumihimo"
publish = false

[features]
default = []
windows = ["dep:windows-sys"]

[dependencies]
kumihimo-core = { path = "../kumihimo-core", version = "0.3.0", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", optional = true, features = ["Win32_Foundation", "Win32_System_Threading", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
serde_json = "=1.0.151"

[[example]]
name = "selected_window"
required-features = ["windows"]
