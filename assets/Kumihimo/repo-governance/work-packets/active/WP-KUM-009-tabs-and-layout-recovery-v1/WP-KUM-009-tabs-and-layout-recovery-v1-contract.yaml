  - repo-governance/work-packets/active/WP-KUM-009-tabs-and-layout-recovery-v1/WP-KUM-009-tabs-and-layout-recovery-v1-evaluation.yaml
  selected: Flat semantic DTO/Core validation with optional saved-type serde and one bounded JSON codec; host identity/resolution/IO,
    canonical tab tombstones and reversible max projection
  rejected:
  - Serializing live Snapshot/Core/receipts or toolkit-owned state
  - RON/new uncached codec without need, unbounded JSON, hidden scope generators, fake legacy migrations or fake
    host IO proof
  risks_controls:
  - 'Restored raw IDs alias old work: host incarnation checked before ledger plus lineage/extant checks and monotone
    allocator; no absent-history claim'
  - 'Whole restore panics in legacy repair: dedicated detached whole-state route and older-save test'
  - 'Close invalidates tool references or true flags bypass closure: retained tombstones and one effective-presentation
    path for every solver/output'
  - 'Malformed/duplicate JSON overwrites saved records: strict pre-normalization validation, byte/output bounds
    and constructor numeric checks'
  - 'Group moves bypass pins or source order: atomic whole-group route with canonical order/all-member checks'
  - 'Max hidden panes block geometry or indirect docks bypass guard: projection-aware solve, shared affected-workspace
    guard and failed-exit preservation'
  - 'Older async save overwrites new data: identity/generation stamp plus explicit host single-writer atomic/recoverable
    protocol, no IO claim'
