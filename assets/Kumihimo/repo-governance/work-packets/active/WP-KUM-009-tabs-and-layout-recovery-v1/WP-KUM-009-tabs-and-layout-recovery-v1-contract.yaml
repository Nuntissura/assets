schema_version: kumihimo.wp-contract.v1
wp_id: WP-KUM-009-tabs-and-layout-recovery-v1
title: Implement tab semantics and versioned arrangement recovery
scope:
- Complete the original tab/group/pin/overflow and semantic versioned arrangement scope over the existing canonical
  core
- Add real bounded optional JSON wire roundtrip, explicit schema/restore/placeholder/save-stamp contracts without
  importing engines or file IO
- Implement all carried equalize/swap/maximize/restore-layout operations and safe incarnation-bound restore
- Retain default core independence, small cohesive modules, prior accepted behavior and exact focused platform proof
