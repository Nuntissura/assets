schema_version: handshake.codex-source.v10
kind: codex_source
identity:
  codex_source_id: CODEX-KUMIHIMO-v1
  project_id: KUMIHIMO
  version: 28
  revision: 25
  status: active_model_operated
execution_modes:
  default: model_operated
  modes:
    model_operated:
      bookkeeping_actor: authorized_model_maintainer
      provider_entry_mode: identical_navigation_routers
      project_protocol_path: repo-governance/codex/protocols/project/minimal.md
      shared_protocol_path: repo-governance/codex/protocols/shared/minimal.md
      role_authorization:
        maintainer: Owns bounded product and governance work; no compulsory role handoffs
        dev_lead: Owns session, task state, scope admission and publication
        coder: Owns admitted product paths; fixed model and rotation policy
        dependencies: Owns admitted dependency-readiness report
        diagnostics: Owns dispatched diagnostics and failure investigation
        evaluation: Owns focused per-WP evaluation
      transition_registry:
        phases:
        - planned
        - active
        - blocked
        - done
        - cancelled
        done_requires: WP acceptance evidence; pushed containment when publication is required
      mechanical_adapter_fields:
        evaluator: maintainer checks current contract/state and affected proof
      operating_protocol:
        start: Run the session-start command; inspect session roster, taskboard, selected WP contract/state and
          relevant specification topics
        execute: Write a bounded WP directly; activate in state; implement in this checkout
        recover: Read current Git diff and WP state; reconcile uncertain effects before retrying
        proof: Run only affected focused checks; broad/slow checks only when explicitly required
        status: Update WP state then taskboard; never mark unimplemented product behavior done
      unresolved_project_bindings: []
      runtime_prerequisites: Resolve only dependencies required by the current WP
repository_workflows:
  output_path: repo-governance/codex/workflows/repository-workflows.md
  authority_source: repo-governance/codex/current/codex-source.yaml
  steps:
  - workflow_id: KUM-FLOW-000
    title: Session start and team recovery
    required_reads:
    - canonical authority
    - repo-governance/sessions/current.yaml
    - active WP contract/state
    - Git status and exact revision
    actions: &id001
    - Read canonical authority and current session; reconcile current scope and later stop instructions
    - Read WP state, board and current Git diff; reconcile external effects
    - Check role chats, file ownership, coder rotation count and dependency/eval dispatch
    - Inspect resource/cache observations before granting serial Cargo ownership
    - Continue the recorded next action; update state and board at meaningful milestones
    proof: Live session-start output, role readiness and canonical Git state agree with dispatch
  - workflow_id: KUM-FLOW-001
    title: Select and execute a bounded WP
    required_reads:
    - taskboard
    - WP contract/state
    - relevant spec topics
    actions:
    - Write the direct contract; mark active; execute in this checkout
    - Run affected focused proof; record observed results; sync status
    proof: Accepted WP outcome is observed; no self-authored status substitutes for proof
  - workflow_id: KUM-FLOW-002
    title: Recover and publish
    required_reads:
    - WP state
    - Git status/diff
    actions:
    - Reconcile incomplete effects before retrying
    - Commit only owned paths; push when authorized; verify the exact remote revision
    proof: Current state and independent remote read agree with reported outcome
compilation:
  output_path: repo-governance/codex/CODEX.md
  provider_entry_mode: identical_navigation_routers
  generator_id: kumihimo-sync
  generator_version: '1'
  manual_output_edits_allowed: false
  stale_output_blocks_product_execution: true
  repair_admission: registered_action_specific_authority_and_generation_checks
  regenerate_command: python repo-governance/repo-scripts/sync.py
authority_domains:
  product: repo-governance/specification/current/
  engineering: repo-governance/codex/build-rules/current/build-rules.yaml
  scope: WP contract
  status_and_recovery: WP state
  navigation: taskboard projection
conflict_resolution:
  operator_minimal_profile_wins_over_stock: true
  pinned_templates_not_active_authority: true
mutation_classes: {}
hydration_bindings: {}
product_operation_routing: {}
rules:
- rule_id: KUM-AUTH-001
  requirement: Use the selected model-operated minimal profile; stock templates are reference inputs and add no
    gates.
- rule_id: KUM-WORK-001
  requirement: Create a bounded WP with scope, files, dependencies, acceptance and focused proof before execution;
    mark it active in state. No separate refinement/enrichment phase is required.
- rule_id: KUM-WORK-002
  requirement: Use this checkout by default; microtasks, worktrees, leases, receipts and independent review are
    optional unless the WP explicitly requires them.
- rule_id: KUM-STATE-001
  requirement: Persist WP phase, owner, changed files, observed proof, blockers and next action at meaningful milestones;
    update the taskboard from WP state.
- rule_id: KUM-RECOVER-001
  requirement: On resume inspect WP state and current Git diff; reconcile uncertain commits, pushes and external
    outcomes before repeating effects.
- rule_id: KUM-SPEC-001
  requirement: Keep accepted meaning in the current self-contained specification; preserve IDs and snapshot prior
    revisions. Label proposals and unverified capabilities honestly.
- rule_id: KUM-SCOPE-001
  requirement: Execute only the active WP scope; serialize overlapping writes and keep sibling assets untouched.
- rule_id: KUM-PROOF-001
  requirement: Use the shortest affected proof that supports the claim; no long checks, ceremonial gate chains or
    stock compliance audits by default.
- rule_id: KUM-PORTABLE-001
  requirement: Use repository-relative paths and ignored local configuration; never hardcode machine paths into
    project artifacts.
- rule_id: KUM-PROCESS-001
  requirement: Do not stop processes this session did not start without the operator process-stop acknowledgment
    required by global authority.
- rule_id: KUM-SESSION-001
  requirement: At every session start run python repo-governance/repo-scripts/session_start.py; inspect canonical
    authority, current session, active WP state and Git state before dispatch or effects.
- rule_id: KUM-TEAM-001
  requirement: Use a dev lead plus separate coding, dependency, diagnostic and evaluation chats; the operator authorizes
    direct team messages on blockers/failures and bounded subagents, with serialized overlapping file writes.
- rule_id: KUM-TEAM-002
  requirement: Admit coding only after the accepted spec and WP predecessor is published and the dependency agent
    records readiness; eval agent writes focused acceptance cases and observed evaluation for each WP.
- rule_id: KUM-TEAM-003
  requirement: Use gpt-6.1-sol high for coding; rotate coders after two completed implementation WPs, creating a
    fresh chat when local rotation is unavailable. Use cheaper agents for exploration when adequate and retain reasoning
    strength for difficult diagnosis.
- rule_id: KUM-CARGO-001
  requirement: The dev lead grants one Kumihimo Cargo lane at a time; use the stable source/target roots and verified
    cache, bundle affected checks and reuse valid results. Other teams may delay builds while source work continues;
    never stop unowned processes or delete their caches.
- rule_id: KUM-TICK-001
  requirement: Run the authorized 15-minute thread heartbeat only while operator authorization and its automation
    are active; inspect WP/team progress, CPU, available memory, disk and Rust process activity, recover blockers
    with evidence and notify only meaningful change or needed operator action. After operator removal, record deletion
    and do not recreate or resume automatic ticks without renewed operator authorization.
- rule_id: KUM-SCOPE-002
  requirement: Session-specific expansion authority lives in the session record; do not carry AFK/expansion permission
    into another session without operator scope reconciliation. Stop or pause immediately on later operator instruction.
stock_workflows: {}
project_installation:
  execution_mode: model_operated
model_materialization:
  operation_mode: model_operated
  model_operation_ready: true
  handshake_runtime_ready: false
  project_runtime_proven: false
  unresolved_binding_values_are_inactive: true
  stock_rule_obligations_remain_active: false
  unresolved_field_paths_are_discovery_only: true
  binding_admission: Resolve action-relevant binding values from project evidence; parameterized path patterns and
    illustrative examples do not deactivate their enclosing rules.
  unresolved_field_paths: []
  selected_project_rules_active: true
minimal_artifact_contract:
  contract_schema: kumihimo.wp-contract.v1
  contract_fields:
  - wp_id
  - title
  - scope
  - files
  - dependencies
  - spec_refs
  - requirements
  - acceptance
  - proof
  state_schema: kumihimo.wp-state.v1
  state_fields:
  - wp_id
  - generation
  - phase
  - owner
  - changed_files
  - proof
  - blockers
  - next_action
  taskboard_command: python repo-governance/repo-scripts/sync.py
  phases:
  - planned
  - active
  - blocked
  - done
  - cancelled
session_start:
  command: python repo-governance/repo-scripts/session_start.py
  session_ref: repo-governance/sessions/current.yaml
  steps: *id001
