[package]
name = "rss-wasm"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rss-contracts.workspace = true
rss-core = { path = "../rss-core", version = "=0.1.0" }
hsscrap.workspace = true
hsscrap-wasm = { path = "../../../hsscrap/crates/hsscrap-wasm", version = "=0.1.0" }
serde.workspace = true
serde_json.workspace = true
uuid = { version = "=1.26.1", features = ["serde"] }
handshake_canonical_json = { path = "../../../shared/handshake_canonical_json", version = "=0.1.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"

[[test]]
name = "wire_contract"
path = "../../tests/wasm/native.rs"

[[bin]]
name = "rss-wasm-reference"
path = "../../tests/wasm/reference.rs"
test = false
