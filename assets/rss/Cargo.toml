[workspace]
members = ["crates/rss-contracts", "crates/rss-core", "crates/rss-acquisition", "crates/rss-provider-syndication", "crates/rss-gui", "crates/rss-provider-instagram", "crates/rss-provider-youtube", "crates/rss-provider-tiktok"]
resolver = "2"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
hsscrap = { path = "../hsscrap/crates/hsscrap", version = "=0.1.0" }
rss-contracts = { path = "crates/rss-contracts", version = "=0.1.0" }
