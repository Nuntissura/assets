[workspace]
members = ["crates/hsscrap"]
resolver = "2"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
uuid = { version = "=1.26.1", features = ["serde"] }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
url = "=2.5.8"
