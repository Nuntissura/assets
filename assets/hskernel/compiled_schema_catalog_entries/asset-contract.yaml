requirements:
- id: CSCE-001
  requirement: Preserve original module lineage and the existing compiled_schema_catalog_entries, declarative_function_name
    and insert_catalog_identity public behavior; keep generic logic independent of Handshake schema constants and
    database execution.
- id: CSCE-002
  requirement: One shared declaration recognition capability must support both strict compiled/base inventory and
    ordered overlay inventory; host adoption must remove both local recognizers rather than retain a divergent second
    parser.
- id: CSCE-003
  requirement: 'Strict/base inventory retains its expected table set and eight-count tuple: tables, fields, indexes,
    events, views, sequences, accesses and functions. Duplicate identities reject; identities remain sorted; supported
    declaration/modifier forms and ACCESS/FUNCTION rejection behavior remain compatible.'
- id: CSCE-004
  requirement: Ordered overlay inventory consumes the validated base identities and host-supplied sources in their
    existing order. Preserve optional OVERWRITE and IF NOT EXISTS handling, plain definitions, optional TABLE after
    ON, supported TABLE/FIELD/INDEX/EVENT/FUNCTION/SEQUENCE/ACCESS/ANALYZER/PARAM identities, unknown-kind errors
    and identity-set deduplication; do not impose strict-base duplicate/count rules on overlays or invent body-replacement
    semantics.
- id: CSCE-005
  requirement: Multiline declaration headers yield the same identities as equivalent one-line headers without interpreting
    quoted or commented content as new top-level declarations. This scope is declaration inventory, not a replacement
    SurrealQL execution engine.
- id: CSCE-006
  requirement: Keep compiled schema sources, expected names/counts, production source ordering, source/catalog hash
    computation and database INFO checks in the host. Preserve their lineage and hash inputs; any intentional source/hash
    transition belongs to the distinct adoption contract.
- id: CSCE-007
  requirement: Before source implementation or publication, bind the actual implementation owner and exact source
    and host-adoption contract references through Codeleader and the existing Primary custody. This draft and catalog
    presence are not implementation or publication admission.
- id: CSCE-008
  requirement: Keep canonical paths repository-relative and portable; do not change existing Kumihimo or sibling
    asset placement, global skills/policies, Candle, engines or model files.
proposed_public_contract:
  preserved_base_api: 'compiled_schema_catalog_entries(schema: &str, expected_table_names: &[&str], expected_counts:
    (usize, usize, usize, usize, usize, usize, usize, usize)) -> Result<Vec<String>, String>'
  preserved_helpers:
  - declarative_function_name
  - insert_catalog_identity
  overlay_boundary: 'production_catalog_entries(base_entries: &[String], ordered_sources: &[(&str, &str)]) -> Result<Vec<String>,
    String>'
  preserved_helper_signatures:
  - 'declarative_function_name(signature: &str) -> Result<&str, String>'
  - 'insert_catalog_identity(entries: &mut BTreeSet<String>, identity: String) -> Result<(), String>'
  overlay_api_status: 'Exact API and caller fit acknowledged by retained author B: validated base plus original
    ordered sources[1..]; no candidate review completion or execution admission inferred'
acceptance:
- id: CSCE-A001
  case: Actual Engine Profile multiline DEFINE EVENT header and equivalent one-line header produce identical event
    identity in both consumers.
- id: CSCE-A002
  case: Strict/base table/count mismatches, duplicate identities and unsupported ACCESS/FUNCTION declarations retain
    their existing errors.
- id: CSCE-A003
  case: Ordered overlays preserve source ordering, OVERWRITE/IF NOT EXISTS/plain handling, identity deduplication
    and additional overlay kinds without acquiring strict-base count/duplicate rejection.
- id: CSCE-A004
  case: Comment/quoted text, truncated headers and unsupported kinds cannot silently invent valid declaration identities;
    existing accepted fixtures retain behavior.
- id: CSCE-A005
  case: Both original host call sites adopt the same independently verified published module revision under the
    distinct host adoption contract; the exact formerly failing owning schema test passes without rewriting semantic
    schema content just to fit the parser.
