  durable_storage:
    inspected_at: '2026-10-11'
    sources:
    - https://github.com/900Labs/900CRM/blob/main/crates/crm-core/src/storage/db.rs
    - https://github.com/900Labs/900CRM/blob/main/crates/crm-core/src/storage/mod.rs
    - https://github.com/twentyhq/twenty/blob/main/packages/twenty-server/src/engine/metadata-modules/field-metadata/field-metadata.entity.ts
    - https://github.com/frappe/crm/blob/develop/crm/fcrm/doctype/crm_lead/crm_lead.json
    - https://github.com/espocrm/espocrm/blob/master/application/Espo/Modules/Crm/Resources/metadata/entityDefs/Case.json
    - https://github.com/medusajs/medusa/blob/develop/packages/modules/pricing/src/models/price-list.ts
    - https://docs.rs/rusqlite/0.40.2/rusqlite/struct.Transaction.html
    - https://docs.rs/redb/latest/redb/
    - https://www.sqlite.org/lang_transaction.html
    comparison:
    - 900CRM services reach into SQLite Connection and use its entity schema/migrations; selective service adoption
      would replace our Store, snapshot, workspace and replay boundaries. Reuse SQLite/rusqlite rather than copy
      CRM services.
    - Twenty field metadata imports TypeORM and workspace migration/permission entities. Frappe lead metadata depends
      on DocType/role framework behavior; Espo Case metadata depends on its entity/link services. These are workflow
      references rather than drop-in Rust embedding components.
    - Medusa price-list model imports framework utils and price-list rules/prices. Preserve original exact pricing
      implementation and reusable browser adapters.
    - redb offers Rust-native ACID storage but introduces a different KV/file contract. SQLite permits independent
      SQL canonical rereads and fits inspected CRM persistence patterns.
    selected: Opt-in bundled rusqlite 0.40.2 Store adapter; existing core and browser components unchanged. One
      schema-2 JSON snapshot per workspace, immediate transaction for CAS and capacity, FULL synchronous local-file
      commits. Host grants stay in Crm.
    rejected:
    - Wholesale upstream translation or framework adoption
    - Custom file locking/rename database
    - Default mandatory SQLite dependency
    - WAL with naive live database copying
    risks_and_controls:
    - 'Single-writer contention: bounded busy timeout; stale revision returns Conflict; no automatic intent-changing
      retries.'
    - Snapshots have bounded serialized size/workspace count; reject unsupported database/snapshot versions and
      mismatched revision metadata.
    - 'Database contains private records/receipts: host controls file ACLs, backups and local filesystem; exclude
      database sidecars from packages.'
    - 'Unknown commit result: retry identical request after restart; receipts commit in same snapshot. Offline closed-database
      copies only for backup/restore; rollback loses later commits.'
    validation: Disk reopen plus independent SQL snapshot reread; two-process competing CAS; process exit before
      commit; post-commit response loss/replay; authorization and pricing/fields/revisions; malformed/schema/capacity
      errors; affected fmt/clippy/package/governance checks.
    selection_status: Previous SQLite assessment preserved as optional adapter reference; selected host acceptance
      is now SurrealDB, then PostgreSQL. New source-level reassessment pending dependency team findings.
