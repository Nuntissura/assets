schema_version: buurtman.spec.v1
specification_id: SPEC-buurtman-balie-v1
revision: 15
product_name: Buurtman Balie
owner: model_operated
purpose: Build an independently reusable CRM product for multiple operator projects; Portal admin is its first embedding,
  not the definition or limit of the CRM's purpose.
requirements:
- requirement_id: BB-BOUNDARY-001
  statement: Module GUI is provided by the host; keep GUI/presentation in a separate crate group from the independently
    reusable Rust module. Hosts embed CRM into website admin backend panels AND custom software/apps. Retain root
    buurtman-balie/core source API; separate host/demo integration composition and optional web/npm presentation.
    Core package excludes GUI/web/Python demo/manual presentation and their runtime dependencies; host identity,
    stock, checkout, orders, usage and image ownership does not shift into CRM.
  status: accepted
- requirement_id: BB-PLATFORM-001
  statement: Required first runtime targets are Windows x64 AND ARM64; macOS/Linux come later. Require separate
    actual Windows x64 and ARM64 execution evidence; compile/cross-compile/package proof cannot substitute for runtime
    proof. Unavailable runtime evidence stays outstanding; do not claim macOS/Linux tested or generic crossplatform
    proof.
  status: accepted
- requirement_id: AF-CRM-REQ-001
  statement: The shared CRM must have independently maintained source, public contracts, standalone operation/proof,
    pinned releases and explicit host adapters. Its core must not depend on Portal accounts, usage tables, routes,
    private content or deployment paths; Portal-specific administration belongs in the Portal adapter.
  status: accepted
- requirement_id: AF-CRM-REQ-002
  statement: Each business workspace owns its authorized customer and relationship records. Reusing the same module
    across Portal, the photo service and the store does not share their databases, contacts, credentials or permissions.
    Any future cross-business sharing must be explicit and authorized, not inferred from the same operator or email
    address.
  status: accepted
- requirement_id: AF-CRM-REQ-003
  statement: Preserve all three host goals and the fuller CRM direction while implementing the first accepted workflow.
    Discover photo-service and store requirements before finalizing host-specific adapters or claiming compatibility.
  status: accepted
- requirement_id: AF-CRM-REQ-004
  statement: Preserve customer, order, product and availability context across linked record navigation; users must
    not retrace unrelated module hierarchies to inspect a related record. Specify return navigation and retained
    selection before implementation.
  status: accepted
- requirement_id: AF-CRM-REQ-005
  statement: Retain product tags and fuzzy product search as requested store workflow needs; define matching, identifiers,
    ranking and stock/variant scope against actual product data before implementation.
  status: accepted
- requirement_id: AF-CRM-REQ-006
  statement: Retain access to useful product information during til/kassa use, including provider, descriptions,
    website information and images beyond price and stock. Define authorized customer-visible versus staff-only
    fields; preserve the active sale while inspecting product information.
  status: accepted
- requirement_id: AF-CRM-REQ-007
  statement: Retain configurable fields for distributors, clients and products and product/website editing as discovery
    scope. Define field ownership, types, validation and publication behavior before choosing shared-core or host
    responsibilities.
  status: accepted
- requirement_id: AF-CRM-REQ-008
  statement: Carry forward sales feedback, product/inventory management, order tracking, customer-to-order links
    and product availability as explicit store needs. Clarify sales feedback and canonical owners before finalizing
    retail contracts.
  status: accepted
- requirement_id: AF-CRM-REQ-009
  statement: Retain a later connection to something like Pricebuddy as an unresolved integration goal; inspect the
    intended service and public contracts before selecting an adapter.
  status: accepted
- requirement_id: AF-CRM-REQ-010
  statement: Build CRM source in ../.assets/buurtman-balie with cohesive public contracts, behavior, adapter, reusable
    presentation and standalone proof surfaces.
  status: accepted
- requirement_id: AF-CRM-REQ-011
  statement: Provide a product field editor; creating a typed field adds it to the canonical reusable field catalogue.
    Use that catalogue for product field inputs and typed search filters rather than independent UI lists.
  status: accepted
- requirement_id: AF-CRM-REQ-012
  statement: Require exactly B2C or B2B classification on every Customer creation/update; keep this fixed mandatory
    option visible in client records and assignment selectors.
  status: accepted
- requirement_id: AF-CRM-REQ-013
  statement: Provide reusable additional pricing tiers separate from classification; select B2C, B2B or named custom
    base pricing and a configured extra percentage discount, including employee B2B-plus-discount pricing.
  status: accepted
- requirement_id: AF-CRM-REQ-014
  statement: Provide product B2C/B2B/named-custom prices with explicit currency, decimal scale and tax basis. Preview
    the assigned client price with base, discount, final amount and revisions; reject missing bases and preserve
    exact amounts.
  status: accepted
- requirement_id: AF-REQ-001
  statement: Create a durable report/feedback record with reporter account/profile UUID, DDMMYY display date, unambiguous
    timestamp/timezone, captured screen/module and authorized screenshot reference. Present screenshot preview before
    explicit submission; cancellation must not create a report. Use safe no-space labels such as DDMMYY-user-screen
    with collision-safe report IDs.
  status: accepted
  owner: Portal host adapter
- requirement_id: AF-REQ-002
  statement: Expose operator-only user and per-user usage views with declared metric units, windows, freshness and
    canonical owners; never equate loaded rows with full user or usage totals.
  status: accepted
  owner: Portal host adapter
- requirement_id: AF-REQ-003
  statement: Provide an operator-only bug report panel with reporter, date, screen, screenshot and bounded triage
    status. Enforce report and screenshot authorization server-side; redact secrets and never expose other users'
    reports to ordinary customers.
  status: accepted
  owner: Portal host adapter
- requirement_id: BB-GROWTH-001
  statement: Overview, user/customer directory, customer detail with account/profile linkage, declared usage, interaction
    history, internal business notes and screenshot bug/support cases. Preserve all original AF acceptance.
  status: proposed
  source: Proposed; user/usage/bug-report requirements already requested, additional CRM detail requires accepted
    contract scope.
- requirement_id: BB-GROWTH-002
  statement: Contacts/companies, lead lifecycle, opportunities/pipelines, follow-ups, tasks and reusable saved views.
  status: proposed
  source: Proposed fuller-CRM direction, retained for sequencing; reuse Taskboard/Handpick contracts when available.
- requirement_id: BB-GROWTH-003
  statement: Explicitly selected email/calendar integrations, workflow automation, reporting and import/export.
  status: proposed
  source: Proposed growth scope; provider bindings, authorization and acceptance must be defined before implementation.
- requirement_id: BB-DURABLE-001
  statement: Support SurrealDB first for durable host integration, preserving workspace isolation, coherent snapshots,
    revision CAS, atomic replay receipts and recoverable uncertain commits. PostgreSQL support follows; hosts retain
    their canonical database ownership. Optional SQLite remains a reference/proof adapter and does not satisfy selected
    SurrealDB acceptance.
  status: accepted
- requirement_id: BB-REUSE-001
  statement: Before extending the durable core, reassess current reusable libraries/components and upstream implementations
    against actual source and embedding boundaries. Preserve working original CRM code; compare selective reuse
    rather than assuming a full CRM rewrite.
  status: accepted
- requirement_id: BB-LOCALE-001
  statement: Provide module language toggles for English (en), French (fr) and Dutch (nl) that hosts can expose
    later. Apply the selected language consistently to reusable CRM controls, labels and status/error presentation;
    preserve canonical identifiers, values, B2C/B2B classification and exact money contracts across language changes.
    Locale selection does not select tax jurisdiction or translate operator-authored record data.
  status: accepted
- requirement_id: BB-COMPLIANCE-001
  statement: Maintain an EU-US-Belgium compliance research team for taxes/VAT and other applicable rules. Record
    current official sources, applicability, unresolved host/transaction scope and evidence-backed implementation
    candidates before changing fiscal behavior. Mandatory B2C/B2B classification is not proof of VAT exemption;
    language is not jurisdiction. Host tax, checkout and invoice owners remain canonical; research alone does not
    certify compliance or authorize an unspecified tax engine.
  status: accepted
- requirement_id: BB-MANUAL-001
  statement: Provide a CRM INTERNAL user manual for future agents/models with no prior context. Include purpose,
    startup, integration/navigation, supported inputs/outputs, language toggles, source ownership, diagnostics,
    failure/recovery and bounded swarm operation. Ship it through a reusable module surface rather than relying
    on repository chat history.
  status: accepted
- requirement_id: BB-CONCURRENCY-001
  statement: 'Assume concurrent agent-swarm use. Mitigate data races through authoritative workspace/revision fencing,
    atomic replay and safe host integration; explicitly test data races. The current operator correction also requires
    CRDT use under BB-CRDT-001; prior no-specific-CRDT wording is superseded. Select additive worker::CommandWorker
    whole-command admission under WP010: one supplied raw Store and Authorization owned by one Crm on one persistent
    thread, complete Execute/Get/SearchFiltered and minimally forwarded reads, authorization evaluated at dispatch.
    Preserve WorkerStore API and core service/CAS/replay; participating local load/CAS interleaving removed only.
    External processes and stale record intents still conflict; no global budget or production Portal integration
    inferred.'
  status: accepted
- requirement_id: BB-CRDT-001
  statement: Use CRDT AND data-race tests as explicitly requested by the operator. Research and select the CRDT
    implementation, exact mergeable scope/owner, convergence semantics and race proof before executable implementation.
    Do not automatically replace authoritative CAS/replay, exact money or host stock ownership with a merge model.
    First executable unit is optional Rust-only Yrs0.28.0 description draft in a separate collaboration crate; host-owned
    persistence/retention, actual durable host sync, publication and interoperability goals remain outstanding.
    Restrict first component ingress to opaque crate-generated DraftUpdate/DraftCheckpoint provenance; arbitrary
    binary decoder safety is unresolved and cannot be inferred from byte caps or temporary-document postvalidation.
  status: accepted
- requirement_id: BB-WORKFLOW-001
  statement: A dedicated subagent runs realistic employee/operator workflows for camera-store, supermarket and web-SaaS,
    including inventory, new items and labeling, to catch missing functionality, bad workflows and UI problems using
    actual screenshots and UI/backend observations. Distinguish temporary/demo data from canonical host owners;
    record scenario coverage, concrete gaps/remediations and specification/stub follow-ons without implying host
    compatibility or authorizing unselected feature implementation. Preserve the separate photo-service website
    scope.
  status: accepted
- requirement_id: BB-BACKPRESSURE-001
  statement: 'Require bounded database backpressure and data mitigation for overloaded/failing database boundaries:
    cap pending/in-flight work and payloads, expose actionable pressure/failure state and preserve recoverable writes
    without silent loss or uncontrolled retries. Portal is the first selected WP010 workload/host; preserve camera-store,
    separate photo-service website and supermarket scope. Numeric workload, admission, deadline and response budgets
    remain unresolved.'
  status: accepted
- requirement_id: BB-PERFORMANCE-001
  statement: Rust remains mandatory for the CRM core. Provide fast responses under the documented supported workload;
    measure latency and resource pressure against a host-selected numeric budget before claiming performance. No
    numeric latency target is inferred from this request. Operator authorizes a selected provisional Portal diagnostic
    numeric workload/profile and measurements before production SLA selection; report profile, environment, limits
    and observed values explicitly as provisional diagnostics. Production performance acceptance still requires
    representative host workload and selected latency/resource budgets; camera-store and supermarket remain in scope.
  status: accepted
- requirement_id: BB-RESEARCH-001
  statement: Research broader CRM uses and reusable improvements across web SaaS, stores, warehouses, employee management/HR
    and supermarkets. Include charts/day-to-day store sales overviews, SaaS resource usage and feature/module usage,
    Portal RSS website usage/popularity and tag behavior/used tags. Preserve canonical metric/data owners and evidence
    before analytics implementation.
  status: accepted
- requirement_id: BB-ANALYTICS-001
  statement: 'Candidate connected CRM analytics: daily store sales charts, warehouse availability/movement context,
    SaaS resource and feature/module usage, RSS website popularity and tag behavior, employee workflows. Define
    canonical sources, metric units/windows/freshness, privacy/authorization and real host adapters before implementation;
    demo CRM records do not establish business metrics.'
  status: proposed
- requirement_id: BB-COMPLIANCE-002
  statement: 'Proposed evidence-backed follow-on controls: host-owned effective-dated fiscal decisions and invoice
    links/status; receipt-aware privacy retention/replay/restoration; channel-specific communication suppression;
    separate HR/analytics access projections. Concrete owner facts, transaction/jurisdiction applicability and production-boundary
    acceptance must be selected before implementation.'
  status: proposed
- requirement_id: BB-FIELD-UX-001
  statement: 'Make reusable fields easy for nontechnical users: label-first dropdown of existing canonical fields
    plus Create New. Existing selection shows read-only definition without duplicate creation or retyping. New label
    generates a valid ASCII canonical key with explicit Unicode/collision handling; optional advanced key override
    preserves host API. Preserve field catalogue types/scopes and canonical ownership; English/French/Dutch localization,
    disposal, in-flight drafts and actual desktop/mobile browser proof required.'
  status: accepted
- requirement_id: BB-ATOMIC-LINK-001
  statement: Create a record with up to32 outgoing relations under one CAS and replay receipt. Reject any invalid
    relation without committing the record, relations or receipt. Host identity and image ownership remain external.
  status: accepted
constraints:
- Independently reusable Rust core; injected authorization and storage; business workspace isolation.
- Host identities, stock, checkout, orders, usage and images retain canonical owners.
- No live host compatibility, durable persistence, release pin, migration or upstream CRM parity claimed.
operator_requests:
