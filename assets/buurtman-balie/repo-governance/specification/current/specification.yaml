research_basis:
  crdt_selection:
    inspected_at: '2026-10-11'
    document_ref: docs/research/crdt-selection-v1.md
    source_review: Reuse lane inspected primary library manifests/APIs and local boundaries; coordinator inspected
      its complete research and current Store/core/presentation ownership. No library build or interoperability
      verdict here.
    sources:
    - https://github.com/y-crdt/y-crdt/blob/v0.28.0/yrs/Cargo.toml
    - https://github.com/y-crdt/y-crdt/blob/main/yrs/src/lib.rs
    - https://github.com/y-crdt/y-crdt/releases
    - https://github.com/automerge/automerge/blob/main/rust/automerge/src/lib.rs
    - https://github.com/automerge/automerge/blob/main/rust/automerge/Cargo.toml
    - https://github.com/rust-crdt/rust-crdt/blob/master/src/orswot.rs
    - https://docs.yjs.dev/api/document-updates
    local_sources:
    - src/contracts.rs
    - src/service.rs
    - src/surreal.rs
    - web/package.json
    selected: Optional Rust-only collaboration crate at crates/buurtman-balie-collaboration using yrs exactly0.28.0
      for one host-owned Record.description candidate draft. No core feature dependency, GUI or schema2 changes;
      explicit dependency on core only if publication conversion needs it. First component does not require Yjs
      interop.
    protocol:
    - Host supplies workspace/record/generation/unique replica IDs and mandatory byte/text budget config without
      production defaults/SLA.
    - First unit creates local text state with checked UTF8 byte-offset/range splices, opaque private-byte DraftUpdate
      export and opaque DraftCheckpoint clone/fork from crate-local APIs only; no raw-byte import, serde decode
      or exposed mutable Yrs document.
    - Apply only provenanced typed updates/checkpoints to temporary state; validate document domain/text/budgets
      before swap. Wrong-domain/over-budget typed inputs leave live state unchanged. Arbitrary malformed binary
      safety is not claimed.
    - Scratch is a fresh Yrs Doc reconstructed only from accepted opaque checkpoint; Doc.clone shares store and
      is forbidden for isolation.
    - Reordered trusted updates may remain causally pending; preserve them within full encoded-state/checkpoint
      budget, expose has_missing_updates and prove convergence only after all required updates arrive. Never drop
      pending updates as successful sync.
    - Duplicate/reordered update delivery converges; actual simultaneous writers/readers require race tests independently
      of serial convergence fixtures. Stable implementation tested on both first Windows runtime targets.
    - Host owns authorization, membership, unique replica allocation, durable collaboration persistence/retention
      and accepted-intent recovery. In-memory success is not durable acknowledgment or real-host synchronized proof.
    - Explicit publication remains host Crm::Update with CAS and identical receipt operation; draft never automatically
      merges prices, stock, classification, tiers, receipts or other scalar business ownership.
    rejected:
    - Bytecap plus temporary-document postvalidation presented as decoder memory/stack safety
    - Custom Yrs binary parser or raw import/serde deserialization into first-unit opaque tokens
    - Generic Map CRDT for authoritative scalar business decisions or automatic schema2/core GUI changes
    - Mandatory core CRDT feature/runtime and mandatory Yjs interoperability in first Rust-only component
    - Automerge wider document/MSRV change for first plain-text draft or ORSWOT set semantics for text
    risks_and_controls:
    - Replica ID reuse can corrupt causal identity; host allocates unique live replicas and defines restore/generation
      lifecycle.
    - Inspected published Yrs Any::decode recurses nested values and reserves decoded counts; byte limits and postvalidation
      do not supply decoder depth/allocation limits. Restrict reachable first-unit ingress to crate-owned plain-text
      provenance; raw durable ingress needs separately selected resource isolation/bounded decoder proof.
    - UTF8 partial-character/overflow splice ranges violate plain text; validate byte boundaries/ranges and test
      Unicode/typed domain rejection.
    - Convergence does not prove safe concurrent memory access; actual bounded simultaneous reads/writes and no
      panic/deadlock proof.
    - Volatile draft and persisted CRM update have distinct outcomes; host retains original publish intent and separate
      durable collaboration owner.
    validation: Root selected exact opaque provenance contract after reuse-source findings; implementation assignment
      may proceed. Require deterministic duplicate/reorder/concurrent-edit convergence after complete delivery,
      pending-causal-state inspection/budgets, fresh-scratch isolation, Unicode byte splice/checkpoint fork, typed
      oversize/wrong-domain no-mutation and public no-raw-ingress proof plus barrier-start race tests on Windows
      ARM64 and x64 with native/emulated scope explicit. Root owns dependency/static/package/build proof; real-host
      durable sync, publication races/restart/retention and optional future Yjs interoperability remain outstanding
      acceptance.
    decoder_inspection: Root reports completed reuse-source findings; coordinator inspected published yrs0.28.0
      src/any.rs Any::decode and src/update.rs Update::decode recursion/count reservations without component resource
      ceiling; src/doc.rs Doc Clone and src/store.rs DocStore Arc show shared clone; src/transaction.rs encode_state_as_update_v1
      includes pending data and has_missing_updates exposes pending structs/delete sets. No custom parser/raw import
      authorized.
    retained_interoperability: UTF16/browser, raw binary persistent reload and exact-pin Yjs proof remain future
      outstanding work; Rust-only UTF8 byte-offset component does not claim those paths.
  crate_boundary:
    inspected_at: '2026-10-11'
    sources:
    - https://doc.rust-lang.org/cargo/reference/workspaces.html
    - https://doc.rust-lang.org/cargo/reference/manifest.html#the-exclude-and-include-fields
    - https://doc.rust-lang.org/rustc/platform-support.html
    local_sources:
    - Cargo.toml
    - src/lib.rs
    - web/package.json
    - examples/json_bridge.rs
    - examples/standalone.rs
    - tooling/standalone.py
    - tooling/browser-proof.py
    observed: Root is one Rust package including web/examples/Python presentation tooling; web is already a distinct
      private npm package. Harness discovers default target/debug/examples/json_bridge from repository root.
    patterns: Cargo workspace members share lock/build output; package include/exclude is relative to package root.
      Rust target support documentation is toolchain scope, not this product's execution proof.
    selected: Preserve root buurtman-balie package and Rust API/source; separate host/demo integration member at
      crates/buurtman-balie-host-demo with the existing examples, explicitly consuming root core. Keep web/npm optional
      presentation separate; remove presentation/demo packaging inputs and dependencies from core package.
    rejected: Gratuitous relocation/renaming of core, GUI dependency in core, implicit production host composition,
      or treating target compilation as runtime acceptance.
    risks_and_controls:
    - Harness example lookup can break after separation; retain example names and discover actual Cargo output/configured
      binary path.
    - Private/development assets can leak through package globs; verify core and demo/presentation contents independently.
    - Host-demo dependency must explicitly forward needed core features without making GUI/runtime mandatory in
      core.
    validation: Independent core consumption/package exclusions, explicit host-demo composition and desktop/mobile
      proof, affected Rust/static checks and actual separate Windows x64/ARM64 execution. macOS/Linux deferred.
    proof_status: No new package/build/runtime checks performed by coordinator; architecture-specific execution
      outstanding.
  swarm_admission:
    inspected_at: '2026-10-11'
    document_ref: docs/research/swarm-boundaries-v1.md
    source_review: Coding lane inspected current primary sources and Portal boundaries; coordinator read the recorded
      research and current synchronous Store contract. No runtime or host compatibility verdict.
    sources:
    - https://docs.rs/tokio/latest/tokio/sync/mpsc/fn.channel.html
    - https://docs.rs/tokio/latest/tokio/task/fn.spawn_blocking.html
    - https://docs.rs/tower/latest/src/tower/buffer/service.rs.html
    - https://docs.rs/tower/latest/src/tower/limit/concurrency/layer.rs.html
    - https://docs.rs/tower/latest/tower/load_shed/index.html
    - https://aws.amazon.com/builders-library/timeouts-retries-and-backoff-with-jitter/
    local_sources:
    - src/contracts.rs
    - src/service.rs
    - src/surreal.rs
    - tooling/standalone.py
    patterns:
    - Bounded shared admission includes pending count/bytes and running work; finite message capacity alone does
      not bound upstream waiter allocations.
    - Started blocking calls cannot be forcibly cancelled; retain running capacity until actual completion.
    - Timeout can follow committed effects; preserve identical-operation receipt reconciliation and one retry owner.
    selected: First executable unit is a configurable shared synchronous Store worker with one in-flight lane, cloneable
      handles sharing a bounded pending queue, explicit payload and queue/caller-deadline config, immediate overload
      rejection and pressure counters. Async hosts invoke through their blocking executor.
    functional_controls:
    - One persistent worker owns one supplied Store; no new worker per request or mandatory Tokio/Tower core dependency.
    - Validate explicit host config; declare submitted-byte accounting separately from total memory and encoded
      prior-plus-next transport/response budgets. Bound sizing before allocating oversized encoded copies.
    - Full/oversized/closed admission rejects before Store invocation; expired queued commands never execute.
    - Serialize dispatch/expiry decisions; in-flight caller timeout returns Storage with uncertain outcome and retains
      worker capacity until completion. Identical Context/Request/operation receipt reconciles writes.
    - No automatic retries, silent receipt pruning or durable acknowledgment of volatile queue admission.
    - Expose bounded redacted pending/running/rejected/expired/completed/uncertain pressure counters; document admission
      closure/drain and finite underlying transport timeouts without forced cancellation guarantees.
    - Store admission supplies no actor/grant revalidation at dispatch; existing Crm authorization and host fences
      retain ownership. Local shared limits do not prove cross-process/database-wide admission.
    retained_host_scope:
    - Portal-first
    - camera-store
    - photo-service-website
    - supermarket
    rejected:
    - Unbounded spawn_blocking or one thread per call
    - Per-handle limits presented as shared service or database-wide limits
    - Releasing running capacity on caller timeout or claiming timeout rolls back a write
    - Automatic CRDT replacement of authoritative CAS/money/stock, mandatory async framework or implicit production
      Portal wiring
    risks_and_controls:
    - Hung synchronous transport monopolizes the lane; host supplies finite transport timeouts and observes pressure.
    - Caller timeout races dispatch; atomically classify never-started versus uncertain-dispatched and reconcile
      receipts.
    - Submitted payload cap does not bound wire/response amplification; host enforces separate encoded/response
      budgets.
    - Volatile queue cannot survive process loss; caller/host retains original recoverable operation intent.
    validation: Deterministic gated Store tests for shared count/byte saturation, rejected/expired commands never
      reaching Store, timeout-after-dispatch with capacity retained, exact receipt replay and changed-intent rejection,
      error propagation and closure/drain. Devlead owns focused Rust/static/package/governance proof; selected live
      SurrealDB proof remains independent. Production Portal wiring and cross-process admission require separate
      proof.
    performance_status: P1 provisional Portal diagnostic numeric profile selected before implementation/run; actual
      measurements pending. Production representative workload/latency/resource budgets/SLA remain unresolved.
    provisional_profile:
      profile_id: BB-PORTAL-DIAGNOSTIC-P1
      status: selected_provisional_not_production
      backend: Actual Crm plus shared WorkerStore wrapping temporary MemoryStore; not canonical Portal production
        data.
      seed:
        records: 100
        organizations: 10
        customers_b2c_b2b: 40
        support_cases: 25
        interactions: 25
        description_ascii_bytes: 256
        tags: true
        record_links: 50
