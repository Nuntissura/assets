<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Buurtman Balie · Products and fields</title><link rel="stylesheet" href="styles.css"></head>
<body><main><span class="crm-badge">Buurtman Balie · temporary demo data</span><h1>Products and reusable fields</h1><p>Create product information, define reusable fields, and find records using those fields.</p>
<div id="user-manual"></div><div class="crm-layout"><div><section class="crm-panel"><h2 id="product-heading">New product</h2><form id="product-editor"><label>Product name<input name="name" required maxlength="128"></label><label>Description<textarea name="description" maxlength="8192"></textarea></label><label>Tags, separated by commas<input name="tags" maxlength="2048"></label><fieldset><legend>Product pricing</legend><label>Currency<input name="currency" maxlength="3" pattern="[A-Za-z]{3}" placeholder="EUR"></label><label>Tax basis<select name="tax_basis" aria-label="Tax basis"><option value="">Choose tax basis</option><option value="Included">Tax included</option><option value="Excluded">Tax excluded</option></select></label><label>Price decimal places<input name="price_scale" type="number" min="0" max="6" value="2"></label><label>B2C price<input name="b2c" inputmode="decimal"></label><label>B2B price<input name="b2b" inputmode="decimal"></label><label>Custom price key<input name="custom_key" maxlength="128"></label><label>Custom price<input name="custom_price" inputmode="decimal"></label></fieldset><div id="product-fields"></div><div class="crm-actions"><button type="submit">Save product</button><button type="button" id="new-product">New product</button></div></form><p id="product-status" role="status"></p></section>
<section class="crm-panel"><h2>Search products</h2><form id="search"><label>Product name or tag<input name="query" maxlength="64" placeholder="Try a name, tag or misspelling"></label><label>Filter field<select name="field" aria-label="Filter field"><option value="">All products</option></select></label><div id="filter-value"></div><button type="submit">Search</button></form><p id="search-status" role="status"></p><div id="results"></div></section></div><aside id="field-editor"></aside></div><div id="client-pricing"></div></main><script type="module" src="app.js"></script></body></html>
