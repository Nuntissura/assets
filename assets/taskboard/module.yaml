  composition_layer: feature_module
  owned_mechanic_ref: null
  presented_primitive_module_refs: []
  composed_module_refs: []
  exposes_presentation: true
  architecture_profile_refs: []
  build_unit_ref: Cargo.toml
  build_unit_kind: own
  public_contract_refs:
  - repo-governance/modules/taskboard-maintenance.yaml#/contracts/public_contract
  private_implementation_roots:
  - src
  - web
maintenance:
  contract_version: 1
  owner_ref: repo-governance/modules/taskboard-maintenance.yaml#/contracts/owner
  unit_kind: code
  source:
    canonical_repository_url: https://github.com/Nuntissura/assets.git
  standalone:
    source_root_refs:
