  purpose: Portable taskboard domain validation and controlled task workflow presentation
  status: active
authority:
  source_spec_refs:
  - repo-governance/specification/current/specification.yaml
  applicable_build_rule_ids:
  - TASKBOARD-BUILD-001
  - TASKBOARD-BUILD-002
  - TASKBOARD-BUILD-003
reuse:
