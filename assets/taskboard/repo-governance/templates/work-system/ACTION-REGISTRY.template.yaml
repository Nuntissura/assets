schema_version: handshake.action-registry.v10
kind: action_registry
execution_mode_contract_ref: HT-AUTH-CODEX-001.execution_modes

identity:
  registry_id: ACTIONS-PROJECT-v1
  project_id: PROJECT-REPLACE-ME
  version: 25
  status: draft
  schema_ref: repo-governance/schemas/action-registry.schema.yaml


ownership:
  controller: handshake
  direct_state_mutation_forbidden: true
  every_accepted_action_requires_receipt: true
  duplicate_idempotency_returns_original_result: true
  same_key_with_different_action_inputs_rejected: true
  receipt_schema: handshake.receipt.v9

required_envelope_fields:
  - action_id
  - action_type
  - idempotency_key
  - actor_id
  - session_id
  - expected_generation
  - target_ids
  - reason
  - evidence_refs

admission:
  rule_id: ACTION-ELIGIBILITY-001
  evaluator: handshake.action_eligibility
  consumers: [controller, taskboard, gui, model_clients]
  sources: [this_registry, bound_transition_registry, role_authorization, current_target_state]
  action_context_flags_override_class_defaults: true
  always_check: [actor_authorization, target_identity, expected_generation, valid_action_schema, idempotency_identity]
  state_dependent_actions_require_registered_transition: true
  class_name_alone_does_not_require_claimed_mt: true
  product_writes_require_active_binding: true
  mt_execution_requires_valid_owned_claim: true
  conditional_checks_owner: actions.admission_checks_and_commit_checks
  wp_temporary_outputs_settled_ref: wp_temporary_outputs_settled
  admission_checks_allow_start_and_commit_checks_gate_published_outcomes: true
  pending_commit_checks_do_not_block_work_needed_to_satisfy_them: true
  execution_release_is_ineligible_until_all_commit_checks_pass: true
  rejection_reasons_are_vocabulary_not_unconditional_gates: true
  available_result_fields: [eligible, action_type, target_ids, observed_generation, failed_conditions, permitted_next_action_types]
  permitted_next_actions_must_pass_same_evaluator: true
  client_availability_is_advisory_and_never_authorization: true
  recheck_authorization_generation_conditions_and_lease_at_commit: true
  stale_product_inputs_do_not_block_authorized_recovery_or_management_by_themselves: true
  expired_worker_lease_never_authorizes_worker_mutation: true
  recovery_uses_registered_controller_authority_and_existing_recovery_protocol: true
  lease_duration: until_verdict_recorded_or_claim_released
  process_stop_requires_recorded_launch_identity: true
  rejection_reasons_ref: rejection_policy.reject_without_partial_state_change

checks:
  module_source_first_adoption: {inputs: [mt.execution.module_change_stage, mt.execution.depends_on, module_manifest.maintenance.source.canonical_repository_url, wp_contract.architecture_binding.module_lifecycle_refs, solution_bindings, solution_lock], predicate: host_adoption_has_distinct_passed_standalone_source_predecessor_independently_verified_at_canonical_GitHub_revision_and_exact_revision_artifact_adapter_pins_before_host_writes, fails_with: missing_required_proof, owner: controller, rule_ref: BR-MODULE-LIFECYCLE-007}
  CHK-MODULE-LIFECYCLE-001: {inputs: [module_manifest.maintenance, HT-REPO-MODULE-001.validation.maintenance_contract], predicate: declared_maintenance_contract_has_resolved_nonempty_required_fields_and_valid_kind_and_adapter_pair, fails_with: schema_invalid, owner: controller, rule_ref: BR-MODULE-LIFECYCLE-001}
  module_lifecycle_binding: {inputs: [wp_contract.architecture_binding.module_lifecycle_refs, mt.context_capsule.module_maintenance_refs, module_manifest.maintenance], predicate: applicable_module_contracts_resolve_and_mt_slice_is_from_parent_with_task_specific_commands_and_proof_and_exact_consumed_release_pins, fails_with: missing_required_proof, owner: controller, rule_ref: CODEX-MODULE-LIFECYCLE-001}
  planning_input_consistency: {inputs: [refinement.refinement.reality_check.scope_edges, refinement.refinement.reality_check.research_refs, wp_contract.scope.included], predicate: stub_scope_and_research_refs_are_present_and_mutually_consistent, fails_with: invalid_model_detailing_fields, owner: controller}
  authorized_matrix_proposal: {inputs: [action.actor_id, action.reason, refinement.origin.operator_request_ids], predicate: actor_holds_project_configuration_authority_and_operator_intent_is_recorded, fails_with: unauthorized, owner: controller}
  selector_integrity: {inputs: [refinement.matrix_resolution.match_evidence_refs, refinement.matrix_resolution.assessed_entry_ids], predicate: every_source_and_selector_ref_resolves_to_an_existing_stable_id, fails_with: incomplete_or_unresolved_scope_relevant_matrix_coverage, owner: controller}
  accepted_spec_delta_and_selector_integrity: {inputs: [refinement.spec_enrichment.disposition, refinement.spec_enrichment.sync.validated, refinement.matrix_resolution.assessed_entry_ids, wp_state.generation], predicate: product_meaning_change_is_accepted_through_enrichment_and_selectors_still_resolve_at_commit, fails_with: unvalidated_spec_enrichment, owner: controller}
  matrix_identity_and_retained_history: {inputs: ['workflow.build_matrix.entries[entry_id].entry_id', 'workflow.build_matrix.entries[entry_id].lineage'], predicate: entry_exists_and_lineage_and_completed_snapshots_are_retained_not_deleted, fails_with: unknown_target, owner: controller}
  existing_wp_identity: {inputs: [wp_state.wp_id, wp_state.phase], predicate: target_wp_id_resolves_to_a_recorded_wp_state, fails_with: unknown_target, owner: controller}
  typed_proposal_only: {inputs: [action.semantic_payload, wp_state.activation.bindings], predicate: payload_stages_non_executable_typed_detailing_and_binds_no_enforcement_or_mt_release, fails_with: invalid_model_detailing_fields, owner: controller}
  nonterminal_phase: {inputs: [wp_state.phase], predicate: wp_phase_is_in_the_action_allowed_wp_phases, fails_with: invalid_transition, owner: controller}
  activation_transition: {inputs: [wp_state.phase, action.expected_generation, wp_state.generation], predicate: registered_activation_transition_exists_from_current_phase_at_expected_generation, fails_with: invalid_transition, owner: controller}
  completed_refinement_enrichment: {inputs: [refinement.resolved_context.ready_for_wp_derivation, refinement.spec_enrichment.phase_validated, refinement.refinement.reality_check.red_team.minimum_controls], predicate: refinement_red_team_and_enrichment_are_recorded_complete_for_the_activation_scope, fails_with: unvalidated_spec_enrichment, owner: controller}
  validated_spec_sync: {inputs: [refinement.spec_enrichment.disposition, refinement.spec_enrichment.sync.validated, refinement.spec_enrichment.sync.applied_revision, wp_contract.authority_snapshot.specification.revision], predicate: wp_contract_pins_the_enriched_spec_revision_and_no_unsynced_spec_delta_remains, fails_with: unvalidated_spec_enrichment, owner: controller}
  scope_relevant_matrix_sdk_freshness: {inputs: [wp_contract.impact_assessment.assessed_entry_ids, wp_contract.authority_snapshot.build_matrix.revision, wp_contract.authority_snapshot.sdk_catalog.digest, workflow.build_matrix.revision, sdk_catalog.digest], predicate: bound_matrix_and_sdk_contracts_match_their_current_revisions_for_the_activation_scope, fails_with: stale_matrix_or_sdk_contract_inputs, owner: controller}
  dependency_readiness: {inputs: [wp_contract.dependencies, wp_state.blockers], predicate: every_necessary_dependency_is_available_or_recorded_as_a_surfaced_blocker, fails_with: unresolved_dependency, owner: controller}
  governed_worktree_ready: {inputs: [wp_state.activation.worktree_ref, git.worktree_list, git.branch_list], predicate: wp_worktree_exists_in_git_inventory_under_repository_structure_worktree_policy, fails_with: unreconciled_git_state, owner: controller}
  wp_temporary_output_binding_ready: {inputs: [wp_state.activation.temporary_output_root, host_profile.artifact_root, host_profile.alternate_build_output_grant], predicate: temporary_output_root_resolves_from_the_canonical_main_root_without_fallback_or_path_escape, fails_with: resource_unavailable, owner: controller}
  registered_rebase_transition: {inputs: [wp_state.phase, wp_state.freshness.stale_surfaces], predicate: registered_rebase_transition_exists_from_current_phase_with_changed_inputs_or_scope_proposal_named, fails_with: invalid_transition, owner: controller}
  bounded_staged_revision: {inputs: [wp_state.freshness.stale_surfaces, wp_contract.identity.contract_revision, wp_state.activation.bindings], predicate: staged_revision_is_bounded_and_prior_contract_and_active_enforcement_remain_unchanged, fails_with: out_of_scope, owner: controller}
  active_binding: {inputs: [wp_state.phase, wp_state.activation.bindings, wp_state.activation.worktree_ref], predicate: wp_phase_is_active_or_later_with_committed_activation_bindings, fails_with: invalid_transition, owner: controller}
  solution_impact_authorization: {inputs: [wp_contract.authority_snapshot.solution_bindings, action.evidence_refs, receipt.semantic.impact_assessment], predicate: solution_binding_change_names_a_pinned_solution_version_digest_and_recorded_impact_assessment, fails_with: unresolved_solution_binding, owner: controller}
  proven_candidate: {inputs: [wp_state.stock_execution_state.verdicts, receipt.mechanical.evidence_hash], predicate: candidate_source_scope_has_recorded_pass_verdicts_with_matching_evidence_hashes, fails_with: missing_required_proof, owner: controller}
  current_scope_inputs: {inputs: [mt.parent.wp_contract_revision, wp_contract.identity.contract_revision, mt.parent.wp_contract_digest, wp_contract.authority_snapshot.specification.revision], predicate: mt_parent_pin_matches_the_current_activated_contract_and_its_snapshot_spec_revision, fails_with: stale_generation, owner: controller}
  dependency_verdicts: {inputs: [mt.dependencies, 'wp_state.microtasks[dep_id].phase', 'wp_state.stock_execution_state.verdicts[mt_id==<dep_id>].submission_revision'], predicate: every_dependency_mt_is_passed_with_verdicts_naming_its_submitted_revision, fails_with: unresolved_dependency, owner: controller}
  conflict_free_write_scope: {inputs: [mt.execution.allowed_write_paths, 'wp_state.microtasks[*].claim_ref', 'wp_state.microtasks[*].allowed_write_paths'], predicate: requested_write_paths_are_disjoint_from_every_other_live_claim, fails_with: out_of_scope, owner: controller}
  claim_transition: {inputs: ['wp_state.microtasks[mt_id].phase', 'wp_state.microtasks[mt_id].claim_ref'], predicate: mt_phase_is_ready_needs_remediation_or_needs_new_approach_and_no_other_live_claim_exists, fails_with: invalid_transition, owner: controller}
  action_scoped_evidence_identity: {inputs: [receipt.action_id, receipt.attempt_id, 'wp_state.microtasks[mt_id].attempts'], predicate: receipt_names_an_existing_action_and_attempt_of_the_target_mt, fails_with: schema_invalid, owner: controller}
  observation_not_authority_mutation: {inputs: [receipt.semantic, receipt.mechanical], predicate: receipt_payload_contains_observations_only_and_no_phase_verdict_or_contract_field, fails_with: schema_invalid, owner: controller}
  owned_unexpired_lease: {inputs: ['wp_state.microtasks[mt_id].claim_ref', 'wp_state.microtasks[mt_id].lease.actor_id', 'wp_state.microtasks[mt_id].lease.status', action.actor_id], predicate: claim_lease_is_owned_by_the_acting_actor_and_not_released_or_verdict_settled, fails_with: expired_lease, owner: controller}
  recoverable_release_state: {inputs: [receipt.mechanical.changed_paths, git.status, git.pushed_commit_ref], predicate: preserved_work_is_committed_or_recorded_recoverable_before_the_claim_ends, fails_with: unsettled_effects, owner: controller}
  typed_observation: {inputs: [receipt.semantic.blocker.type, receipt.semantic.blocker.evidence_refs, receipt.semantic.blocker.recovery_owner], predicate: blocker_has_a_registered_type_evidence_refs_and_a_recovery_owner, fails_with: schema_invalid, owner: controller}
  implementation_gates: {inputs: [receipt.mechanical.compile_result, receipt.mechanical.static_check_result, receipt.mechanical.check_input_digest, build_rulebook.project_profile.implementer_check], predicate: a_compile_or_static_check_result_is_pass_with_command_ref_and_log_ref_its_command_is_the_declared_implementer_check_and_check_input_digest_before_equals_after, fails_with: missing_required_proof, owner: controller, rule_ref: CODEX-STEER-009}
  pushed_commit_ref: {inputs: [action.target_ids.submission_commit, git.remote_refs, git.branch_list], predicate: submission_commit_is_contained_in_an_existing_declared_pushed_branch, fails_with: unreconciled_git_state, owner: controller}
  relevant_input_paths_recorded: {inputs: [receipt.mechanical.relevant_input_paths, 'wp_state.stock_execution_state.submissions[*].relevant_input_paths', 'mt.proof.checks[*].command_or_method'], predicate: the_submission_receipt_and_the_submission_entry_record_non_empty_relevant_input_paths_for_proof_reuse_and_invalidation, fails_with: missing_required_proof, owner: controller, rule_ref: CODEX-VAL-007}
  exact_submission_and_validator_authority: {inputs: ['wp_state.stock_execution_state.verdicts[*].submission_id', 'wp_state.stock_execution_state.verdicts[*].submission_revision', 'wp_state.stock_execution_state.submissions[*].submission_id', 'wp_state.stock_execution_state.submissions[*].source_digest', receipt.mechanical.submission_ref, receipt.role_id, action.actor_id, workflow.roles.wp_validator], predicate: the_verdict_names_an_existing_submission_entry_at_its_revision_with_a_resolved_source_digest_its_receipt_names_the_same_submission_and_the_recording_actor_holds_wp_validator_authority, fails_with: wrong_actor, owner: controller}
  verdict_file_parses: {inputs: [receipt.semantic.verdict, 'wp_state.stock_execution_state.verdicts[mt_id==<mt_id>]'], predicate: verdict_payload_parses_against_the_verdict_record_shape, fails_with: schema_invalid, owner: controller}
  status_equals_verdict: {same_as: CHK-STATUS-EQUALS-VERDICT}
  validator_differs_from_claimer: {inputs: ['wp_state.stock_execution_state.verdicts[mt_id==<mt_id>].validator_actor_id', 'wp_state.microtasks[mt_id].lease.actor_id'], predicate: verdict_actor_is_not_the_claiming_actor, fails_with: wrong_actor, owner: controller}
  evidence_hash_matches_log: {inputs: [receipt.mechanical.evidence_hash, receipt.mechanical.log_ref], predicate: every_completed_verdict_receipt_names_a_log_ref_and_evidence_hash_and_the_recomputed_sha256_of_the_log_file_equals_the_recorded_hash, fails_with: evidence_mismatch, owner: controller, rule_ref: CODEX-VAL-005}
  pass_requires_every_required_check_result_line_equals_pass_in_hashed_log: {inputs: ['wp_state.stock_execution_state.verdicts[mt_id==<mt_id>].decision', mt.proof.required_checks, receipt.mechanical.log_ref], predicate: passed_decision_has_every_required_check_result_line_reading_pass_in_the_hashed_log, fails_with: evidence_mismatch, owner: controller}
  blocked_decision_requires_blocked_on_mt_ref: {inputs: ['wp_state.stock_execution_state.verdicts[mt_id==<mt_id>].decision', 'wp_state.stock_execution_state.verdicts[mt_id==<mt_id>].blocker.type', 'wp_state.stock_execution_state.verdicts[mt_id==<mt_id>].blocked_on_mt_ref', 'wp_state.microtasks[dep_id].phase'], predicate: blocked_decision_carries_blocker_type_and_type_dependency_names_an_open_mt_id_that_owns_the_causing_fix, fails_with: unresolved_dependency, owner: controller}
  approved_closure_revision: {inputs: [wp_state.stock_execution_state.integration_verdict.candidate_commit, wp_state.stock_execution_state.integration_verdict.decision], predicate: closure_revision_equals_the_candidate_with_a_recorded_passed_integration_verdict, fails_with: missing_required_proof, owner: controller}
  target_branch_containment: {inputs: [git.target_branch_head, git.merge_base, wp_state.stock_execution_state.integration_verdict.candidate_commit], predicate: target_branch_history_contains_the_approved_closure_revision, fails_with: unreconciled_git_state, owner: controller}
  required_durable_evidence_preserved: {inputs: [wp_state.workspace_settlement.required_evidence_refs, receipt.mechanical.preserved_paths], predicate: every_required_durable_evidence_ref_resolves_to_a_preserved_path, fails_with: unsettled_effects, owner: controller}
  wp_temporary_outputs_settled: {inputs: [wp_state.workspace_settlement.status, wp_state.workspace_settlement.cleanup_result, wp_state.activation.temporary_output_root], predicate: settlement_confirms_evidence_preserved_and_wp_temporary_cleanup_completed_or_not_applicable_for_unprovisioned_planning_work, fails_with: unsettled_effects, owner: controller}
  stray_git_refs_settled: {inputs: [receipt.mechanical.git_ref_inventory.before, receipt.mechanical.git_ref_inventory.after, git.worktree_list, git.branch_list], predicate: git_inventory_after_equals_inventory_before_or_every_stray_ref_is_recorded_and_removed, fails_with: unreconciled_git_state, owner: controller}
  registered_cancel_transition: {inputs: [wp_state.phase], predicate: registered_cancel_transition_exists_from_current_phase, fails_with: invalid_transition, owner: controller}
  claims_and_effects_settled: {inputs: ['wp_state.microtasks[*].claim_ref', wp_state.pending_recovery, receipt.mechanical.spawned_processes], predicate: no_live_claim_running_operation_or_unresolved_effect_remains_unrecorded, fails_with: unsettled_effects, owner: controller}
  registered_supersede_transition: {inputs: [wp_state.phase], predicate: registered_supersede_transition_exists_from_current_phase, fails_with: invalid_transition, owner: controller}
  replacement_identity: {inputs: [action.target_ids.replacement_wp_id, wp_state.wp_id], predicate: replacement_wp_or_version_resolves_and_differs_from_the_superseded_wp, fails_with: unknown_target, owner: controller}
  selected_workflow: {inputs: [workflow.workflow_id, workflow.status], predicate: project_has_one_selected_workflow_with_a_pinned_version, fails_with: unknown_target, owner: controller}
  actor_authorization: {inputs: [action.actor_id, action.session_id, workflow.roles, wp_state.lanes], predicate: actor_holds_a_recorded_role_permitted_to_submit_this_action_type, fails_with: unauthorized, owner: controller}
  allowed_dispatch_profile: {inputs: [action.semantic_payload.profile_id, workflow.dexterity.allowed_profiles, workflow.roles], predicate: requested_profile_id_is_registered_and_permitted_for_the_target_role, fails_with: unauthorized, owner: controller}
  resource_reservation: {inputs: [host_profile.devices, wp_state.reservations, workflow.resource_policy.max_concurrent_builds_per_physical_disk], predicate: aggregate_reservation_fits_within_declared_limits_and_the_target_device_is_not_busy, fails_with: resource_unavailable, owner: controller}
  applicable_workspace_binding: {inputs: [wp_state.activation.worktree_ref, wp_state.activation.temporary_output_root, mt.execution.allowed_write_paths], predicate: dispatched_role_receives_a_bound_worktree_and_write_scope_when_its_actions_require_them, fails_with: out_of_scope, owner: controller}
  integration_validator_authority: {inputs: [action.actor_id, workflow.roles.integration_validator, wp_state.lanes], predicate: actor_is_the_assigned_integration_validator_for_this_wp, fails_with: wrong_actor, owner: controller}
  exact_submission_generation: {inputs: [wp_state.stock_execution_state.integration_candidate.commit, action.target_ids.candidate_commit, action.expected_generation, wp_state.generation], predicate: verdict_names_the_exact_pinned_candidate_at_the_expected_generation, fails_with: stale_generation, owner: controller}
  independent_review: {inputs: [action.actor_id, 'wp_state.microtasks[*].lease.actor_id', receipt.mechanical.review_context_id], predicate: reviewing_actor_authored_no_submission_under_review_and_used_a_fresh_context, fails_with: wrong_actor, owner: controller}
  all_required_mt_passes_apply: {inputs: ['wp_contract.microtask_graph.nodes[*].mt_id', 'wp_state.stock_execution_state.verdicts[*].submission_revision', wp_state.stock_execution_state.integration_candidate.commit], predicate: every_required_mt_has_a_pass_verdict_applying_to_the_final_candidate, fails_with: missing_required_proof, owner: controller}
  current_candidate_and_spec: {inputs: [wp_state.stock_execution_state.integration_candidate.commit, git.remote_refs, wp_contract.authority_snapshot.specification.revision, refinement.spec_enrichment.sync.applied_revision], predicate: candidate_is_the_current_pushed_head_and_spec_pins_are_unchanged, fails_with: stale_generation, owner: controller}
  required_acceptance_coverage: {inputs: [wp_contract.acceptance_criteria, receipt.mechanical.log_ref, receipt.semantic.coverage_map], predicate: every_wp_acceptance_criterion_maps_to_a_passing_check_in_the_hashed_log, fails_with: missing_required_proof, owner: controller}
  integration_pass: {inputs: [wp_state.stock_execution_state.integration_verdict.decision, wp_state.stock_execution_state.integration_verdict.candidate_commit], predicate: recorded_integration_verdict_is_passed_for_the_merge_candidate, fails_with: missing_required_proof, owner: controller}
  expected_target_head: {inputs: [git.target_branch_head, wp_state.stock_execution_state.integration_verdict.target_head], predicate: live_target_branch_head_equals_the_reviewed_target_head, fails_with: stale_generation, owner: controller}
  preserved_work: {inputs: [git.worktree_list, git.status, 'wp_state.microtasks[*].claim_ref'], predicate: no_uncommitted_or_unrecorded_work_would_be_lost_by_the_merge, fails_with: unsettled_effects, owner: controller}
  actual_merge_result_and_target_containment: {inputs: [receipt.mechanical.merge_result, git.target_branch_head, git.merge_base], predicate: recorded_merge_result_and_live_target_history_both_contain_the_candidate, fails_with: unreconciled_git_state, owner: controller}
  operator_or_delegated_control_authority: {inputs: [action.actor_id, workflow.control_delegations], predicate: actor_is_the_operator_or_holds_a_recorded_control_delegation, fails_with: unauthorized, owner: controller}
  existing_workflow: {inputs: [workflow.workflow_id, workflow.run_id], predicate: target_workflow_run_resolves_to_a_recorded_run, fails_with: unknown_target, owner: controller}
  owned_process_tree_inspected_no_orphans: {inputs: [receipt.mechanical.spawned_processes, host_profile.observed_processes], predicate: every_process_launched_by_stopped_jobs_is_inspected_and_no_orphan_remains, fails_with: orphaned_process, owner: controller}
  reconciled_operations: {inputs: [wp_state.pending_recovery, receipt.mechanical.spawned_processes, wp_state.generation], predicate: current_effects_and_versions_are_reconciled_before_resume, fails_with: unsettled_effects, owner: controller}
  owned_operations_settled: {inputs: [receipt.mechanical.spawned_processes, wp_state.reservations, 'wp_state.microtasks[*].claim_ref'], predicate: every_owned_operation_is_settled_or_recorded_as_pending_recovery, fails_with: unsettled_effects, owner: controller}
  required_recovery_preserved: {inputs: [wp_state.pending_recovery, receipt.mechanical.preserved_paths], predicate: work_and_evidence_needed_for_recovery_are_preserved_before_cancellation, fails_with: unsettled_effects, owner: controller}
  policy_optimization_enabled: {inputs: [workflow.improvement.active_optimization], predicate: project_has_opted_into_active_policy_optimization, fails_with: unauthorized, owner: controller}
  reserved_policy_budget: {inputs: [workflow.improvement.policy_limits, wp_state.reservations], predicate: policy_work_fits_within_the_operator_reserved_allocation, fails_with: resource_unavailable, owner: controller}
  immutable_authority_boundaries: {inputs: [action.semantic_payload.policy, workflow.improvement.immutable_boundaries], predicate: candidate_policy_changes_none_of_the_immutable_boundaries, fails_with: out_of_scope, owner: controller}
  authorized_policy_trial: {inputs: [action.actor_id, 'workflow.improvement.replay_results[policy_id]'], predicate: actor_may_trial_policies_and_the_candidate_has_a_replay_screen_result, fails_with: unauthorized, owner: controller}
  held_out_history_comparison: {inputs: ['workflow.improvement.replay_results[policy_id].held_out_comparison'], predicate: candidate_has_a_recorded_held_out_history_comparison_against_the_current_policy, fails_with: missing_required_proof, owner: controller}
  policy_promotion_authority: {inputs: [action.actor_id, workflow.improvement.promotion_authority], predicate: actor_holds_recorded_policy_promotion_authority, fails_with: unauthorized, owner: controller}
  verified_live_trial: {inputs: ['workflow.improvement.trial_results[policy_id]', receipt.mechanical.evidence_hash], predicate: live_trial_outcomes_are_recorded_with_matching_evidence_hashes, fails_with: missing_required_proof, owner: controller}
  policy_rollback_authority: {inputs: [action.actor_id, workflow.improvement.promotion_authority], predicate: actor_holds_recorded_policy_rollback_authority, fails_with: unauthorized, owner: controller}
  prior_policy_identity: {inputs: [action.target_ids.policy_version, workflow.improvement.policy_versions], predicate: target_policy_version_resolves_to_a_prior_recorded_version, fails_with: unknown_target, owner: controller}
  CHK-WRITE-SCOPE-001: {inputs: [receipt.mechanical.changed_paths, receipt.actor_id, mt.execution.allowed_write_paths, mt.execution.forbidden_write_paths, 'wp_state.lanes[actor_id].allowed_writes', receipt.mechanical.infrastructure_fix, build_rulebook.project_profile.test_entrypoint.config_files, build_rulebook.project_profile.test_environment], predicate: "each changed_path: (infrastructure_fix && path in test_entrypoint.config_files | test_environment) || (path in allowed_write_paths && path not in forbidden_write_paths && (lanes[actor_id].allowed_writes absent || path in lanes[actor_id].allowed_writes))", fails_with: out_of_scope, owner: controller, rule_ref: CODEX-STEER-007}
