  CHK-TEST-ENTRYPOINT-001: {inputs: [receipt.mechanical.commands_run, receipt.mechanical.test_run, build_rulebook.project_profile.test_entrypoint.command], predicate: every_command_of_a_validation_round_is_the_declared_checked_in_test_entrypoint_without_added_env_vars_or_wrappers, fails_with: missing_required_proof, owner: controller, rule_ref: BR-TEST-ENTRY-001}
  CHK-REPEATED-INFRA-001: {inputs: ['receipt.mechanical.test_run.failures[*].failure_class', 'receipt.mechanical.test_run.failures[*].failure_kind', receipt.mechanical.changed_paths, build_rulebook.project_profile.test_entrypoint, build_rulebook.project_profile.test_environment, workflow.steering.run_accounting.repeated_infrastructure_cause.occurrences_limit], predicate: "infrastructure failure_class count >= occurrences_limit -> next round requires intervening fix to the declared entrypoint, its config or declared test environment; failure alone does not require a gameplan step", fails_with: unresolved_dependency, owner: controller, rule_ref: CODEX-STEER-007}
  CHK-GAMEPLAN-SHAPE-001: {inputs: [action.semantic_payload.step, 'gameplan.steps[*]', gameplan.parent, gameplan.refs, gameplan.decisions], predicate: "step ids unique, never reused across parent chain; do, source, decisions[].text one line <= 120 chars; source present; decisions <= 5; refs resolve; no absolute machine path; cmd checks non-mutating", fails_with: invalid_model_detailing_fields, owner: controller, rule_ref: CODEX-GAMEPLAN-001}
  CHK-GAMEPLAN-GATE-001: {inputs: ['gameplan.steps[*]', 'mt_gameplans[target_mt_ids].steps[*]', gameplan.expensive_actions, workflow.gameplan.gate_moments, action.actor_id, action.action_type, receipt.semantic.gameplan_confirmations], predicate: every_active_applicable_preparation_step_for_the_actor_and_moment_passes_or_reuses_a_valid_confirmation_under_unchanged_relevant_inputs_and_before_round_is_evaluated_after_canary_acquisition, fails_with: gameplan_gate_failed, owner: controller, rule_ref: CODEX-GAMEPLAN-001}
  gameplan_retirement_authority: {inputs: [action.actor_id, workflow.roles, action.semantic_payload.step_id, action.semantic_payload.reason], predicate: actor_holds_orchestrator_builder_or_operator_authority_and_reason_names_the_replacing_step_or_the_cause_that_no_longer_applies, fails_with: unauthorized, owner: controller, rule_ref: CODEX-GAMEPLAN-001}
  CHK-REMEDIATION-SHAPE-001: {inputs: ['wp_state.stock_execution_state.verdicts[mt_id==<mt_id>].decision', 'wp_state.stock_execution_state.verdicts[mt_id==<mt_id>].remediation', wp_state.stock_execution_state.remediation_fields, mt.closure_unit.acceptance_refs, receipt.limits.remediation_text_max_chars], predicate: "decision == failed -> remediation typed; every remediation_field non-empty; failed_acceptance_refs in mt acceptance_refs; expected, observed, repair_direction one line <= remediation_text_max_chars", fails_with: invalid_model_detailing_fields, owner: controller, rule_ref: CODEX-REMEDIATE-001}
  CHK-DIAGNOSIS-SHAPE-001: {inputs: [action.semantic_payload.diagnosis, 'wp_state.stock_execution_state.diagnoses[*]', 'wp_state.microtasks[mt_id].diagnosis_refs'], predicate: "diagnosis has diagnosis_id, mt_id, evidence_refs, cause one line <= text limit, distinct_from == every earlier mt diagnosis id; diagnosis_refs == mt diagnosis ids in recording order", fails_with: missing_diagnosis, owner: controller, rule_ref: CODEX-STEER-008}
  CHK-DISTINCT-RESUBMISSION-001: {inputs: ['wp_state.stock_execution_state.submissions[*]', 'wp_state.stock_execution_state.verdicts[*].decision', 'wp_state.stock_execution_state.verdicts[*].remediation.affected_code_refs', receipt.mechanical.submission_ref, receipt.mechanical.changed_paths, 'wp_state.microtasks[mt_id].diagnosis_refs'], predicate: "submission after failed verdict -> changed_paths & remediation.affected_code_refs != empty || relevant_input_digest changed || diagnosis_ref cited by no earlier submission", fails_with: missing_diagnosis, owner: controller, rule_ref: CODEX-REMEDIATE-001}
  CHK-PROOF-INVALIDATED-001: {inputs: [action.target_ids.candidate_commit, git.diff_paths, 'wp_state.microtasks[*].phase', 'wp_state.microtasks[*].invalidated_by_commit', 'wp_state.stock_execution_state.submissions[*].relevant_input_paths', 'mt.proof.relevant_input_paths'], predicate: "at round freeze: passed mt && relevant_input_paths & candidate diff != empty -> listed for re-validation, phase ready_for_validation, invalidated_by_commit == candidate", fails_with: stale_generation, owner: controller, rule_ref: CODEX-VAL-007}
  CHK-VERDICT-FAILURE-KIND-001: {inputs: ['wp_state.stock_execution_state.verdicts[mt_id==<mt_id>].decision', 'receipt.mechanical.test_run.failures[*].mt_id', 'receipt.mechanical.test_run.failures[*].failure_kind'], predicate: "decision == failed -> round test_run has >= 1 failure with mt_id == mt && failure_kind == product; infrastructure|flaky only -> infrastructure entry, no verdict, mt phase unchanged", fails_with: evidence_mismatch, owner: controller, rule_ref: CODEX-VAL-004}
  CHK-RESULTS-FRESH-001: {inputs: [receipt.mechanical.validation_batch_ref, receipt.mechanical.test_run.candidate_commit, receipt.mechanical.test_run.started_at, receipt.mechanical.test_run.completed_at, 'wp_state.stock_execution_state.validation_batches[batch_id==<receipt.mechanical.validation_batch_ref>].candidate_commit', 'wp_state.stock_execution_state.validation_batches[batch_id==<receipt.mechanical.validation_batch_ref>].started_at'], predicate: "(test_run.candidate_commit == batch.candidate_commit && batch.started_at <= test_run.started_at <= test_run.completed_at) || reused proof under CODEX-VAL-007 naming proof_commit_ref + batch_commit_ref; else stale -> infrastructure, no verdict", fails_with: evidence_mismatch, owner: controller, rule_ref: CODEX-VAL-006}
  CHK-FIX-BUDGET-001: {inputs: ['wp_state.stock_execution_state.verdicts[mt_id==<mt_id>].decision', 'wp_state.blockers[type==fix_budget_exhausted]', 'wp_state.microtasks[mt_id].claim_ref', 'wp_state.microtasks[mt_id].phase', workflow.steering.max_fix_rounds_per_unit], predicate: "failed verdicts on mt (any cause) < max_fix_rounds_per_unit || (blockers[type==fix_budget_exhausted && mt_id==<mt_id>] recorded && (its operator_decision_refs non-empty || mt unclaimed: claim_ref null && phase not in [in_progress, ready_for_validation, validating, passed]))", fails_with: unresolved_dependency, owner: controller, rule_ref: CODEX-STEER-007} # HT-WORK-CODING-001.steering.run_accounting.counter_precedence

check_registry_policy:
  rule_ref: CODEX-LAYER-001
  every_admission_and_commit_check_name_must_resolve_here: true
  every_role_check_ref_must_resolve_here: true
  unresolved_check_is_a_tracked_controller_defect: true
  implemented_today_by: skill/scripts/validate_artifacts.py
  implemented_check_ids: [CHK-STATUS-EQUALS-VERDICT, CHK-PARENT-DIGEST, CHK-STATE-CONTRACT, CHK-INDEPENDENT-VERDICT-001, CHK-HALF-WRITTEN-VERDICT, CHK-FINAL-STATUS-001, CHK-WRITE-SCOPE-001, CHK-ZERO-TEST-RUN, CHK-NEW-APPROACH-001, CHK-TEST-ENTRYPOINT-001, CHK-REPEATED-INFRA-001, CHK-MODULE-BUILD-UNIT-001, CHK-MODULE-LIFECYCLE-001, CHK-GAMEPLAN-SHAPE-001,
    implementation_gates, relevant_input_paths_recorded, exact_submission_and_validator_authority, evidence_hash_matches_log, CHK-REMEDIATION-SHAPE-001, CHK-DIAGNOSIS-SHAPE-001, CHK-DISTINCT-RESUBMISSION-001, CHK-PROOF-INVALIDATED-001, CHK-VERDICT-FAILURE-KIND-001, CHK-RESULTS-FRESH-001, CHK-FIX-BUDGET-001]
  array_match_notation: "list[field==<value>] selects the entries of an array whose field equals value; verdicts[mt_id==<mt_id>] resolves mt_id through the verdict's submission_id in stock_execution_state.submissions" # verdicts, validation_batches and blockers are arrays; microtasks and lanes are keyed
  alias_policy: an_entry_holding_only_same_as_is_an_alias_of_its_target_and_carries_no_definition_of_its_own # status_equals_verdict, no_parallel_capability_implementation, mt_write_scope_within_module
  retired_policy: a_retired_check_keeps_its_id_names_its_successor_and_is_selected_by_no_action # CHK-RETRY-DIAGNOSIS-001
  conditional_commit_check_keys: [pass_only_checks, checks_for_fail_or_inconclusive] # decision-selected commit checks; a check listed there is wired

intent_routes:
  rule_id: ACTION-SCOPE-ROUTE-001
  scope_change: [submit_contract_detailing, rebase_wp, request_activation]
  new_work: [create_wp_stub, submit_contract_detailing, request_activation]
  idea_to_spec: [create_wp_stub, submit_contract_detailing, request_activation]
  scope_change_stages_proposal_without_widening_active_contract: true
  accepted_product_meaning_changes_require_spec_enrichment: true
  new_obligations_release_only_after_renewed_activation: true
  spec_is_sole_truth: research_prototypes_and_refinement_findings_enter_truth_only_through_spec_enrichment_before_activation

actions:
  create_wp_stub:
    action_class: create_wp_stub
    effect: 'Create a non-executable planning stub: record scope and research references, extract relevant spec, perform available refinement/enrichment,
      assess candidate matrix/SDK impacts and stage proposed WP/MT detailing. Do not create a WP worktree or bind enforcement or release executable work.'
    requires_active_wp: false
    requires_claimed_mt: false
    allowed_wp_phases: [absent]
    admission_checks: [planning_input_consistency]
    commit_checks: [spec_enrichment_disposition_recorded, mandatory_pillar_rows_present, CHK-PROPOSAL-NO-BINDING-001]
  upsert_build_matrix_entry:
    action_class: project_configuration
    effect: Allocate or preserve the entry ID, validate operator intent and source/selector references, apply accepted product-meaning
      changes through spec enrichment, update the existing rulebook matrix revision, and enqueue reassessment of open work in one recoverable
      generation-checked transaction.
    requires_active_wp: false
    requires_claimed_mt: false
    admission_checks: [authorized_matrix_proposal, selector_integrity]
    commit_checks: [accepted_spec_delta_and_selector_integrity]
  retire_build_matrix_entry:
    action_class: project_configuration
    effect: Retire the identified matrix entry without deleting lineage or historical obligations; reassess open work and preserve completed
      snapshots.
    requires_active_wp: false
    requires_claimed_mt: false
    admission_checks: [matrix_identity_and_retained_history]
  submit_contract_detailing:
    action_class: project_configuration
    effect: Validate semantic detailing and stage non-executable candidate structure and references. Return field diagnostics for invalid
      input. Binding enforcement, releasing MTs and widening scope require the separate scoped activation transaction after refinement/enrichment.
    requires_active_wp: false
    requires_existing_wp_identity: true
    requires_claimed_mt: false
    admission_checks: [existing_wp_identity, typed_proposal_only]
    commit_checks: [CHK-PROPOSAL-NO-BINDING-001]
  set_priority:
    action_class: project_configuration
    effect: Update priority authority and controller-owned sequence.
    requires_active_wp: false
    requires_claimed_mt: false
    requires_existing_wp_identity: true
    allowed_wp_phases: [stub_drafting, planning_transaction, planned, activating, active, validating, merge_pending]
    admission_checks: [existing_wp_identity, nonterminal_phase]
  request_activation:
    action_class: project_configuration
    effect: Complete refinement/enrichment and spec synchronization, assess the current matrix against the accepted WP outcome and affected
      existing behavior, then bind selected stable spec/rule/matrix IDs and SDK contracts into validated executable WP/MT contracts.
      Record excluded future scope; surface unavailable necessary dependencies; never silently add future features. Release work only
      after this activation commits. Only after completed refinement/enrichment and validated spec synchronization, create or verify
      the WP-specific worktree using repository_structure.worktree_policy, resolve repository_structure.temporary_output_policy from
      the canonical main root, and pin the verified bindings in WP activation and state before executable MT release. An interrupted
      activation retains the same owned workspace identity and remains non-executable until recovery completes.
    requires_active_wp: false
    requires_claimed_mt: false
    requires_existing_wp_identity: true
    admission_checks: [existing_wp_identity, activation_transition, CHK-FIRST-OUTPUT-001]
    commit_checks: [completed_refinement_enrichment, validated_spec_sync, scope_relevant_matrix_sdk_freshness, dependency_readiness, governed_worktree_ready, wp_temporary_output_binding_ready, build_unit_boundary, CHK-MODULE-BUILD-UNIT-001, CHK-MODULE-LIFECYCLE-001, build_budget_review_settled, CHK-MT-WRITE-SCOPE-MODULE-001, capability_owners_resolve, gui_lane_coverage, spec_carries_wp_requirements, matrix_universe_coverage, rule_contract_fields_present, module_lifecycle_binding, mandatory_pillar_rows_present]
  rebase_wp:
    action_class: project_configuration
    effect: Assess relevant changed spec/rule/matrix/SDK/dependency inputs or a proposed scope change and stage an accepted bounded revision through refinement/enrichment.
      Changed obligations require renewed WP activation; rebase alone cannot release new enforcement or expand scope.
    requires_active_wp: false
    requires_claimed_mt: false
    requires_existing_wp_identity: true
    allowed_wp_phases: [stub_drafting, planning_transaction, planned, activating, active, validating, merge_pending]
    admission_checks: [existing_wp_identity, registered_rebase_transition]
    commit_checks: [bounded_staged_revision, build_unit_boundary, CHK-MODULE-BUILD-UNIT-001, CHK-MODULE-LIFECYCLE-001, build_budget_review_settled, matrix_universe_coverage, rule_contract_fields_present]
  bind_solution:
    action_class: wp_execution
    effect: Add or change an exact project binding to a reusable solution with stable ID, version, digest, relationship, and topology
      targets.
    requires_active_wp: true
    requires_claimed_mt: false
    admission_checks: [active_binding, solution_impact_authorization]
  fork_solution:
    action_class: wp_execution
    effect: Create explicit project lineage from a pinned reusable solution before divergent implementation proceeds.
    requires_active_wp: true
    requires_claimed_mt: false
    admission_checks: [active_binding, solution_impact_authorization]
  propose_solution_promotion:
    action_class: wp_execution
    effect: Materialize an on-demand reusable-solution candidate from proven project work without publishing it automatically.
    requires_active_wp: true
    requires_claimed_mt: false
    admission_checks: [active_binding, proven_candidate]
  upgrade_solution_binding:
    action_class: wp_execution
    effect: Explicitly migrate a project binding to a newer pinned solution version after impact and proof checks.
    requires_active_wp: true
    requires_claimed_mt: false
    admission_checks: [active_binding, solution_impact_authorization]
  claim_mt:
    action_class: wp_execution
    effect: Create a bounded lease only for an MT assigned to the committed activated parent contract, after dependency and conflict
      checks.
    requires_active_wp: true
    requires_claimed_mt: false
    creates_claim_instead_of_requiring_existing_claim: true
    admission_checks: [active_binding, current_scope_inputs, module_source_first_adoption, dependency_verdicts, conflict_free_write_scope, claim_transition, CHK-MT-WRITE-SCOPE-MODULE-001, CHK-NEW-APPROACH-001, CHK-FIX-BUDGET-001, CHK-REMEDIATION-DISPATCH-001] # CHK-REMEDIATION-DISPATCH-001 applies when the MT phase is needs_remediation: the claim payload names the recorded failed verdict id
  submit_receipt:
    action_class: wp_execution
    effect: Validate and append tool-collected mechanical evidence plus model-supplied semantic observations for an attempt.
    requires_active_wp: true
    requires_claimed_mt: false
    stale_attempt_observations_may_append_without_advancing_current_execution: true
    admission_checks: [action_scoped_evidence_identity, observation_not_authority_mutation]
  release_claim:
    action_class: wp_execution
    effect: End a claim in a valid recoverable state.
    requires_active_wp: true
    requires_claimed_mt: true
    admission_checks: [owned_unexpired_lease, recoverable_release_state]
  record_blocker:
    action_class: project_configuration
    roles: [orchestrator, activation_manager, coder, builder, wp_validator, integration_validator]
    effect: Add a typed blocker with evidence and recovery ownership, or a typed diagnosis {diagnosis_id, cause, evidence_refs, distinct_from} for one MT. This action is the only writer
      of wp_state.stock_execution_state.diagnoses and of microtasks[mt_id].diagnosis_refs, which lists that MT's diagnosis ids in recording order; a diagnosis does not require a gameplan step (CODEX-STEER-008).
    requires_active_wp: false
    requires_claimed_mt: false
    requires_existing_wp_identity: true
    allowed_wp_phases: [stub_drafting, planning_transaction, planned, activating, active, validating, merge_pending]
    admission_checks: [existing_wp_identity, typed_observation, CHK-DIAGNOSIS-SHAPE-001]
  request_validation:
    action_class: wp_execution
    effect: Enter closure validation after implementation gates pass. The submission names a pushed commit; uncommitted work is not a submission.
    requires_active_wp: true
    requires_claimed_mt: false
    admission_checks: [active_binding, implementation_gates, pushed_commit_ref, relevant_input_paths_recorded, CHK-DISTINCT-RESUBMISSION-001, CHK-NO-PARALLEL-CAPABILITY-001, CHK-NEW-APPROACH-001, CHK-REPEATED-INFRA-001, CHK-GAMEPLAN-GATE-001]
  start_validation_round:
    action_class: wp_execution
    roles: [wp_validator]
    effect: Freeze the pushed candidate commit (later pushes queue), emit proof_invalidated for affected passed MTs, enqueue them and select a bounded ready set.
      Run the existing canary through the test entrypoint before evaluating before_round; its acquisition does not require a prior canary result.
      After the canary and before_round pass, open validation_batches entry {batch_id, round_kind, candidate_commit, started_at, mt_ids} and emit validator_assigned for the selected set.
      Canary failure records infrastructure and opens no round. round_kind in HT-WORK-CODING-001.validation.round_kinds.
      Pending invalidated MTs remain queued until later bounded rounds; integration requires their current proof.
    requires_active_wp: true
    requires_claimed_mt: false
    allowed_wp_phases: [active, validating]
    gate_moment: before_round
    admission_checks: [active_binding, canary_check_declared, resource_reservation, CHK-REPEATED-INFRA-001] # resource_reservation rejection -> controller event managed_resource_unavailable
    commit_checks: [CHK-GAMEPLAN-GATE-001, CHK-PROOF-INVALIDATED-001, CHK-TEST-ENTRYPOINT-001] # before_round after canary acquisition, before the full run
  record_validation_verdict:
    action_class: wp_execution
    effect: Record validator evidence for one exact MT submission and set the MT phase from the decision. Verdicts are recorded per MT as soon as
      the shared batch run finishes, never held until the batch completes. Merge requires a WP-scope verdict (round_kinds.wp_boundary), every
      required MT passed and a passed integration verdict; an MT verdict alone never authorizes merge or marks a roadmap item implemented.
    requires_active_wp: true
    requires_claimed_mt: false
    admission_checks: [active_binding, exact_submission_and_validator_authority, canary_check_declared, CHK-TEST-ENTRYPOINT-001, CHK-REPEATED-INFRA-001, CHK-GAMEPLAN-GATE-001] # before_verdict; before_round gated by start_validation_round
    commit_checks: [verdict_file_parses, CHK-STATUS-EQUALS-VERDICT, validator_differs_from_claimer, evidence_hash_matches_log, pass_requires_every_required_check_result_line_equals_pass_in_hashed_log, blocked_decision_requires_blocked_on_mt_ref, CHK-REMEDIATION-SHAPE-001, CHK-VERDICT-FAILURE-KIND-001, CHK-RESULTS-FRESH-001]
    pass_only_checks: [CHK-REAL-BOUNDARY-PROOF-001]
    decision_values: [passed, failed, inconclusive, blocked] # blocked requires blocker.type; dependency -> blocked_on_mt_ref + MT blocked_on_dependency
    verdict_record: wp_state.stock_execution_state.verdicts_plus_receipt_event
    recording_order_ref: CODEX-VAL-008
  confirm_merge_containment:
    action_class: wp_execution
    effect: Prove the approved closure revision is contained in the target branch. After verified completion of the declared implementation
      scope, synchronize the in-spec roadmap and ongoing build-rule/matrix coverage; preserve partial scope and expose pending sync
      after interruption. Preserve required durable proof, then clean only this WP temporary outputs through the
      repository temporary-output policy; keep terminal settlement pending while cleanup is blocked, without changing the product verdict.
    requires_active_wp: true
    requires_claimed_mt: false
    admission_checks: [active_binding, approved_closure_revision, target_branch_containment]
    commit_checks: [required_durable_evidence_preserved, wp_temporary_outputs_settled, stray_git_refs_settled]
  cancel_wp:
    action_class: project_configuration
    effect: Request scoped cancellation using the existing cancellation/recovery protocol. A running operation remains nonterminal until required cleanup, claim disposition and unresolved effects are settled; record pending recovery truthfully. Cancellation does not retract accepted specification truth.
    requires_active_wp: false
    requires_claimed_mt: false
    requires_existing_wp_identity: true
    allowed_wp_phases: [stub_drafting, planning_transaction, planned, activating, active, validating, merge_pending]
    admission_checks: [existing_wp_identity, registered_cancel_transition]
    commit_checks: [required_durable_evidence_preserved, wp_temporary_outputs_settled, claims_and_effects_settled]
  supersede_wp:
    action_class: project_configuration
    effect: Link a replacement WP or version; settle running claims, required cleanup and unresolved effects before terminal supersession and archival. Preserve historical contracts and evidence.
    requires_active_wp: false
    requires_claimed_mt: false
    requires_existing_wp_identity: true
    allowed_wp_phases: [stub_drafting, planning_transaction, planned, activating, active, validating, merge_pending]
    admission_checks: [existing_wp_identity, registered_supersede_transition, replacement_identity]
    commit_checks: [required_durable_evidence_preserved, wp_temporary_outputs_settled, claims_and_effects_settled]
  propose_gameplan_step:
    action_class: project_configuration
    effect: Correct the preparation projection of an existing applicable obligation, replacing duplicate or faulty steps and retiring obsolete steps.
      A missing step may project that obligation but cannot add acceptance or proof requirements. Failures and diagnoses alone do not require a step.
      The model supplies role, at, do, check, source and optional replaces_step_id; the controller uses the existing file and receipt path.
    requires_active_wp: false
    requires_claimed_mt: false
    requires_existing_wp_identity: true
    allowed_wp_phases: [activating, active, validating, merge_pending]
    admission_checks: [existing_wp_identity, nonterminal_phase, actor_authorization, CHK-GAMEPLAN-SHAPE-001]
  retire_gameplan_step:
    action_class: project_configuration
    effect: Mark one step retired with a reason in the receipt; the step stays in the file and its id is never reused.
    requires_active_wp: false
    requires_claimed_mt: false
    requires_existing_wp_identity: true
    allowed_wp_phases: [activating, active, validating, merge_pending]
    admission_checks: [existing_wp_identity, nonterminal_phase, actor_authorization, gameplan_retirement_authority]


  dispatch_role:
    action_class: project_configuration
    roles: [orchestrator, builder] # builder requires the existing explicit project selection
    effect: Reserve aggregate resources and launch a pinned permitted role/profile through Dexterity with scoped capabilities.
    admission_checks: [selected_workflow, actor_authorization, allowed_dispatch_profile, resource_reservation, applicable_workspace_binding, CHK-BUILDER-SELECTION-001, CHK-GAMEPLAN-GATE-001] # CHK-BUILDER-SELECTION-001 applies when the dispatched role is builder
  record_integration_verdict:
    action_class: wp_execution
    effect: Settle the independent whole-product verdict for the exact merge candidate; failed routes actionable remediation, passed permits merge_pending only,
      blocked retains the candidate with its blocker.
    admission_checks: [active_binding, integration_validator_authority, exact_submission_generation, independent_review, CHK-FINAL-VERDICT-AUTHORITY-001]
    commit_checks: [actor_authorization, exact_submission_generation, independent_review]
    checks_for_fail_or_inconclusive: [actor_authorization, exact_submission_generation]
    pass_only_checks: [all_required_mt_passes_apply, current_candidate_and_spec, required_acceptance_coverage, CHK-REAL-BOUNDARY-PROOF-001]
    decision_values: [passed, failed, inconclusive, blocked]
  merge_wp:
    action_class: wp_execution
    effect: Controller performs the Integration Validator-authorized merge for the reviewed candidate and expected target head, then records actual containment.
    admission_checks: [integration_validator_authority, integration_pass, expected_target_head, preserved_work, CHK-GAMEPLAN-GATE-001]
    commit_checks: [actual_merge_result_and_target_containment]
    unknown_result: reconcile_git_refs_before_retry_never_repeat_blindly
  pause_workflow:
    action_class: project_configuration
    effect: Stop new dispatch, request owned-job suspension only where supported, retain work and distinguish requested pause from observed job state.
    admission_checks: [operator_or_delegated_control_authority, existing_workflow]
    commit_checks: [owned_process_tree_inspected_no_orphans]
  resume_workflow:
    action_class: project_configuration
    effect: Reconcile current effects and versions before resuming within authorized resource limits.
    admission_checks: [operator_or_delegated_control_authority, existing_workflow, reconciled_operations, CHK-GAMEPLAN-GATE-001]
  cancel_workflow:
    action_class: project_configuration
    effect: Stop dispatch and cancel only authorized owned operations; preserve work/evidence and settle WP cancellation without treating requests as termination.
    admission_checks: [operator_or_delegated_control_authority, existing_workflow]
    commit_checks: [owned_operations_settled, required_recovery_preserved, owned_process_tree_inspected_no_orphans]
  propose_workflow_policy:
    action_class: project_configuration
    effect: Store a bounded candidate policy separately from active authority for replay evaluation.
    admission_checks: [policy_optimization_enabled, reserved_policy_budget, immutable_authority_boundaries]
  trial_workflow_policy:
    action_class: project_configuration
    effect: Trial a replay-screened policy under explicit live resource limits with current-policy comparison.
    admission_checks: [authorized_policy_trial, held_out_history_comparison, reserved_policy_budget]
  promote_workflow_policy:
    action_class: project_configuration
    effect: Pin a policy for future eligible dispatch only after verified live outcomes and unchanged protected authority.
    admission_checks: [policy_promotion_authority, verified_live_trial, immutable_authority_boundaries]
  rollback_workflow_policy:
    action_class: project_configuration
    effect: Restore a prior policy version for future dispatch, preserve existing operation identity and completed work.
    admission_checks: [policy_rollback_authority, prior_policy_identity]

rejection_policy:
  applicability: evaluate_only_checks_selected_for_the_action_and_its_registered_transition
  reject_without_partial_state_change:
  - unauthorized
  - stale_generation
  - invalid_transition
  - wrong_actor
  - expired_lease
  - schema_invalid
  - out_of_scope
  - unresolved_solution_binding
  - unvalidated_spec_enrichment
  - incomplete_or_unresolved_scope_relevant_matrix_coverage
  - stale_matrix_or_sdk_contract_inputs
  - invalid_model_detailing_fields
  - unknown_target
  - missing_required_proof
  - evidence_mismatch
  - unresolved_dependency
  - unsettled_effects
  - unreconciled_git_state
  - resource_unavailable
  - orphaned_process
  - missing_diagnosis
  - gameplan_gate_failed

managed_stock_admission:
  rule_id: ACTION-STOCK-001
  workflow_ref: HT-WORK-CODING-001
  applies_only_when_selected: true
  transition_registry: HT-WORK-CODING-001.lifecycle
  roles: selected_workflow.roles
  registered_request_validation_target: exact_mt_submission
  registered_validation_verdict_role: wp_validator
  request_validation_override: compile_immutable_mt_submission_then_enter_ready_for_validation_not_whole_wp_closure
  record_validation_verdict_override: settle_exact_mt_revision_only_never_authorize_merge_without_integration_verdict
  integration_verdict_commit_checks: pass_only_checks_apply_only_to_passed_failed_inconclusive_and_blocked_remain_recordable
  integration_verdict_role: integration_validator
  no_requirement_for_claim_on_project_or_planning_actions: true
  consumer_fork_solution: rejected_under_selected_canonical_profile
  model_input_fields: [action_type, returned_target_handles, semantic_payload, supplied_evidence_handles]
  client_adapter_derives: [action_id, idempotency_key, actor_id, session_id, expected_generation, target_ids]
  controller_derives: [new_entity_ids, revisions, hashes, timestamps, paths, state_transitions, receipts]
  target_generation: retained_from_context_and_rejected_if_stale_never_silently_rebased
  semantic_payload: meaning_findings_or_verdict_not_full_controller_file
  observation_fields: collector_owned_model_claims_are_unverified_until_observed
  role_activities_that_do_not_mutate_state: queries_or_proposals_not_new_authority
  commit: explicit_paths_only_for_every_commit # CODEX-GIT-003
  destructive_git_actions_require_approved_explicit_action_list: true # CODEX-GIT-002
  validation_queue_max_mts_ref: HT-WORK-CODING-001.validation.validation_queue_max_mts
  remediation_actions: [claim_mt, request_validation] # CODEX-REMEDIATE-001; no refinement, rebase or activation action is triggered by a recorded failure
  claim_from_needs_remediation_names: recorded_failed_verdict_id # CHK-REMEDIATION-DISPATCH-001
  round_freeze_reassessment: CHK-PROOF-INVALIDATED-001 # HT-WORK-CODING-001.validation.round_freeze_reassessment; a passed MT whose relevant_input_paths the candidate diff touches re-enters ready_for_validation
  environment_fix: {roles: [builder, orchestrator], write_scope: fix_environment, receipt_flag: receipt.mechanical.infrastructure_fix} # CODEX-STEER-007; CHK-WRITE-SCOPE-001 accepts test_entrypoint.config_files and the build-rules test_environment for that receipt
  dispatch_role_brief_must_state: [produced_commit_or_verdict, deadline, required_output_interval] # CODEX-OUT-004, CODEX-STEER-002
