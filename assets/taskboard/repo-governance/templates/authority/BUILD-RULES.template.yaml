enforcement:
  hydration: Assess candidates during planning; bind deduplicated in-scope WP obligations and acceptance links only after completed
    refinement/enrichment and spec synchronization during WP activation. Active bound requirements and proof define closure. A rule
    does not imply a unique test or proof artifact; evidence labels name scope-selected methods, not mandatory new per-MT suites.
    Reuse valid existing proof. Only an explicitly authorized scope change may bind additional required claims; a new blocking finding
    must demonstrate a violation of a named existing bound requirement or acceptance claim, or that authorized scope change.
  applicability_verdicts: [required, not_applicable]
  obligation_verdicts: [pending, proved, blocked, waived]
  not_applicable_requires_reason: true
  waiver_requires_exception_record: true
  wp_scope_selects_relevant_obligations_not_rule_overrides: true
  rule_deviation_requires_valid_scoped_exception: true
  closure_forbidden_verdicts: [pending, blocked]
  proof_policy:
    minimum_sufficient_proof: true
    proof_effort_scales_with_risk_uncertainty_blast_radius_persistence_and_failure_cost: true
    one_proof_may_satisfy_multiple_obligations: true
    duplicate_proof_for_rule_count_forbidden: true
    additional_reviews_tests_checks_or_validation_require_explicit_operator_instruction: true
    meta_tests_require_explicit_operator_instruction_for_that_test_work: true
    reuse_valid_proof_when_relevant_inputs_are_unchanged: true
    risk_tiers: [P0, P1, P2, P3]
  impact_policy:
    assess_all_registered_surfaces: true
    create_obligations_only_for_semantically_affected_surfaces: true
    unaffected_surfaces_must_not_generate_synthetic_work: true
    mechanically_infer_then_review_exceptions: true
  work_type_scope:
    rule_ref: BR-REMEDIATE-001
    codex_refs: [CODEX-SCOPE-001, CODEX-REMEDIATE-001]
    heavy_obligations_declare_work_types: true
    heavy_obligations: [research, refinement, red_team, pushback, risk_or_roi_listing]
    default_work_types: [planning, new_feature, activation, scope_change]
    remediation_triggers_heavy_obligations: false
  proof_must_pin: [rulebook_version, rulebook_digest, rule_ids, obligation_ids, source_revision, command_or_method, observed_result,
    evidence_refs]
  on_rule_change:
    open_affected_wp_condition: ReassessmentRequired_then_scoped_refinement_and_renewed_activation_only_if_obligations_change
    completed_wp_policy: retain_historical_snapshot
    silent_rewrite_forbidden: true
  contract_field_propagation:
    rule_ref: BR-CONTRACT-SYNC-001
    rule_record_optional_field: contract_fields # {wp: [dotted WP contract paths], mt: [dotted MT contract paths]}
    rulebook_revision_with_changed_contract_fields: regenerates_wp_and_mt_templates_and_marks_open_work_for_reassessment
    templates_are_generated_from_rulebook_contract_fields_plus_stock_shape: true
    activation_refuses_when_a_required_contract_field_is_missing: true
    check_ref: rule_contract_fields_present


