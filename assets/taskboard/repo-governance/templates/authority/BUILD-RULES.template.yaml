build_matrix:
  matrix_id: BM-PROJECT-001
  revision: 3
  owner: effective_build_rulebook
  controller: handshake
  rule_refs: [BR-MATRIX-001, BR-MATRIX-002, BR-MATRIX-003]
  purpose: Assess cross-feature impacts during planning; bind stable IDs to only the activated WP scope and its assigned MTs after refinement/enrichment.
  entry_contract:
    required_fields: [entry_id, revision, status, title, rule_refs, requirement_refs, selector]
    optional_fields: [operator_request_verbatim, rationale, semantic_entity_refs, module_refs, solution_binding_refs, legacy_impact_key,
      supersedes, roadmap_item_refs, implementation_baseline_requirement_refs, contract_fields]
    statuses: [active, retired]
    id_allocator: handshake_registry
    selector_kinds: [always, rule_applicability, registered_semantic_query]
    selector_refs_must_resolve: true
    free_text_is_not_executable_selector: true
    rule_applicability_requires_registered_predicate_or_validated_semantic_detail: true
    new_product_meaning_requires_spec_enrichment: true
    rule_applicability_resolution: Assess every referenced rule; select any applicable obligations; unresolved referenced applicability
      keeps the row unresolved; not_applicable requires all referenced rules to be proven inapplicable.
  pillars:
    rule_ref: BR-PILLAR-001
    definition: A pillar is a mandatory matrix entry that every WP assesses and whose rules declare contract_fields, so the concern
      is designed in from the first WP and never an afterthought.
    mandatory_entry_ids: [BM-BASE-RUNTIME-CONCURRENCY-001, BM-BASE-GUI-UX-001, BM-BASE-AGENT-VISUAL-INTERFACE-001, BM-BASE-GUI-DESIGN-001,
      BM-BASE-ACCOUNTS-AND-SUBPROFILES-001, BM-BASE-COMPARTMENTALISATION-001, BM-BASE-COMPONENT-MECHANICS-001, BM-BASE-INTERNAL-MANUAL-001,
      BM-BASE-INTERNAL-DIAGNOSTICS-001, BM-BASE-FLIGHT-RECORDER-001, BM-BASE-SECURITY-AND-PRIVACY-001]
    every_wp_assesses_every_mandatory_pillar: true
    adding_a_pillar_is_a_matrix_entry_change_never_an_ad_hoc_contract_field: true
    stub_check_ref: mandatory_pillar_rows_present
  assessment_policy:
    every_active_entry_considered: true
    existing_feature_universe: current_specification_primitive_feature_relations_and_product_topology
    candidate_selection: declared_dependencies_reverse_dependencies_shared_resources_and_registered_semantic_relations
    source_import_graph_alone_is_insufficient: true
    coverage_records_universe_digest_and_exclusions: true
    stored_rows: change_verify_only_and_unresolved_only
    not_applicable_rows_derived_from_universe_digest_and_excluded_entry_ids_never_stored: true
    coverage_record: [universe_digest, assessed_entry_ids, excluded_entry_ids]
    missing_metadata_or_ambiguous_semantics: unresolved
    dispositions: [change, verify_only, not_applicable, unresolved, outside_activated_scope]
    model_details_cannot_erase_mechanical_matches: true
    nonapplicability_requires_supported_reason: true
    closure_requires_no_unresolved_rows: false
    one_proof_can_cover_multiple_rows: true
    provenance_only_refresh_uses_new_controller_revision_without_duplicate_implementation_or_proof: true
    no_all_pairs_paperwork_required: true
    all_entries_checked_at: [stub_creation, activation, rebase, scope_change]
    unchanged_inputs_reuse_prior_valid_resolution: true
    activation_and_closure_require_no_unresolved_scope_relevant_rows: true
    scope_uncertainty_requires_resolution_not_assumed_exclusion: true
    unrelated_future_features_are_recorded_as_out_of_scope_not_synthetic_work: true
    planning_assessment_is_non_executable: true
  change_policy:
    new_or_changed_entry_invalidates_open_work_assessment: true
    reassess_before_next_claim_activation_or_closure: true
    needs_rebase_only_when_obligations_change: true
    no_silent_active_contract_rewrite: true
    completed_contracts_keep_snapshot: true
    retired_entry_history_retained: true
    changed_obligations_bind_only_after_refinement_enrichment_and_renewed_activation: true
    bulk_injection_into_open_wp_mt_forbidden: true
    unavailable_required_dependency: explicit_dependency_blocker_or_separately_activated_work_not_implicit_scope_expansion
  entries:
  - entry_id: BM-BASE-GUI-UX-001
    revision: 1
    status: active
    title: gui_ux
    legacy_impact_key: gui_ux
    rule_refs: [BR-UI-ADAPT-001]
    requirement_refs: []
    selector:
