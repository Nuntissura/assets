schema_version: handshake.codex-source.v10
kind: codex_source

identity:
  codex_source_id: CODEX-PROJECT-v1
  project_id: PROJECT-REPLACE-ME
  version: 29
  revision: 22
  status: draft


execution_modes:
  default: handshake_managed
  selected_mode_field: project_installation.execution_mode
  applies_to: all_manifest_selected_templates
  domain_ownership_unchanged: true
  modes:
    handshake_managed:
      bookkeeping_actor: registered_handshake_controller
      provider_entry_mode: installed_global_authority_declared_mode
      controller_schema_compiler_and_release_gates_required: true
      direct_machine_owned_writes_forbidden: true
    model_operated:
      bookkeeping_actor: authorized_model_coordinator_using_verified_filesystem_and_git_helpers
      provider_entry_mode: identical_thin_routing_entrypoints
      provider_mode_authority: Operator-requested split CODEX folder with shared model-operated routes; this named model-profile exception does not alter handshake_managed mirror policy.
      root_entrypoints: [CODEX.md, AGENTS.md, CLAUDE.md]
      entrypoint_target: repo-governance/codex/CODEX.md
      project_protocol_path: repo-governance/codex/protocols/project/repository-operation.md
      shared_protocol_path: repo-governance/codex/protocols/shared/model-operation.md
      source_of_protocol_content: execution_modes_and_repository_workflows
      role_authorization:
        source: explicit_operator_request_and_recorded_coordinator_assignment
        coordinator_actions: all_action_registry_actions_except_independent_review_of_own_submission_record_integration_verdict_and_merge_wp
        worker_actions: [claim_mt, submit_receipt, release_claim, record_blocker, request_validation, propose_gameplan_step]
        worker_condition: Coordinator serializes governance publication; worker performs only assigned owned product scope and may not write another claim or lane.
        reviewer_actions: [record_validation_verdict, record_integration_verdict, merge_wp, record_blocker]
        independent_review_condition: Reviewer must not be the author when the activated contract requires independence.
        integration_review_condition: record_integration_verdict and merge_wp only by the recorded integration_validator reviewer in fresh context (IV-INV-001 exclusive_final_verdict_authority); coordinator never records them.
        lane_binding: Record actual actor/session/role and disjoint allowed writes in canonical WP state before work; one serialized coordinator lane publishes governance.
        undeclared_action_or_authority: block_and_report_exact_missing_authorization
      transition_registry:
        owner: this_model_operated_profile
        conditions_owner: selected_action_registry
        transitions:
        - {action: create_wp_stub, from: absent, to: stub_drafting}
        - {action: submit_contract_detailing, from: [stub_drafting, planning_transaction, planned], via: planning_transaction, to: planned, executable: false}
        - {action: request_activation, from: [planned, activating], via: activating, to: active, publish_after: all_action_commit_checks}
        - {action: rebase_wp, from: [stub_drafting, planning_transaction, planned, activating, active, validating, merge_pending], to: planned, executable: false, preserve_prior_contract: true}
        - {action: claim_mt, wp_phase: active, claim_from: unclaimed, claim_to: owned_unexpired_lease}
        - {action: release_claim, claim_from: owned_unexpired_lease, claim_to: released_recoverable}
        - {action: request_validation, from: active, to: validating, requires: all_required_mt_passes_current}
        - {action: record_integration_verdict, from: validating, passed_to: merge_pending, failed_to: active, inconclusive_to: validating, blocked_to: validating, requires: all_required_mt_passes_apply_and_exact_candidate}
        - {action: merge_wp, from: merge_pending, to: merge_pending, requires: integration_pass_and_expected_target_head}
        - {action: confirm_merge_containment, from: merge_pending, to: completed, publish_after: actual_target_branch_containment_and_all_commit_checks}
        - {action: cancel_wp, from: [stub_drafting, planning_transaction, planned, activating, active, validating, merge_pending], to: cancelled, publish_after: all_action_commit_checks}
        - {action: supersede_wp, from: [stub_drafting, planning_transaction, planned, activating, active, validating, merge_pending], to: superseded, publish_after: all_action_commit_checks}
        phase_preserving_actions: [upsert_build_matrix_entry, retire_build_matrix_entry, set_priority, bind_solution, fork_solution, propose_solution_promotion, upgrade_solution_binding, submit_receipt, record_blocker, propose_gameplan_step, retire_gameplan_step, start_validation_round, dispatch_role, pause_workflow, resume_workflow, cancel_workflow, propose_workflow_policy, trial_workflow_policy, promote_workflow_policy, rollback_workflow_policy]
        verdict_scope: record_validation_verdict is MT-scope only (microtask_transitions) and changes only that MT phase; WP validating -> merge_pending only by record_integration_verdict passed after all_required_mt_passes_apply on the same candidate; WP-scope record_validation_verdict is an undefined_transition.
        undefined_transition: block_instead_of_inventing_success
      microtask_transitions:
        rule_id: CODEX-MODE-MT-001
        state_owner: wp_state.microtasks
        action_target_selector: Existing action target_ids identifies one MT and its activated parent; absence of an MT selects WP transitions. Reject ambiguous target context.
        activation_initial_phase: ready
        parent_phase_during_mt_execution: active
        phase_vocabulary_owner: HT-WORK-CODING-001.lifecycle.mt_phases
        transitions:
        - {action: claim_mt, from: ready, to: in_progress, requires: eligible_unclaimed_mt_and_valid_owned_lease}
        - {action: claim_mt, from: needs_remediation, to: in_progress, requires: same_or_fresh_valid_lease_and_payload_names_recorded_failed_verdict_id}
        - {action: claim_mt, from: needs_new_approach, to: in_progress, requires: recorded_diagnosis_cause_distinct_from_every_prior_diagnosis_on_mt}
        - {action: request_validation, from: in_progress, to: ready_for_validation, requires: implementation_proof_and_exact_immutable_submission}
        - {event: validator_assigned, from: ready_for_validation, to: validating, requires: independent_validator_and_exact_submission}
        - {action: record_validation_verdict, from: validating, passed_to: passed, failed_to: needs_remediation, requires: exact_submission_acceptance_and_required_reviewer_authority}
        - {action: record_validation_verdict, from: validating, inconclusive_to: validating, requires: retained_submission_and_exact_blocker}
        - {action: record_validation_verdict, from: validating, blocked_to: blocked_on_dependency, requires: blocker_type_dependency_and_blocked_on_mt_ref_names_open_mt}
        - {event: rounds_without_output_limit_reached, from: [in_progress, needs_remediation, ready_for_validation, validating], to: needs_new_approach, requires: recorded_rounds_without_output_equals_limit}
        - {event: failed_verdicts_same_cause_limit_reached, from: needs_remediation, to: needs_new_approach, requires: failed_verdicts_same_cause_limit_without_new_diagnosis_ref}
        - {event: proof_invalidated, from: passed, to: ready_for_validation, requires: candidate_diff_intersects_recorded_relevant_input_paths_at_round_freeze}
        - {action: release_claim, from: in_progress, to: ready, requires: preserved_recoverable_work}
        non_phase_actions: [submit_receipt, record_blocker, propose_gameplan_step]
        event_emitter: coordinator_from_recorded_state_and_round_receipts
        transition_mirror: HT-WORK-CODING-001.lifecycle.transitions
        completed_dependency_eligibility: An MT is an eligible dependency only in phase passed, and only when every required acceptance and independent verdict names the same submitted revision; receipt append alone never advances an MT to passed.
        claim_settlement: Coordinator settles the submitted claim before publishing passed or needs_remediation; an MT in needs_remediation requires claim_mt with the same or a fresh valid lease before renewed edits.
        no_independent_review_selected: Coordinator may evaluate recorded proof through record_validation_verdict when the activated MT contract does not require an independent reviewer; do not invent an independent verdict.
        does_not_advance_parent_phase_or_authorize_merge: true
      mechanical_adapter_fields:
        controller_and_collector: Model coordinator with actual helper identity replaces Handshake controller/collector actors in action, WP, MT, receipt, state and taskboard templates.
        evaluator: Coordinator evaluates the same declared action predicates and this profile's transitions against fresh canonical files; no unavailable handshake.action_eligibility endpoint is asserted.
        write_prohibitions: Direct-state and manual-contract prohibitions restrict workers and unsupervised edits; coordinator may write these artifacts through the preserving generation-checked model protocol.
        final_compiler_schemas: Final Handshake runtime schema/compiler release remains a Handshake gate; model governance checks actual action fields against the supplied selected template shapes, required fields and references without claiming those final schemas exist.
        commands: Use inspected actual filesystem or Git helpers and record their exact invocations; unavailable controller command IDs stay inactive and are never invented.
      operating_protocol:
        coordinator: Serialize canonical governance writes; assign stable actor/session/action identities; verify source hashes and generations before publication; commit governance files by explicit path only.
        coordinator_verdict_gate: Before recording any verdict run skill/scripts/validate_artifacts.py --schemas repo-governance/schemas --wp-dir <wp_dir> (at round freeze add --candidate-diff <file> --candidate-commit <sha>); exit != 0 blocks recording; then apply CODEX-VAL-005.
        round_ownership: wp_validator reviewer freezes the pushed candidate commit, runs the canary and the round (CODEX-VAL-006); coordinator writes wp_state.stock_execution_state.validation_batches and microtasks.*.rounds_without_output from the round receipt (CODEX-STEER-007).
        resume: Before any effect coordinator reconciles wp_state.pending_recovery and receipt.mechanical.spawned_processes against the live process inventory (CODEX-STEER-005, CODEX-FLOW-008).
        gameplan: CODEX-GAMEPLAN-002.
        worker: Claim only eligible activated MT scope; preserve claims and evidence; write only its owned worktree and allowed paths.
        reviewer: Inspect the submitted immutable source and evidence independently when the active contract requires a verdict.
        concurrency: Disjoint workers may run in parallel; if exclusive claims or reliable generation rechecks are unavailable, serialize conflicting work.
        receipts: Record only observed commands, exit codes, hashes, timestamps, identities and settled outcomes; identify the model/helper producer truthfully.
        transactions: Preview without side effects; preserve before-images; recheck source and target generations before write; verify results; retain interrupted state for recovery.
        lease: A claim lease lasts until the MT's verdict is recorded or the claim is released; liveness comes from the dispatch process, never from heartbeats.
      unresolved_project_bindings: Explicitly list unresolved template fields as inactive bindings; stock rules remain obligations, but resolve every action-relevant binding before execution.
      bootstrap_readiness: Repository structure, installed source and rules, accepted spec, routing and model lifecycle guidance validate; this does not assert Handshake release or product runtime readiness.
      lifecycle_admission: Use the selected action registry conditions and existing WP/MT phase semantics; coordinator verifies applicable conditions against canonical files before each mutation and again before publishing outcomes.
      runtime_prerequisites: SDK, exact reuse resolution, product catalog and final runtime schemas are required only by the scoped action that depends on them; missing required product dependencies block that scope.
  interpretation_rules:
  - rule_id: CODEX-MODE-001
    requirement: Record the execution mode explicitly. Retain all concern ownership, scope, preservation, stable identity, freshness, evidence and lifecycle requirements in both modes.
  - rule_id: CODEX-MODE-002
    requirement: In model_operated mode only, controller/compiler actor exclusivity, controller transport, controller-only write prohibitions and automatic compiler release admission are implemented by the model coordinator protocol; this is not permission to relax any action prerequisite, product requirement or proof condition.
  - rule_id: CODEX-MODE-003
    requirement: In handshake_managed mode retain all existing controller, evaluator, schema, compiler and provider-mirror gates unchanged. A controller outage never silently switches mode; mode migration requires an explicit recorded operator instruction and preserved state.
  - rule_id: CODEX-MODE-004
    requirement: In model_operated mode generate identical root CODEX.md, AGENTS.md and CLAUDE.md routing to the folder CODEX; keep actual execution instructions, build rules and workflows at their separate codex-folder owners. Reject stale routing and divergent authoritative copies.
  - rule_id: CODEX-MODE-005
    requirement: Never fabricate controller, SDK, compilation, schema-release, action or success receipts. Record actual model/helper execution and evidence; installing a draft stock payload or a repository guide does not release Handshake or prove any product capability.
  - rule_id: CODEX-MODE-006
    requirement: Preserve unresolved stock values as declared inactive project bindings and resolve those needed by the selected scoped action from inspected authority before using them; do not replace missing product behavior, exact dependency resolution, acceptance proof or schema requirements with model narration.

repository_workflows:
  output_path: repo-governance/codex/workflows/repository-workflows.md
  authority_source: repo-governance/codex/current/codex-source.yaml
  steps:
  - workflow_id: CODEX-FLOW-001
    title: Initialize or upgrade the repository
    required_reads: [repository_structure, accepted_specification, template_pack, execution_modes]
    actions:
    - Inspect existing authority, files, Git state, ownership and installed template versions; preserve product code and local data.
    - Plan the exact directory and file changes; create required base containers even when empty; stage manifest-selected stock templates once.
    - Install accepted specification, stock build obligations, canonical CODEX source, folder CODEX, workflow/protocol projections and identical model-mode root routers; record unresolved inactive bindings explicitly.
    - Apply only after source and target preconditions still agree; verify preservation and require a zero-change repeat.
    proof: Verified source/target hashes, actual directory inventory, routing and template-pin checks, spec validation and repeat-plan result; no inferred Handshake release.
  - workflow_id: CODEX-FLOW-002
    title: Create a non-executable work-packet stub
    required_reads: [current_specification, action_registry.actions.create_wp_stub, work_packet_template]
    actions:
    - Preserve the operator request, intended scope and unresolved work; allocate a stable WP identity and non-executable planning state at the declared WP location.
    - Reference the relevant accepted specification and candidate obligations; create no worktree or executable MT during stub creation.
    - Record the spec enrichment disposition on the stub; an operator idea with no initiating spec anchor requires update_required and a spec enrichment before activation.
    proof: Canonical stub/state reread has planning status, source revision and preserved requested scope with no executable activation or worktree.
  - workflow_id: CODEX-FLOW-003
    title: Refine, archive and enrich the specification
    required_reads: [refinement_enrichment_template, specification.update_protocol, repository_structure.specification_archive]
    actions:
    - Extract the WP area, inspect project reality and current research, identify reuse, risks, minimum controls and bounded acceptance.
    - Before every accepted spec change, archive and verify the complete previous current bundle; advance its version and revision and preserve self-contained accepted meaning.
    - Adopt accepted findings into the current spec, then rebuild the final bounded resolved context from that exact revision; retain other research separately.
    proof: Complete archived bundle matches its prior source hashes; current spec validates and final refinement context references the enriched revision.
  - workflow_id: CODEX-FLOW-004
    title: Activate scoped work and provision its worktree
    required_reads: [action_registry.actions.request_activation, current_refinement, work_packet_template, repository_structure.worktree_policy]
    actions:
    - Verify completed refinement/enrichment, current spec synchronization, bounded matrix assessment and required dependencies; retain excluded future scope.
    - Bind stable spec/rule/matrix IDs and applicable resolved SDK contracts into versioned WP and MT contracts; unresolved required values block activation.
    - Resolve an actual Git base commit before worktree creation. An unborn repository needs an operator-authorized initial commit; absent that authorization or commit, record the exact blocker and keep activation non-executable. Never invent a base ref.
    - Only now create or verify the owned Git worktree beneath the canonical main-root worktrees/WP-ID path and temporary output binding; record exact branch, worktree and generation.
    - Create the WP gameplan from the HT-WORK-GAMEPLAN-001 stock steps with this WP's references (CODEX-GAMEPLAN-001).
    - Publish active status and release executable MTs only after all activation commit checks pass.
    proof: Canonical contracts/state and Git worktree list agree on identity, scope, source revision and actual workspace; no required activation condition remains pending.
  - workflow_id: CODEX-FLOW-005
    title: Claim, execute and review a microtask
    required_reads: [action_registry.actions.claim_mt, active_wp_contract, microtask_context, current_wp_state]
    actions:
    - Verify eligible unclaimed MT, dependencies, role, lane and nonconflicting write scope; record the actual owned claim and lease before edits.
    - Execute only the claimed scope in its verified worktree, preserving maintained source and routing disposable output through the WP temporary binding.
    - Before each costly action pass the gameplan gate for the acting role and moment (CODEX-GAMEPLAN-001); a failing step blocks that action.
    - Run the declared implementer compile or static check, inspect the resulting diff and publish the immutable submission; the validator runs only its bound proof commands, reusing valid unchanged evidence. Repair recorded failures before extending the batch.
    - Publish MT completion only after its required verdict and acceptance conditions hold; never use an unreviewed submission as a validated dependency.
    proof: Claim and scope match canonical state, commands and artifacts prove acceptance, and any required independent verdict names the exact submitted generation.
  - workflow_id: CODEX-FLOW-006
    title: Project the taskboard from canonical work
    required_reads: [taskboard_config, wp_state, work_packet_contracts, receipts]
    actions:
    - Derive scheduling and display rows from canonical WP/MT contracts, lifecycle state and observed evidence; preserve source generations.
    - Keep planned stubs non-executable and partial or blocked scope visible; never edit a projected row as an independent status source.
    proof: Projection reconciles against the complete canonical set and generation; visible UI rows or counts do not replace backend state.
  - workflow_id: CODEX-FLOW-007
    title: Complete, cancel or supersede a work packet
    required_reads: [work_packet_closure_contract, current_wp_state, repository_structure.temporary_output_policy]
    actions:
    - Verify required product outcomes and review verdicts; synchronize verified MT/WP, roadmap and implemented matrix coverage without dropping unresolved work.
    - Preserve durable evidence and recovery records before settling owned operations and claims; clean only the verified owned WP temporary root after containment and active-use checks.
    - Remove a worktree only through native Git after clean-state and preservation checks; retain unresolved cleanup as a blocker and archive superseded contracts with history.
    - Keep validated work merge_pending until its approved revision is actually contained in the authorized target branch; no merge is authorized merely by a readiness check. Publish terminal status only after required settlement checks pass; retain separately identified nonblocking debt without erasing valid product proof.
    proof: Canonical state, durable evidence, target-branch containment where required and actual owned cleanup outcome agree; no terminal success is inferred from a product PASS alone.
  - workflow_id: CODEX-FLOW-008
    title: Resume interrupted work or migrate execution mode
    required_reads: [current_installation, canonical_wp_state, preserved_receipts, current_git_worktrees, live_process_inventory, host_restart_evidence]
    actions:
    - Read canonical source generations, claims, exact worktrees and incomplete transactions before retrying; do not rely on conversational memory.
    - Reuse still-valid proof and original action identities; reconcile uncertain outcomes before further effects, preserving conflicting changes.
    - Read the host restart evidence named by the host profile before attributing a stopped job to a crash; record host_restart true or false with its event reference in the recovery receipt; a host restart triggers resume, never remediation.
    - Terminate unowned processes writing beneath the WP temporary root before retrying.
    - Pass the on_resume gameplan steps (CODEX-GAMEPLAN-001) before any further effect.
    - Complete any half-written verdict per CODEX-VAL-008 before recording new verdicts.
    - Migrate template layout or execution mode only through an explicit preserving plan that names changed authority, unresolved inputs and affected active work; Handshake mode additionally requires its real release gates.
    proof: Fresh canonical reread confirms the recovered outcome and compatible pinned inputs; migration never invents a controller receipt or silently changes active acceptance.

