update_protocol:
  controller: handshake
  pre_update_snapshot:
    rule_id: SPEC-UPDATE-001
    location_ref: repository_structure.specification_archive.path_pattern
    scope: complete_existing_current_spec_bundle_including_manifest_and_all_files
    operation: copy_preserving_bytes_and_relative_paths_never_move_current
    timing: before_any_current_content_or_version_mutation
    verify_complete_membership_and_file_hashes_against_expected_base: true
    snapshot_is_immutable_and_not_current_product_authority: true
    same_revision_and_digest_retry_reuses_verified_snapshot: true
    conflicting_archive_destination_blocks_update: true
    first_creation_without_prior_current_spec_requires_no_archive: true
  versioning:
    rule_id: SPEC-UPDATE-002
    every_committed_content_or_verified_status_change_increments_bundle_version_and_revision: true
    archive_uses_prior_identity_version_revision_and_digest: true
    changed_documents_increment_revision_and_refresh_manifest_digests: true
    unchanged_document_revisions_and_semantic_ids_are_preserved: true
    schema_version_changes_only_when_format_contract_changes: true
    no_change_operation_does_not_bump_or_archive: true
  publication:
    rule_id: SPEC-UPDATE-003
    stage_validate_then_recheck_expected_base_before_current_replacement: true
    failed_or_interrupted_update_keeps_or_restores_complete_prior_current: true
    active_spec_remains_self_contained_without_archive_dependencies: true
    archive_result_recorded_in_existing_change_history_and_update_receipt: true
  entrypoints:
  - wp_stub_creation
  - wp_activation_refinement
  - wp_rebase
  - verified_implementation_completion
  accepted_delta_applied_before_contract_compilation: true
  unchanged_direction_does_not_force_content_rewrite: true
  reextract_resolved_context_after_enrichment: true
  regenerate_affected_indexes_and_primitive_feature_matrix: true
  validate_cross_document_ids_refs_and_hashes_before_commit: true
  ad_hoc_additions_follow_same_planning_transaction: true
  stale_base_revision_requires_conflict_resolution: true
  interruption_requires_recovery_without_partial_ready_contract: true
  contract_enforcement_binding: only_after_completed_refinement_enrichment_and_spec_sync_during_wp_activation
  stub_output: non_executable_proposed_scope_and_detailing
  spec_ids_flow_into: activation_selected_build_matrix_wp_requirements_and_assigned_mt_obligations
  future_feature_presence_does_not_authorize_implementation: true
  research_adoption_copies_complete_accepted_meaning_into_spec: true
  roadmap_completion_sync: Record verified implemented scope inside spec, reconcile ongoing build-rule/matrix
    coverage, and expose it to subsequent scoped activation hydration.
change_history:
- revision: 1
  refinement_enrichment_ref: null
  receipt_ref: null
  archived_snapshot_ref: null
  changed_anchor_ids:
  - TOPIC-TASKBOARD-CONTRACT
  - TOPIC-TASKBOARD-ROADMAP
design_status:
  accepted: Existing documented taskboard meaning preserved from inspected public source and manual; taskboard-only
    owner-template adoption.
  pending: Source structure validation, semantic preservation review and runtime acceptance; repository
    bootstrap, scoped activation and standalone module release guarantees are not established.
topic_format_contract:
  rule_refs:
  - BR-SPEC-FORMAT-001
  - BR-SPEC-SELF-001
  every_topic_header_is_machine_readable: true
  header_encoding: fenced_yaml
  header_required_fields:
  - kind
  - topic_id
  - title
  - content_blocks
  header_kind: specification_topic
  topic_id_unique_within_spec: true
  content_block_descriptor_fields:
  - block_id
  - kind
  - language
  - requirement_refs
  content_block_kinds:
  - prose
  - code_example
  - structured_contract
  block_association: Header descriptors map in order to the following fenced blocks until the next specification_topic
    header; counts and languages must match.
  prose_encoding: fenced_markdown
  code_example_encoding: fenced_code_with_explicit_language
  structured_contract_encoding: fenced_yaml_or_json
  all_topic_content_is_fenced: true
  longer_fences_required_when_content_contains_fence_delimiters: true
  plain_heading_is_not_sufficient_topic_header: true
  heading_text_inside_prose_is_not_an_undeclared_topic: true
  fences_do_not_demote_spec_authority: true
  code_examples_cannot_override_explicit_behavioral_requirements: true
  content_blocks_stored_inline_not_as_sidecars: true
  all_product_requirement_and_acceptance_refs_resolve_inside_spec: true
  downstream_build_rule_matrix_wp_mt_refs_are_links_not_imported_truth: true
  recognition: Only a fenced YAML header with kind=specification_topic outside a content block starts
    a topic; consume the declared block count in order before recognizing another header.
  structured_contract_record_schema_ref: document_schema.structured_record_collections
roadmap_contract:
  rule_ref: BR-SPEC-ROADMAP-001
  path: spec-modules/roadmap.md
  role: specification_document_not_sidecar
  document_format_ref: topic_format_contract
  all_spec_product_items_represented_by_existing_semantic_ids: true
  definitions_owner: original_spec_topics_requirements_features_primitives_and_interactions
  roadmap_owns_implementation_status_not_duplicate_definitions: true
  row_required_fields:
  - item_ref
  - source_topic_refs
  - overview_summary
  - implementation_status
  - implemented_requirement_refs
  - remaining_requirement_refs
  - implementation_source_revision
  - verification_summary
  - matrix_entry_refs
  implementation_statuses:
  - planned
  - in_progress
  - partially_implemented
  - implemented
  - retired
  planned_is_accepted_product_truth_not_suggestion: true
  status_controller: handshake
  status_inputs: verified_wp_mt_completion_and_accepted_spec_changes
  implemented_requires_verified_acceptance_for_entire_declared_item_scope: true
  partial_completion_must_not_mark_whole_feature_implemented: true
  completion_attestation_and_scope_are_recorded_inline: true
  outside_receipts_are_optional_audit_links_not_missing_product_meaning: true
  changed_requirement_reassesses_only_affected_implementation_status_and_proof: true
  implemented_items_require_build_rule_matrix_coverage: true
  shared_matrix_entry_may_cover_multiple_implemented_items: true
  ongoing_obligations_apply_only_where_relevant_to_later_activated_work: true
  completion_updates_spec_status_and_rule_matrix_in_recoverable_transaction: true
  interruption_exposes_pending_sync_without_falsely_claiming_promotion: true
  future_wp_mt_hydration_reads_current_baseline_at_activation: true
  existing_active_contracts_do_not_receive_silent_new_enforcement: true
  identity_allocation_is_separate_from_enforcement_binding: true
  presentation: concise_product_overview_with_implemented_section
  overview_rule_refs:
  - BR-SPEC-ROADMAP-002
  - BR-SPEC-ROADMAP-003
  - BR-SPEC-ROADMAP-004
  overview_fields:
  - item_ref
  - overview_summary
  - implementation_status
  - source_topic_refs
  source_topic_refs_resolve_to_defining_topics_inside_spec: true
  overview_summary_role: navigation_summary_not_a_second_behavior_definition
  implemented_section:
    title: Implemented
    membership: verified_implemented_items
    placement: move_existing_entry_without_copying_or_changing_identity
    partial_items_remain_in_unfinished_overview: true
    accepted_expansion_reopens_same_entry_until_remaining_scope_is_verified: true
  stable_anchor_policy:
    identity_source: existing_item_ref
    independent_of_section_heading_status_and_position: true
    links_survive_moves_to_and_from_implemented_section: true
    one_roadmap_entry_per_item: true
  completion_metadata_presentation: inline_machine_metadata_kept_separate_from_concise_overview_text_in_the_same_document
  retirement:
    placement: retain_same_entry_and_anchor_in_a_Retired_section
    required_inline_context:
    - retirement_reason
    - replacement_refs
    existing_implementation_history_preserved: true
    retired_requirement_ids_never_reused: true
    obligation_effect: Stop selecting retired behavior for new scope only after accepted spec change and
      matrix reassessment; preserve data, compatibility and cleanup obligations still applicable. Do not
      mutate existing contracts.
document_schema:
  schema_version: handshake.spec-document.v1
  rule_refs:
  - BR-SPEC-FORMAT-001
  - BR-SPEC-SELF-001
  frontmatter_required:
    schema_version: handshake.spec-document.v1
    specification_id: nonempty_string
    document_id: stable_nonempty_string
    revision: positive_integer
    title: nonempty_string
  frontmatter_optional:
    updated_at: iso_date
    supersedes: stable_id_array
    provenance: optional_reference_array
  body: one_or_more_ordered_topic_headers_and_their_inline_fenced_blocks
  header_field_types:
    kind: literal_specification_topic
    topic_id: stable_nonempty_string
    title: nonempty_string
    content_blocks: nonempty_descriptor_array
  descriptor_field_types:
    block_id: nonempty_string_unique_in_topic
    kind: content_block_kinds
    language: nonempty_fence_language
    requirement_refs: stable_requirement_id_array
  structured_record_collections:
    anchors: anchor_fields
    requirements: requirement_fields
    acceptance: acceptance_fields
    features: feature_fields
    primitives: primitive_fields
    decisions: decision_fields
    primitive_feature_relations: primitive_feature_relation_fields
    gui_design: gui_design_fields
    roadmap: roadmap_contract.row_required_fields
    product: product_fields
    architecture: architecture_direction_fields
    project_field_definitions: document_schema.project_field_definition_fields
  record_field_types:
    identity_fields: nonempty_strings_preserved_when_present
    reference_fields: arrays_of_stable_ids_except_singular_ref_fields
    statement_rationale_decision_title_method_expected_result_contract: nonempty_strings
    conditions_exceptions: arrays_of_complete_inline_clauses
  empty_scope_arrays_allowed: true
  requirement_identity: May be absent before selection; Handshake allocates it before any stable reference
    or activation binding. All referenced declarations have IDs.
  acceptance_granularity: One independently checkable result per acceptance record; each activation-bound
    requirement references applicable acceptance.
  declaration_ownership: Each stable semantic ID is declared once in the spec; subsequent occurrences
    are references, including roadmap entries.
  topic_ownership: A topic may own multiple related requirements; independently selected obligations have
    separate requirement IDs. Files need not correspond one-to-one with features.
  reference_resolution: Resolve product declarations and acceptance inside the spec; downstream/provenance
    references never supply missing meaning.
  versioning: Preserve IDs for the same meaning or moves; increment changed document revisions. Retain
    superseded declarations and explicit supersedes links for replacement or split/merge, without reusing
    retired IDs.
  migration: Convert in a staged document set, preserve meaning and map legacy anchors to stable IDs inline;
    unresolved mappings block affected activation. Commit consistent documents and rebuild navigation
    from them.
  unknown_fields: Reject unknown core fields; project-specific fields require an inline project field
    definition in the spec, never an external schema sidecar.
  prose_and_example_conflicts: Do not silently select a winner or derive new obligations from an example.
    Resolve through refinement review and applicable acceptance; parsing alone cannot prove semantic agreement.
  collection_schema_resolution: Unqualified names resolve in document_content_contract; dotted names resolve
    from this template root. Collection rows describe records, not additional declaration owners.
  anchor_ref_targets:
  - topic_id
  - anchor_id
  topic_headers_declare_valid_anchor_targets: true
  project_field_definition_fields:
  - field_name
  - scope
  - value_type
  - meaning
  roadmap_record_policy:
    required_fields_ref: roadmap_contract.row_required_fields
    retired_additional_fields_ref: roadmap_contract.retirement.required_inline_context
    source_topic_refs_target: topic_id
    item_ref_target: existing_spec_semantic_declaration
    definition_copy_forbidden: true
    planned_unverified_fields: implementation_source_revision may be null; implemented_requirement_refs
      and matrix_entry_refs may be empty; verification_summary records not yet verified.
    retirement_reason: nonempty_inline_string_when_retired
    replacement_refs: existing_semantic_id_array_may_be_empty
    retired_does_not_erase_prior_verified_scope: true
format_example:
  purpose: Illustrative encoding fixture only; do not instantiate its IDs or obligations in new projects.
  frontmatter:
    schema_version: handshake.spec-document.v1
    specification_id: SPEC-EXAMPLE
    document_id: DOC-IMAGE-EXAMPLE
    revision: 1
    title: Shared image actions
  header:
    kind: specification_topic
    topic_id: TOPIC-IMAGE-EXAMPLE
    title: Open the shared image
    content_blocks:
    - block_id: context
      kind: prose
      language: markdown
      requirement_refs:
      - REQ-IMAGE-OPEN-EXAMPLE
    - block_id: contract
      kind: structured_contract
      language: yaml
      requirement_refs:
      - REQ-IMAGE-OPEN-EXAMPLE
    - block_id: example
      kind: code_example
      language: json
      requirement_refs:
      - REQ-IMAGE-OPEN-EXAMPLE
  blocks:
  - language: markdown
    content: Recent images and the library refer to the same image resource. Their displayed actions may
      differ.
  - language: yaml
    content:
      requirements:
      - requirement_id: REQ-IMAGE-OPEN-EXAMPLE
        anchor_refs:
        - TOPIC-IMAGE-EXAMPLE
        statement: Opening an image from either surface resolves the same canonical image resource.
        rationale: Different presentations must not create duplicate image ownership.
        acceptance_refs:
        - ACC-IMAGE-OPEN-EXAMPLE
        conditions:
        - The caller is allowed to open the image.
        exceptions: []
        feature_refs:
        - FEAT-IMAGE-EXAMPLE
        primitive_refs:
        - PRIM-OPEN-EXAMPLE
      acceptance:
      - acceptance_id: ACC-IMAGE-OPEN-EXAMPLE
        requirement_refs:
        - REQ-IMAGE-OPEN-EXAMPLE
        method: Open the same image from both surfaces and inspect canonical resource identity.
        expected_result: Both operations resolve the same image resource and state owner.
      features:
      - feature_id: FEAT-IMAGE-EXAMPLE
        title: Shared image surfaces
        requirement_refs:
        - REQ-IMAGE-OPEN-EXAMPLE
        primitive_refs:
        - PRIM-OPEN-EXAMPLE
      primitives:
      - primitive_id: PRIM-OPEN-EXAMPLE
        title: open_original
        contract: Resolve the authorized canonical image resource for opening.
  - language: json
    content: '{"operation": "open_original", "image_ref": "IMAGE-EXAMPLE"}'
