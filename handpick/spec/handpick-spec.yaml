title: Handpick shared search and Notes input surface
purpose: Give a fresh agent the fixed product intent, reusable asset boundaries, complete requirements and honest
  implementation/proof state before extending Handpick.
reading_contract:
  machine_readable_baseline: This YAML carries the preserved product requirements; README.md explains them. Runtime
    source is evidence for mechanisms, not permission to redefine intent.
  authority_boundary: This asset specification does not import Portal/Desktop governance or grant ownership of their
    work. Consumers retain their own current project authority, canonical owners and coordinated implementation
    scopes.
  preservation: The 53 requirement, 12 capability and 16 acceptance records below are copied verbatim from the committed
    source WP. Their IDs and statements remain traceable; dated status notes do not rewrite acceptance obligations.
  scope_boundary: Portal and Desktop master specifications were left unchanged. This document describes Handpick
    and its asset; it is not a rewrite of either master specification.
  snapshot_warning: Reinspect current source, consumer authority and result artifacts before claiming a newer implementation
    status. Recorded results are historical evidence, not a fresh run from this specification.
