extension_workflow:
  starting_point:
  - Read README.md, this specification, the actual public API and shared fixtures.
  - Inspect current consumer authority, native owner contracts and capability declarations for the exact change.
  - Map the requested extension to existing HP-REQ/HP-CAP/HP-AC IDs; preserve original scope and unresolved decisions.
  change_boundary:
  - Keep reusable interaction/contracts in the crate; effects and native transactions in owners/adapters; rendering/animation
    in hosts.
  - Extend public contracts/fixtures rather than bypassing them with a private host state machine.
  - Preserve rich content and stable identity, authorization/coverage truth, replay/conflict safety and scope/lifecycle
    isolation.
  - Do not advertise a capability until the public owner port and required real boundary/rendered proof exist.
  verification:
  - Use native focused tests and the same fixture against actual generated WASM when shared code/transport changes.
  - Use the consumer project canonical runner and affected owner authorization/replay/readback tests for effects.
  - Use actual host GUI tests for editor identity, rich content, selection/undo, IME, bookmarks, morph and wide/narrow
    behavior.
  - Record target architecture and separate Desktop x64 proof; do not substitute ARM64 or emulation results.
  - Reuse still-valid results only when their inputs/asserted behavior are unchanged; documentation parse/ID checks
    do not prove runtime behavior.
  safe_recovery: On a rejected/stale/conflicting/unknown operation retain native recoverable writing and explicit
    status. Resolve the exact owner/lifecycle issue before retrying effects; do not create substitute content or
    a new store.
research_basis_snapshot:
  source: Committed Portal WP research_basis; inspected external research in that work, not freshly re-browsed for
    this documentation change.
  inspected_at: '2026-10-09'
  selected_foundation: Effect-free versioned Rust contracts and bounded in-memory interaction state; hosts supply
    authorized IDs, budgets and effects. No grammar/ranking/autosave/morph policy is finalized by the foundation.
  selected_expansion: One Notes system with shared input orchestration and native editor bindings; rich-session
    preservation, outliner operations and search/completion while composing precede full adapter integration. Preserve
    host authority/sync formats and explicitly gate unsupported capabilities.
  reuse: Existing native Notes editors/transactions/draft APIs, Portal journal/outbox/Forgejo checkpoints, Loom
    UUID resolution/access leases, injected frontend host ports, navigation routes and the canonical focused runner.
  external_sources:
  - url: https://code.visualstudio.com/docs/editing/intellisense
    application: Explicit suggestion acceptance, manual invocation and detail disclosure; no automatic prose capture
      decision.
  - url: https://www.w3.org/WAI/ARIA/apg/patterns/combobox/
    application: Keyboard focus/selection and accessible popup semantics; editor mode needs its own focus contract.
  - url: https://github.blog/engineering/the-technology-behind-githubs-new-code-search/
    application: Separate query interpretation, scoped retrieval and ranked display; do not blindly parse rich query
      text with a fuzzy matcher grammar.
  - url: https://github.com/helix-editor/nucleo
    application: Candidate mature fuzzy matcher; bounded worker execution and Unicode coordinate conversion require
      adapter proof.
  - url: https://serde.rs/enum-representations.html
    application: Explicit wire discriminants and versions; reject unsupported versions rather than infer variants.
  - url: https://surrealdb.com/docs/reference/query-language/functions/database-functions/search
    application: Assess full-text/BM25/fusion behind owners against the actual pinned SDK and engine, not latest
      documentation alone.
  - url: https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview
    application: Lexical/vector retrieval and fusion as a later measurable option; semantic outage must retain useful
      lexical behavior.
  - url: https://github.com/logseq/docs/blob/master/pages/Logseq%20Protocol.md
    application: Explicit native capture target; Operator selected canonical creation only on Save, without a separate
      writing mode.
  - url: https://obsidian.md/help/plugins/search
    application: Structured operators, exact phrases and tag/property search; preserve readable text and test incomplete
      syntax.
  - url: https://obsidian.md/help/edit-and-read
    application: Stock Obsidian Source and Live Preview editing modes; editor parity is separate from capture/journal
      organization and must be audited against actual host editors.
  - url: https://blog.logseq.com/how-to-get-started-with-networked-thinking-and-logseq/
    application: Outliner nesting/collapse/zoom, journal entry, references/embeds and linked writing; adopt interactions
      over existing Notes rather than a second note model.
  - url: https://github.com/logseq/docs/blob/master/db-version.md
    application: Current block/page, property/task/query/template and quick-add capabilities; journal defaults and
      storage choices belong to the host product, not this shared workflow.
  - url: https://obsidian.md/help/links
    application: Note/heading/block completion and stable reference behavior; block-reference Markdown interoperability
      requires explicit mappings and proof.
  - url: https://obsidian.md/help/plugins/backlinks
    application: Separate linked backlinks from unlinked mention candidates and expose useful source context without
      treating a textual match as a committed link.
  - url: https://obsidian.md/help/embeds
    application: In-place reference context with supported native preservation; bound recursion and recheck target
      authorization.
  - url: https://obsidian.md/help/plugins/templates
    application: Reusable explicit content insertion; preserve native undo and do not add executable plugin/template
      behavior.
  - url: https://tiptap.dev/docs/editor/extensions/functionality/uniqueid
    application: Unique node identity and collaboration initialization/mutation constraints; compare with current
      stable-block code before reuse.
  - url: https://github.com/logseq/logseq/blob/master/docs/cli/logseq-cli.md
    application: Position-aware insertion and operation previews; repeated insertion creates new content, so durable
      deduplication is an explicit owner requirement here.
  - url: https://doc.rust-lang.org/rustc/platform-support/windows-msvc.html
    application: Record host and target separately and require appropriate x64 tools for x64 builds.
