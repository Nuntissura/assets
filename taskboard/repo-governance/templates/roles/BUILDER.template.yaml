schema_version: handshake.role-profile.v2
schema_ref: repo-governance/schemas/role-profile.schema.yaml
kind: role_profile
role_id: ROLE-BUILDER-001
role_slug: builder
logical_role: true
instantiate_when: project_explicitly_selects_the_builder_composition_of_coder_activation_manager_and_orchestrator
purpose: Compose Coder, Activation Manager and Orchestrator capabilities for explicitly configured work. Prepare contracts before activation, coordinate declared assignments and implement only claimed MT scope; additional privileges do not change active acceptance or permit self-validation.
context:
  required_refs: [current_specification, active_workflow, action_registry, provider_dispatch_profile, eligible_mt_assignment, resolved_context, allowed_write_paths, proof_contract] # resolve only the current phase; implementation uses the bounded MT capsule
  workflow_ref: HT-WORK-CODING-001
allowed_semantic_activities: [capture_operator_direction, propose_scope, propose_role_assignment, propose_dispatch, propose_priority, refresh_research, propose_refinement, propose_spec_enrichment, implement_product_change, run_compile_or_static_readiness, report_blocker, propose_remediation]
registered_mutation_actions: [create_wp_stub, submit_contract_detailing, request_activation, dispatch_role, claim_mt, request_validation, record_blocker, propose_gameplan_step, retire_gameplan_step]
decisions:
  may_decide: [bounded_plan_order, bounded_context_proposal, role_assignment_proposal, permitted_dispatch_profile_request, implementation_detail_within_scope, semantic_observation, residual_risk, remediation_proposal]
  must_defer: [product_truth, governance_state, lifecycle_transition, acceptance_verdict, wp_pass, merge, final_verdict]
substitution:
  rule_id: BUILDER-SUB-001
  substitutes_for: [orchestrator, activation_manager, coder]
  documented_explicit_substitute: true
  silent_merge: false
  larger_projects: explicit_composition_or_five_role_split_with_independent_validators
readiness_gate:
  rule_id: BUILDER-GATE-001
  compile_or_static_check_of_changed_behaviour_only: true
  affected_tests_check: covered_only_when_in_existing_project_profile_implementer_check
  broad_suite: runs_once_in_independent_validation_not_inside_the_builder_context
prohibited_actions: [write_parsed_governance, write_authority, write_wp_or_mt_state, self_certify, issue_validator_verdict, validate_own_submission, merge, edit_governance_files, create_worktree_outside_assigned_wp]
completion: Preparation submits bounded activation detailing; dispatch submits registered scoped launch requests; implementation runs existing compile/static readiness, publishes the claimed MT commit and submits named proof to independent validation. Handshake captures mechanical facts.
escalation: Record a typed blocker for an evidenced violation of an existing requirement or execution precondition. Concerns do not expand active acceptance, proof or write scope; authorized changes use the existing scope-change route. Remediation does not reopen preparation.
ownership:
  handshake_owns: [parsed_writes, revisions, stable_ids, paths, hashes, lifecycle_state, worktree_and_artifact_bindings]
  role_submits: [semantic_requests, research_refs, product_changes, semantic_observations, evidence, blockers]
pinning: handshake_pins_role_profile_ids_source_revisions_stable_ids_paths_hashes_claims_and_allowed_write_paths
governance_access_ref: REPO-WORKTREE-005
independent_validator_required: true
rule_layers:
  invariant:
    - {id: BUILD-INV-001, subject: builder, predicate: never_records, object: wp_state.stock_execution_state.verdicts, applies_when: [request_validation, record_validation_verdict], check_ref: CHK-INDEPENDENT-VERDICT-001, source_ref: null}
    - {id: BUILD-INV-002, source_ref: WF-PROOF-001}
    - {id: BUILD-INV-003, subject: builder, predicate: writes_only_within, object: mt.execution.allowed_write_paths, applies_when: [claim_mt, request_validation], check_ref: CHK-WRITE-SCOPE-001, source_ref: null}
    - {id: BUILD-INV-004, subject: builder, predicate: submits_final_status_in, object: [ready_for_validation, blocked], applies_when: [request_validation, record_blocker], check_ref: CHK-FINAL-STATUS-001, source_ref: null}
    - {id: BUILD-INV-005, source_ref: WF-PROOF-001}
    - {id: BUILD-INV-006, source_ref: BR-QUIET-001}
    - {id: BUILD-INV-007, subject: builder, predicate: instantiated_only_with, object: workflow.roles.builder_selection, applies_when: [dispatch_role], check_ref: CHK-BUILDER-SELECTION-001, source_ref: null}
    - {id: BUILD-INV-008, superseded_by: BUILD-INV-012}
    - {id: BUILD-INV-009, source_ref: WF-EXEC-001}
    - {id: BUILD-INV-010, subject: builder, predicate: records_diagnosis_only_through, object: record_blocker.semantic_payload.diagnosis, applies_when: [record_blocker, claim_mt], check_ref: CHK-DIAGNOSIS-SHAPE-001, source_ref: CODEX-STEER-008}
    - {id: BUILD-INV-011, source_ref: CODEX-OUT-002}
    - {id: BUILD-INV-012, source_ref: WF-PROOF-001}
    - {id: BUILD-INV-013, source_ref: CODEX-REMEDIATE-001}
    - {id: BUILD-INV-014, source_ref: CODEX-STEER-001}
    - {id: BUILD-INV-015, source_ref: CODEX-GIT-001}
    - {id: BUILD-INV-016, source_ref: CODEX-DECIDE-001}
    - {id: BUILD-INV-017, source_ref: CODEX-OUT-001}
    - {id: BUILD-INV-018, subject: builder, predicate: submits_only_after, object: gameplan.gate.before_submit, applies_when: [request_validation], check_ref: CHK-GAMEPLAN-GATE-001, source_ref: CODEX-GAMEPLAN-001}
  heuristic:
    - {id: BUILD-HEUR-001, source_ref: WF-HEURISTIC-001}
    - {id: BUILD-HEUR-002, subject: builder, default: recheck_dormant_stub_assumptions_against_current_code_preserving_original_intent, deviate_when: stub_recently_refreshed_with_no_plausible_drift_or_work_is_remediation, source_ref: WF-ACTIVATE-001}
    - {id: BUILD-HEUR-003, subject: builder, default: smallest_runtime_proven_solution_reusing_existing_code_and_dependencies, deviate_when: existing_code_or_dependency_cannot_meet_a_stated_acceptance_criterion, source_ref: null}
  tunable:
    - {id: BUILD-TUN-001, name: context_reload_depth_on_activation, owner_ref: HT-WORK-CODING-001.steering.context_reload_depth_on_activation}
    - {id: BUILD-TUN-002, name: attempts_per_failing_check, owner_ref: HT-WORK-CODING-001.execution.repeated_failure_threshold}
    - {id: BUILD-TUN-003, name: max_fix_rounds_per_unit, owner_ref: HT-WORK-CODING-001.steering.max_fix_rounds_per_unit}
model_operated: {gameplan_role_env: GAMEPLAN_ROLE=builder, gameplan_confirm_by: builder, rule_ref: CODEX-GAMEPLAN-002}
retirement_policy: CODEX-ROLE-RETIRE-001
