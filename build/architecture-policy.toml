[[dependency_decisions]]
name = "serde"
version = "1.0.228"
consumer = "fforager-transport"
runtime_class = "non_shipped_build_tooling"
purpose = "Strictly serialize the WP-007 corpus manifest, case evidence, and aggregate verdict."
native = false
owner = "WP-FF-007-transport-fingerprint-spike"
allowed_consumers = ["fforager-transport"]
reason = "The mandatory corpus requires deny-unknown-fields DTOs and deterministic machine-readable reports."
removal_trigger = "The non-shipped spike is removed or its retained corpus migrates through an accepted non-Serde format transition."
approval_id = "WP-FF-007-transport-fingerprint-spike-v1-AC-002"
features = ["derive"]
default_features = true

[[dependency_decisions]]
name = "serde_json"
