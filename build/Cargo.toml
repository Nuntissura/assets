[workspace]
members = [
    "tools/fforager-xtask",
    "crates/fforager-javascript",
    "crates/fforager-transport",
    "../product/crates/fforager-contracts",
    "../product/crates/fforager-diagnostics-contract",
    "../product/crates/fforager-core",
    "crates/fforager-testkit",
]
default-members = [
    "tools/fforager-xtask",
    "crates/fforager-javascript",
    "crates/fforager-transport",
    "../product/crates/fforager-contracts",
    "../product/crates/fforager-diagnostics-contract",
    "../product/crates/fforager-core",
    "crates/fforager-testkit",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
boa_ast = "=0.21.1"
boa_engine = { version = "=0.21.1", default-features = false, features = ["fuzz"] }
boa_gc = "=0.21.1"
boa_interner = "=0.21.1"
boa_parser = "=0.21.1"
cargo_metadata = { version = "=0.23.1", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
saphyr = { version = "=0.0.11", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
sysinfo = { version = "=0.39.6", default-features = false, features = ["system"] }
toml = "=1.1.3"
tokio = { version = "=1.53.1", default-features = false, features = ["rt-multi-thread", "time"] }
wreq = { version = "=5.3.0", default-features = false, features = ["webpki-roots"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
