[workspace]
members = ["crates/buurtman-balie-host-demo", "crates/buurtman-balie-collaboration"]
default-members = ["."]
resolver = "2"

[package]
name = "buurtman-balie"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
description = "Buurtman Balie: host-independent CRM records, relationships and transactional service contracts"
publish = false
include = ["/Cargo.toml", "/Cargo.lock", "/README.md", "/src/*.rs", "/tests/*.rs", "/rust-toolchain.toml"]

[dependencies]
rusqlite = { version = "=0.40.2", features = ["bundled"], optional = true }
serde = { version = "=1.0.229", features = ["derive"] }

serde_json = "=1.0.151"

[features]
default = []
sqlite = ["dep:rusqlite"]
surreal = []
