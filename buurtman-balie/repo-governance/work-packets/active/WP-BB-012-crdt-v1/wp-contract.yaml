- crates/buurtman-balie-collaboration/tests/draft.rs
- src/contracts.rs
- src/service.rs
outstanding_acceptance:
- Resource-safe arbitrary binary ingress/rehydration or selected host-isolated decoder; malformed/depth/allocation/range proof
- Real-host durable collaboration persistence/acknowledgment, canonical reread, restart/replay and process races
- Membership/authorization, unique replica allocation, causal-state bounds, generation/retention/compaction/restore policy
- Explicit host publication CAS/receipt races/restart while preserving unrelated CRM fields and host ownership
- Future exact-pin Rust/Yjs interoperability; not required for first Rust-only component and not claimed implemented
ownership:
  manifests_lock_builds: Root
  new_crate_source_tests: Root assigns reuse agent bounded ownership after contract ready; no other product writes.
  contract_state_spec_taskboard: Specification-Coordinator
proof_boundary: Component closure may be reported independently, but whole WP remains in_progress until full retained
  acceptance is proven. Host integration, durability, retention and optional interop must remain visibly outstanding.
execution_gate: Corrected exact contract ready for root source/test assignment following root-selected completed
  reuse-source findings. No raw import/serde ingress/custom parser authorized; full-WP closure remains gated.
retracted_premise: Earlier bytecap plus temporary-document postvalidation did not prove decoder memory/stack bounds;
  raw-binary first-unit acceptance is invalid. Published Any::decode recursive values and count-based reservations
  require separate resource control. Opaque provenance is the candidate boundary, not a completed decoder proof.
